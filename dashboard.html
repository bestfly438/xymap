<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新塬镇应急避险指挥系统 - 数据看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --border-light: #273549;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --primary: #ef4444;
  --primary-glow: rgba(239,68,68,0.3);
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.3);
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(239,68,68,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.03) 0%, transparent 50%);
}

/* ===== 顶栏 ===== */
.topbar {
  background: rgba(17,24,39,0.85);
  border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.topbar .logo { display: flex; align-items: center; gap: 14px; }
.topbar .logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  box-shadow: 0 0 20px var(--primary-glow);
}
.topbar .logo-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.topbar .logo-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.topbar .top-actions { display: flex; align-items: center; gap: 14px; }
.topbar .weather-badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(30,41,59,0.8); padding: 8px 18px; border-radius: 24px;
  font-size: 13px; color: var(--text-secondary); border: 1px solid var(--border);
}
.topbar .weather-badge .wt { font-size: 22px; }
.topbar .weather-badge .wtemp { font-weight: 700; color: var(--text); font-size: 15px; }
.topbar .btn {
  padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); text-decoration: none;
  display: flex; align-items: center; gap: 6px;
}
.topbar .btn:hover { background: var(--bg-card-hover); border-color: var(--border-light); color: var(--text); }
.topbar .btn-primary {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff; border-color: transparent;
  box-shadow: 0 0 20px var(--primary-glow);
}
.topbar .btn-primary:hover { box-shadow: 0 0 30px rgba(239,68,68,0.5); transform: translateY(-1px); }
.topbar .time-display { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* ===== 主容器 ===== */
.container { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }

/* ===== 预警横幅 ===== */
.alert-banner {
  border-radius: var(--radius); padding: 16px 24px; margin-bottom: 24px;
  display: flex; align-items: center; gap: 14px; border: 1px solid;
  animation: slideDown 0.4s ease; position: relative; overflow: hidden;
}
.alert-banner::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.alert-banner.warning { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
.alert-banner.warning::before { background: #f59e0b; }
.alert-banner.danger { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); }
.alert-banner.danger::before { background: #ef4444; }
.alert-banner .alert-icon { font-size: 28px; flex-shrink: 0; }
.alert-banner .alert-text h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.alert-banner.warning .alert-text h3 { color: #f59e0b; }
.alert-banner.danger .alert-text h3 { color: #ef4444; }
.alert-banner .alert-text p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 统计卡片行 ===== */
.stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px 18px;
  border: 1px solid var(--border); transition: var(--transition);
  position: relative; overflow: hidden; cursor: default;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
.stat-card .sc-icon {
  width: 42px; height: 42px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;
}
.sc-icon.red { background: rgba(239,68,68,0.12); color: #ef4444; }
.sc-icon.blue { background: rgba(59,130,246,0.12); color: #3b82f6; }
.sc-icon.green { background: rgba(34,197,94,0.12); color: #22c55e; }
.sc-icon.orange { background: rgba(245,158,11,0.12); color: #f59e0b; }
.sc-icon.purple { background: rgba(139,92,246,0.12); color: #8b5cf6; }
.sc-icon.cyan { background: rgba(6,182,212,0.12); color: #06b6d4; }
.stat-card .sc-num { font-size: 36px; font-weight: 800; color: var(--text); line-height: 1.1; }
.stat-card .sc-num .sc-unit { font-size: 16px; font-weight: 500; color: var(--text-muted); margin-left: 4px; }
.stat-card .sc-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
.stat-card .sc-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; opacity: 0.7; }
.stat-card .sc-glow {
  position: absolute; top: -20px; right: -20px; width: 80px; height: 80px;
  border-radius: 50%; opacity: 0.06; pointer-events: none;
}
.stat-card:nth-child(1) .sc-glow { background: #ef4444; }
.stat-card:nth-child(2) .sc-glow { background: #f59e0b; }
.stat-card:nth-child(3) .sc-glow { background: #22c55e; }
.stat-card:nth-child(4) .sc-glow { background: #3b82f6; }
.stat-card:nth-child(5) .sc-glow { background: #8b5cf6; }
.stat-card:nth-child(6) .sc-glow { background: #06b6d4; }

/* ===== 区块标题 ===== */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; margin-top: 8px;
}
.section-title {
  font-size: 17px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.section-title .st-dot { width: 4px; height: 20px; border-radius: 2px; }
.section-title .st-dot.red { background: #ef4444; }
.section-title .st-dot.blue { background: #3b82f6; }
.section-title .st-dot.green { background: #22c55e; }
.section-title .st-dot.purple { background: #8b5cf6; }
.section-subtitle { font-size: 12px; color: var(--text-muted); }

/* ===== 村庄网格 ===== */
.village-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
.village-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 18px 16px;
  border: 1px solid var(--border); cursor: pointer; transition: var(--transition);
  position: relative; overflow: hidden;
}
.village-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.village-card:active { transform: scale(0.98); }
.village-card .vc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.village-card .vc-name { font-size: 16px; font-weight: 700; color: var(--text); }
.village-card .vc-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
}
.vc-badge.community { background: rgba(59,130,246,0.15); color: #60a5fa; }
.vc-badge.village { background: rgba(139,92,246,0.15); color: #a78bfa; }
.village-card .vc-stats { display: flex; gap: 16px; margin-bottom: 10px; }
.village-card .vc-stat { text-align: center; }
.village-card .vc-stat .vcs-num { font-size: 22px; font-weight: 800; color: var(--primary); }
.village-card .vc-stat .vcs-label { font-size: 10px; color: var(--text-muted); font-weight: 500; }
.village-card .vc-contact { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.6; }
.village-card .vc-contact .vc-strong { color: var(--text-secondary); font-weight: 600; }
.village-card .vc-hint {
  position: absolute; right: 16px; bottom: 16px; font-size: 11px;
  color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 4px;
  opacity: 0; transition: opacity 0.2s;
}
.village-card:hover .vc-hint { opacity: 1; }
.village-card .vc-accent-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--purple));
  opacity: 0; transition: opacity 0.2s;
}
.village-card:hover .vc-accent-bar { opacity: 1; }

/* ===== 双栏区域 ===== */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }

/* ===== 联系人卡片 ===== */
.contact-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px;
  border: 1px solid var(--border);
}
.contact-card .cc-header {
  font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.contact-card .cc-list { max-height: 420px; overflow-y: auto; }
.contact-card .cc-list::-webkit-scrollbar { width: 4px; }
.contact-card .cc-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.contact-card .cc-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid rgba(30,41,59,0.5); font-size: 13px;
  transition: background 0.15s;
}
.contact-card .cc-item:hover { background: rgba(255,255,255,0.02); }
.contact-card .cc-item:last-child { border-bottom: none; }
.contact-card .cc-name { color: var(--text); font-weight: 600; min-width: 80px; }
.contact-card .cc-role { color: var(--text-secondary); font-size: 12px; flex: 1; margin: 0 12px; }
.contact-card .cc-phone { color: var(--accent); font-size: 12px; font-weight: 500; white-space: nowrap; }

/* ===== 雨量监测站 ===== */
.rain-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px;
  border: 1px solid var(--border);
}
.rain-card .rc-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.rain-card .rc-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: rgba(30,41,59,0.5); border-radius: var(--radius-sm); font-size: 13px;
}
.rain-card .rc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.rain-card .rc-dot.online { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
.rain-card .rc-dot.offline { background: #64748b; }
.rain-card .rc-name { color: var(--text); flex: 0 0 auto; min-width: 72px; font-weight: 600; }
.rain-card .rc-value { color: var(--text-secondary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== 气象预警信息 ===== */
.warn-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px;
  border: 1px solid var(--border); margin-bottom: 28px;
}
.warn-card .wc-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px;
}
.warn-card .wc-meta { margin-left: auto; font-size: 11px; color: var(--text-muted); font-weight: 400; }
.warn-list { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
.warn-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: rgba(30,41,59,0.5); border-radius: var(--radius-sm); font-size: 13px;
  border-left: 3px solid var(--warn-color, #f59e0b);
}
.warn-level {
  flex: 0 0 auto; padding: 3px 10px; border-radius: 4px;
  font-size: 11px; font-weight: 700; color: #fff;
}
.warn-item .warn-title { flex: 1; color: var(--text); line-height: 1.5; }
.warn-item .warn-time { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.warn-empty { text-align: center; color: var(--text-muted); padding: 18px 0; font-size: 13px; }
.warn-ok { text-align: center; color: #22c55e; padding: 16px 0; font-size: 14px; font-weight: 600; }

/* ===== 进入地图 ===== */
.map-entry { text-align: center; margin: 36px 0 16px; }
.map-entry a {
  display
