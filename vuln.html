<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<title>易发性分析 - 新塬镇应急避险指挥系统</title>
<link rel="stylesheet" href="leaflet/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; background: #e8e8e8; }

#map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: linear-gradient(135deg, #d32f2f, #b71c1c);
  color: #fff; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
#topbar .logo-area { display: flex; align-items: center; gap: 8px; min-width: 0; }
#topbar .logo-icon {
  width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
#topbar h1 { font-size: 16px; white-space: nowrap; }
#topbar .sub { font-size: 11px; opacity: .85; margin-top: 2px; }
#topbar .nav-links { display: flex; align-items: center; gap: 8px; }
.back-link {
  color: #fff; text-decoration: none; font-size: 12px;
  background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 16px;
  white-space: nowrap;
}

/* 控制面板 */
#ctrl-panel {
  position: fixed; right: 12px; top: 70px; z-index: 999;
  width: 210px; background: rgba(255,255,255,.96); border-radius: 12px;
  box-shadow: 0 3px 14px rgba(0,0,0,.18); padding: 12px;
}
#ctrl-panel .cp-title { font-size: 14px; font-weight: 700; color: #b71c1c; margin-bottom: 10px; }
.cp-row { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
.cp-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.cp-row .cp-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.cp-row .cp-name input[type=checkbox] { width: 16px; height: 16px; accent-color: #d32f2f; }
.cp-modes { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.cp-modes label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.cp-modes input[type=radio] { width: 15px; height: 15px; accent-color: #d32f2f; }
.cp-row .cp-slider { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.cp-row .cp-slider input[type=range] { flex: 1; accent-color: #d32f2f; }
.cp-row .cp-slider span { font-size: 11px; color: #666; width: 34px; text-align: right; }
.cp-hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.5; }

/* 图例 */
#legend {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 998; background: rgba(255,255,255,.95); border-radius: 10px;
  padding: 8px 14px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 12px; flex-wrap: wrap;
  justify-content: center;
}
#legend .lg-title { font-weight: 700; color: #555; }
#legend .l-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
#legend .l-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); flex-shrink: 0; }

/* 图例折叠按钮 / 底部工具栏 / 图层弹出面板：默认隐藏，仅移动端显示 */
#legend-toggle { display: none; }
#bottom-bar { display: none; }
#layer-sheet { display: none; }

@media (max-width: 768px) {
  #topbar { padding: 8px 10px; }
  #topbar h1 { font-size: 14px; }
  #topbar .sub { display: none; }
  .back-link { font-size: 11px; padding: 5px 9px; }

  /* 控制面板收进底部"图层"弹出面板，不再常驻右侧 */
  #ctrl-panel { display: none; }

  /* 图例：默认折叠为左下角小按钮，点击展开 */
  #legend { display: none; bottom: 80px; left: 8px; right: auto; transform: none; justify-content: flex-start; font-size: 11px; }
  #legend.open {
    display: flex; max-height: 46vh; overflow-y: auto;
    align-items: flex-start; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.97);
  }
  #legend-toggle {
    display: flex; align-items: center; justify-content: center;
    position: fixed; bottom: 80px; left: 8px; z-index: 996;
    height: 34px; padding: 0 14px; border-radius: 17px;
    background: rgba(255,255,255,.95); border: 1px solid rgba(15,23,42,.12);
    color: #1e293b; font-size: 12px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    cursor: pointer; gap: 5px;
  }
  #legend-toggle.active { background: #dc2626; color: #fff; border-color: #dc2626; }

  /* 底部工具栏：图层 / 图例 / 返回地图 */
  #bottom-bar {
    display: flex; align-items: center; justify-content: space-around;
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 1002;
    background: rgba(255,255,255,.97); border: 1px solid rgba(15,23,42,.12);
    border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
    padding: 5px 6px;
  }
  #bottom-bar button, #bottom-bar .bb-link {
    flex: 1; max-width: 76px;
    background: none; border: none; color: #475569;
    font-size: 10px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; border-radius: 14px; text-decoration: none;
  }
  #bottom-bar button .bb-ico, #bottom-bar .bb-link .bb-ico { font-size: 19px; line-height: 1; }
  #bottom-bar button.active,
  #bottom-bar button:active { color: #dc2626; background: rgba(220,38,38,.08); }

  /* 图层控制弹出面板 */
  #layer-sheet {
    position: fixed; left: 8px; right: 8px; bottom: 66px; z-index: 1002;
    background: rgba(255,255,255,.98); border: 1px solid rgba(15,23,42,.12);
    border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
    padding: 10px 12px;
  }
  #layer-sheet.show { display: block; }
  #layer-sheet .ls-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 700; color: #1e293b;
    padding-bottom: 8px; border-bottom: 1px solid rgba(15,23,42,.08);
    margin-bottom: 8px;
  }
  #layer-sheet .ls-close {
    cursor: pointer; color: #64748b; font-size: 16px;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  #layer-sheet .ls-close:active { background: rgba(15,23,42,.08); }
  #layer-sheet .cp-row { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
  #layer-sheet .cp-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div class="logo-area">
    <div class="logo-icon">&#x1F3D4;</div>
    <div>
      <h1>山洪与泥石流易发性分析</h1>
      <div class="sub">甘肃省白银市会宁县新塬镇 · 四级分区 · 叠加卫星影像</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="map.html?v=v20260816-13" class="back-link">&#x1F5FA; 返回地图</a>
    <a href="dashboard.html?v=v20260816-13" class="back-link">&#x2190; 返回看板</a>
  </div>
</div>

<div id="ctrl-panel">
  <div class="cp-title">图层控制</div>
  <div class="cp-row">
    <div class="cp-name">显示图层</div>
    <div class="cp-modes">
      <label><input type="radio" name="layer-mode" value="flood" checked> 山洪易发性</label>
      <label><input type="radio" name="layer-mode" value="mud"> 泥石流易发性</label>
      <label><input type="radio" name="layer-mode" value="both"> 叠加对比</label>
    </div>
  </div>
  <div class="cp-row">
    <div class="cp-name">山洪透明度</div>
    <div class="cp-slider">
      <input type="range" id="op-flood" min="0" max="100" value="55">
      <span id="op-flood-v">55%</span>
    </div>
  </div>
  <div class="cp-row">
    <div class="cp-name">泥石流透明度</div>
    <div class="cp-slider">
      <input type="range" id="op-mud" min="0" max="100" value="55">
      <span id="op-mud-v">55%</span>
    </div>
  </div>
  <div class="cp-hint">提示：默认单选显示一个图层，避免两图层色块重叠；选择"叠加对比"可同时查看两者，并分别调节透明度。卫星影像始终位于分区图层之下。</div>
</div>

<div id="legend">
  <span class="lg-title">易发性等级</span>
  <span class="l-item"><span class="l-dot" style="background:#00cc66"></span>低易发</span>
  <span class="l-item"><span class="l-dot" style="background:#ffdd00"></span>较低易发</span>
  <span class="l-item"><span class="l-dot" style="background:#ff8800"></span>较高易发</span>
  <span class="l-item"><span class="l-dot" style="background:#ff1a1a"></span>高易发</span>
</div>

<!-- 图例折叠按钮（手机端显示） -->
<button id="legend-toggle" onclick="toggleLegend()">&#x1F4D0;&nbsp;图例</button>

<!-- 移动端底部工具栏：图层/图例/返回（类APP） -->
<div id="bottom-bar">
  <button id="bb-layers" title="图层控制" onclick="toggleLayerSheet()"><span class="bb-ico">&#x1F3D4;</span>图层</button>
  <button id="bb-legend" title="图例" onclick="toggleLegend()"><span class="bb-ico">&#x1F4D0;</span>图例</button>
  <a class="bb-link" href="map.html?v=v20260816-13" title="返回地图">&#x1F5FA;<span>返回地图</span></a>
</div>

<!-- 移动端图层控制弹出面板 -->
<div id="layer-sheet">
  <div class="ls-header"><span>图层控制</span><span class="ls-close" onclick="toggleLayerSheet()">&#x2715;</span></div>
  <div class="cp-row">
    <div class="cp-name">显示图层</div>
    <div class="cp-modes">
      <label><input type="radio" name="layer-mode-m" value="flood" checked> 山洪易发性</label>
      <label><input type="radio" name="layer-mode-m" value="mud"> 泥石流易发性</label>
      <label><input type="radio" name="layer-mode-m" value="both"> 叠加对比</label>
    </div>
  </div>
  <div class="cp-row">
    <div class="cp-name">山洪透明度</div>
    <div class="cp-slider">
      <input type="range" id="op-flood-m" min="0" max="100" value="55">
      <span id="op-flood-m-v">55%</span>
    </div>
  </div>
  <div class="cp-row">
    <div class="cp-name">泥石流透明度</div>
    <div class="cp-slider">
      <input type="range" id="op-mud-m" min="0" max="100" value="55">
      <span id="op-mud-m-v">55%</span>
    </div>
  </div>
  <div class="cp-hint">提示：单选模式避免两图层色块重叠；"叠加对比"可同时查看并分别调节透明度。</div>
</div>

<script src="leaflet/leaflet.js" defer></script>
<script src="js_data/vuln_data.js" defer></script>
<script>
var map = null;
var layerFlood = null, layerMud = null;
var MAP_CENTER = [36.152, 105.39];
var MAP_BOUNDS = [[35.88, 104.9], [36.42, 105.9]];

// 分级配色（1低 2较低 3较高 4高）- 高饱和醒目色
var CLASS_COLORS = ['#00cc66', '#ffdd00', '#ff8800', '#ff1a1a'];

function styleFor(data, fillOpacity) {
  return function(feature) {
    var gc = feature.properties.gridcode || 1;
    return {
      color: '#000000', weight: 1, opacity: 0.85,
      fillColor: CLASS_COLORS[Math.min(Math.max(gc, 1), 4) - 1],
      fillOpacity: fillOpacity
    };
  };
}

function initMap() {
  map = L.map('map', {
    center: MAP_CENTER,
    zoom: 13,
    minZoom: 10,
    maxBounds: MAP_BOUNDS,
    maxBoundsViscosity: 0.8,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 高德卫星影像底图（GCJ02，位于最底层）+ 路网叠加
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'], maxZoom: 18, minZoom: 3
  }).addTo(map);
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'], maxZoom: 18, minZoom: 3, opacity: 0.6
  }).addTo(map);

  layerFlood = L.geoJSON(VULN_FLOOD, { style: styleFor(VULN_FLOOD, 0.55) });
  layerMud = L.geoJSON(VULN_MUD, { style: styleFor(VULN_MUD, 0.55) });
  applyMode(); // 按当前单选状态只显示对应图层，避免叠加

  // 手机端：点击地图空白处自动收起图例/图层面板，避免遮挡
  map.on('click', function() {
    if (window.innerWidth <= 768) {
      var lg = document.getElementById('legend');
      if (lg && lg.classList.contains('open')) {
        lg.classList.remove('open');
        var b = document.getElementById('legend-toggle');
        if (b) b.classList.remove('active');
      }
      var sh = document.getElementById('layer-sheet');
      if (sh && sh.classList.contains('show')) {
        sh.classList.remove('show');
        var bb = document.getElementById('bb-layers');
        if (bb) bb.classList.remove('active');
      }
    }
  });
}

function setFloodOpacity(v) { if (layerFlood) layerFlood.setStyle(styleFor(VULN_FLOOD, v / 100)); }
function setMudOpacity(v) { if (layerMud) layerMud.setStyle(styleFor(VULN_MUD, v / 100)); }

// 单选模式：默认只显示一个图层，避免重叠
function applyMode() {
  var mode = document.querySelector('input[name="layer-mode"]:checked, input[name="layer-mode-m"]:checked').value;
  var showFlood = (mode === 'flood' || mode === 'both');
  var showMud = (mode === 'mud' || mode === 'both');
  if (showFlood) { if (!map.hasLayer(layerFlood)) layerFlood.addTo(map); }
  else { map.removeLayer(layerFlood); }
  if (showMud) { if (!map.hasLayer(layerMud)) layerMud.addTo(map); }
  else { map.removeLayer(layerMud); }
}
// 两组单选控件（PC右侧面板 + 移动端弹出面板）互相联动
function syncModeRadios(src) {
  var val = src.value;
  document.querySelectorAll('input[name="layer-mode"], input[name="layer-mode-m"]').forEach(function(rb) {
    rb.checked = (rb.value === val);
  });
}
function bindMode(name) {
  document.querySelectorAll('input[name="' + name + '"]').forEach(function(rb) {
    rb.addEventListener('change', function() {
      syncModeRadios(this);
      applyMode();
    });
  });
}
bindMode('layer-mode');
bindMode('layer-mode-m');

// 透明度滑块（PC + 移动端两套，共用图层样式更新）
function bindOpacity(sliderId, valId, fn) {
  document.getElementById(sliderId).addEventListener('input', function(e) {
    document.getElementById(valId).textContent = e.target.value + '%';
    fn(parseInt(e.target.value, 10));
  });
}
bindOpacity('op-flood', 'op-flood-v', setFloodOpacity);
bindOpacity('op-mud', 'op-mud-v', setMudOpacity);
bindOpacity('op-flood-m', 'op-flood-m-v', setFloodOpacity);
bindOpacity('op-mud-m', 'op-mud-m-v', setMudOpacity);

// 移动端：图例折叠 / 图层控制面板
function toggleLegend() {
  var lg = document.getElementById('legend');
  var btn = document.getElementById('legend-toggle');
  if (!lg) return;
  var open = lg.classList.toggle('open');
  if (btn) btn.classList.toggle('active', open);
}
function toggleLayerSheet() {
  var sh = document.getElementById('layer-sheet');
  var btn = document.getElementById('bb-layers');
  if (!sh) return;
  var open = sh.classList.toggle('show');
  if (btn) btn.classList.toggle('active', open);
}

// 版本自检：version.txt 变化则自动刷新
fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var v = (txt || '').trim();
    var cur = localStorage.getItem('xyy_version');
    if (cur && cur !== v) { localStorage.setItem('xyy_version', v); location.reload(); }
    localStorage.setItem('xyy_version', v);
  }).catch(function() {});

window.onload = initMap;
</script>
<script>
// 返回看板链接附加时间戳，避免手机浏览器缓存导致数据不刷新
(function(){var l=document.querySelectorAll('a[href*="dashboard.html"]');for(var i=0;i<l.length;i++)l[i].setAttribute('href',l[i].getAttribute('href').split('?')[0]+'?_t='+Date.now());})();
</script>
</body>
</html>
