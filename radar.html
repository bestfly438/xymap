<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #eef2f7;
  --bg-card: #ffffff;
  --bg-card-hover: #f7f9fc;
  --border: #e3e8f0;
  --border-light: #d1d8e6;
  --text: #14213d;
  --text-secondary: #8a95ad;
  --text-muted: #8a95ad;
  --primary: #2f6fed;
  --accent: #2f6fed;
  --success: #22a55b;
  --warning: #ee8b24;
  --danger: #e2444a;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
  font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(239,68,68,0.04) 0%, transparent 50%);
}
/* 顶栏 */
.topbar {
  background: rgba(255,255,255,0.92);
  border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.topbar .logo { display: flex; align-items: center; gap: 14px; }
.topbar .logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #2f6fed, #1a4a7a);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  box-shadow: 0 0 20px rgba(59,130,246,0.3);
}
.topbar .logo-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.topbar .logo-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.topbar .btn {
  padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); text-decoration: none;
  display: flex; align-items: center; gap: 6px;
}
.topbar .btn:hover { background: var(--bg-card-hover); border-color: var(--border-light); color: var(--text); }
.topbar .btn-primary {
  background: linear-gradient(135deg, #1a4a7a, #12314f);
  color: #fff; border-color: transparent;
}
.topbar .top-actions { display: flex; gap: 10px; }
/* 主容器 */
.container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
.page-head { margin-bottom: 22px; }
.page-head h2 {
  font-size: 22px; font-weight: 800; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.page-head .ph-sub { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.7; }
/* Tab 切换 */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tab-btn {
  padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); flex: 1; max-width: 260px;
  white-space: nowrap;
}
.tab-btn.active {
  background: linear-gradient(135deg, #2f6fed, #1a4a7a);
  color: #fff; border-color: transparent;
}
/* 图像卡片 */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
}
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-head .meta { margin-left: auto; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta .t-status { color: var(--success); }
.meta .t-status.err { color: var(--danger); }
/* 区域切换 */
.area-switch { display: flex; gap: 8px; margin-bottom: 14px; }
.area-btn {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary);
}
.area-btn.active { background: rgba(47,111,237,0.12); color: var(--accent); border-color: rgba(59,130,246,0.4); }
/* 雷达图容器 */
.radar-frame {
  background: #060b14; border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: hidden; position: relative; text-align: center; min-height: 320px;
  display: flex; align-items: center; justify-content: center;
}
.radar-frame img {
  max-width: 100%; max-height: 78vh; display: block;
}
.radar-frame .loading {
  color: var(--text-muted); font-size: 14px; padding: 60px 0;
}
/* 图例 */
.legend {
  margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: rgba(20,33,61,0.05); font-size: 12px;
}
.legend .lg-title { font-weight: 700; color: var(--text); margin-bottom: 8px; }
.legend .lg-row { display: flex; align-items: center; gap: 6px; margin: 6px 0; color: var(--text-secondary); flex-wrap: wrap; }
.lg-color { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
.lg-item { display: flex; align-items: center; gap: 6px; margin-right: 14px; }
/* 说明 */
.note { font-size: 12px; color: var(--text-muted); line-height: 1.8; }
.note a { color: var(--accent); text-decoration: none; }
/* 按钮 */
.btn-refresh {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text); display: inline-flex; align-items: center; gap: 6px;
}
.btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
.footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px; opacity: 0.6; }

@media (max-width: 640px) {
  .topbar { padding: 0 14px; height: 52px; }
  .topbar .logo-text h1 { font-size: 14px; }
  .topbar .logo-text p { display: none; }
  .container { padding: 18px 14px 40px; }
  .card { padding: 16px; }
  .tab-btn { max-width: none; padding: 10px 10px; font-size: 13px; }
  .card-head .meta { margin-left: 0; width: 100%; }
}
/* ===== 界面细节打磨（make-interfaces-feel-better）===== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,a,.btn,input,select{touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:not(:disabled):active{transform:scale(.96)}

var CURRENT_INDEX = 0;          // 当前 Tab 索引
var CURRENT_VARIANT = {};       // 各 Tab 当前子项索引
var REFRESH_MS = 10 * 60 * 1000;
var timer = null;
var imgCache = {};              // key:variant → 图片URL（避免切换时重复请求）

// 渲染 Tab 栏与各产品面板
function renderPanels() {
  var tabBar = document.getElementById('tabBar');
  var panels = document.getElementById('panels');
  tabBar.innerHTML = '';
  panels.innerHTML = '';
  PRODUCTS.forEach(function(p, idx) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = p.icon + ' ' + p.name;
    btn.onclick = function() { switchTab(idx); };
    tabBar.appendChild(btn);

    CURRENT_VARIANT[idx] = 0;
    var panel = document.createElement('div');
    panel.className = 'card';
    panel.id = 'panel' + p.key;
    panel.style.display = idx === 0 ? 'block' : 'none';

    var head = '<div class="card-head"><h3>' + p.icon + ' ' + p.name + '图 <span class="sub-name" style="font-size:12px;color:var(--text-muted);font-weight:400;">' + p.variants[0].sub + '</span></h3>';
    head += '<div class="meta"><span class="t-status">加载中…</span><span class="prod-time"></span>';
    head += '<button class="btn-refresh" onclick="loadProduct(' + idx + ',true)"><svg viewBox="0 0 24 24" fill="none" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>立即刷新</button></div></div>';

    var areaHtml = '';
    if (p.variants.length > 1) {
      areaHtml = '<div class="area-switch">';
      p.variants.forEach(function(v, vi) {
        areaHtml += '<button class="area-btn' + (vi === 0 ? ' active' : '') + '" onclick="setVariant(' + idx + ',' + vi + ')">' + v.sub + '</button>';
      });
      areaHtml += '</div>';
    }

    var legendHtml = '';
    if (p.legendTitle) {
      legendHtml = '<button type="button" class="lg-toggle" onclick="this.nextElementSibling.classList.toggle(\'show\')"><svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.3-1 .8-1 1.7M12 16.5v.2"/></svg>图例</button>'
        + '<div class="legend lg-pop"><div class="lg-title">' + p.legendTitle + '</div><div class="lg-row">';
      (p.legend || []).forEach(function(l) {
        legendHtml += '<span class="lg-item"><span class="lg-color" style="background:' + l[0] + '"></span>' + l[1] + '</span>';
      });
      legendHtml += '</div>';
      if (p.tip) legendHtml += '<div class="lg-row" style="margin-top:8px;">' + p.tip + '</div>';
      legendHtml += '</div>';
    }

    panel.innerHTML = head + areaHtml +
      '<div class="radar-frame"><img id="img' + p.key + '" alt="' + p.name + '" style="display:none" onclick="window.open(this.src,\'_blank\')">' +
      '<div class="loading">正在获取最新' + p.name + '...</div></div>' + legendHtml;
    panels.appendChild(panel);
  });
}

function radarAuth() {
  return {
    'Content-Type': 'application/json; charset=utf-8',
    'x-xyc-key': sessionStorage.getItem('xyc_key') || '',
    'x-xyc-device': sessionStorage.getItem('xyc_device') || ''
  };
}
function radarApi(payload, cb) {
  var key = sessionStorage.getItem('xyc_key') || '';
  var device = sessionStorage.getItem('xyc_device') || '';
  if (!key || !device) { cb(null, '未登录或会话失效'); return; }
  fetch(FEISHU_CONFIG.apiBase + '/api/radar', {
    method: 'POST',
    headers: radarAuth(),
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d && d.code === 401) { try { sessionStorage.clear(); } catch(e) {} window.location.replace('index.html'); return; }
    if (d && d.code === 0) cb(d.data, null);
    else cb(null, (d && d.msg) || '获取失败');
  })
  .catch(function(e) { cb(null, '网络错误: ' + e.message); });
}

function loadProduct(idx, force) {
  var p = PRODUCTS[idx];
  var vi = CURRENT_VARIANT[idx] || 0;
  var v = p.variants[vi];
  var panel = document.getElementById('panel' + p.key);
  var st = panel.querySelector('.t-status');
  var timeEl = panel.querySelector('.prod-time');
  var subEl = panel.querySelector('.sub-name');
  var img = panel.querySelector('img');
  var load = panel.querySelector('.loading');
  if (subEl) subEl.textContent = v.sub;
  if (!force) st.textContent = '加载中…';
  else st.textContent = '刷新中…';

  var cacheKey = JSON.stringify(v.payload);
  if (imgCache[cacheKey] && !force) {
    setImg(p, img, load, st, imgCache[cacheKey]);
    if (timeEl) timeEl.textContent = imgCache[cacheKey].time ? ('产品制作 ' + imgCache[cacheKey].time) : '';
    return;
  }
  radarApi(v.payload, function(data, err) {
    if (err || !data || !data.url) {
      load.style.display = 'block';
      load.textContent = err || '获取失败，请点击立即刷新重试';
      st.textContent = '加载失败'; st.className = 't-status err';
      return;
    }
    imgCache[cacheKey] = data;
    if (timeEl) timeEl.textContent = data.time ? ('产品制作 ' + data.time) : '';
    setImg(p, img, load, st, data);
  });
}

function setImg(p, img, load, st, data) {
  img.onload = function() {
    img.style.display = 'block';
    if (load) load.style.display = 'none';
    if (st) { st.textContent = '&#x2705; 已更新'; st.className = 't-status'; }
  };
  img.onerror = function() {
    img.style.display = 'none';
    if (load) { load.style.display = 'block'; load.textContent = '图像加载失败，请点击立即刷新'; }
    if (st) { st.textContent = '加载失败'; st.className = 't-status err'; }
  };
  img.src = data.url;
}

function switchTab(idx) {
  CURRENT_INDEX = idx;
  var btns = document.getElementById('tabBar').children;
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', i === idx);
  PRODUCTS.forEach(function(p, i) {
    document.getElementById('panel' + p.key).style.display = i === idx ? 'block' : 'none';
  });
  loadProduct(idx, false);
  restartTimer();
}

function setVariant(idx, vi) {
  CURRENT_VARIANT[idx] = vi;
  var p = PRODUCTS[idx];
  var panel = document.getElementById('panel' + p.key);
  var btns = panel.querySelectorAll('.area-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', i === vi);
  loadProduct(idx, true);
  restartTimer();
}

function restartTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(function() { loadProduct(CURRENT_INDEX, true); }, REFRESH_MS);
}

// 初始加载
renderPanels();
loadProduct(0, false);
restartTimer();
</script>
