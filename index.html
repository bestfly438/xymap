<style>
:root {
  --bg: #eef2f7;
  --bg-card: #ffffff;
  --border: #e2e8f0;
  --border-light: #cbd5e1;
  --text: #1e293b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --primary: #2f6fed;
  --primary-glow: rgba(47,111,237,0.2);
  --radius: 12px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  color-scheme: light;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background: var(--bg);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.css-bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: linear-gradient(180deg, #4a93dc 0%, #7db8ee 36%, #abd6f6 62%, #e3f4fd 85%, #f4faff 100%);
}
.css-bg .sun {
  position: absolute; top: 8%; right: 11%; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,250,225,0.55) 32%, rgba(255,255,255,0) 68%);
  filter: blur(3px);
}
.css-bg .cloud {
  position: absolute; height: 32px; border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 100%);
  filter: blur(5px);
}
.css-bg svg.mountain { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; display: block; }
.css-bg svg.birds { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 50%; display: block; pointer-events: none; }
.css-bg .river {
  fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 14 9;
  filter: drop-shadow(0 0 5px rgba(190,232,255,0.9));
}
.bg-veil {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(15,23,42,0.32) 0%, rgba(15,23,42,0.18) 55%, rgba(15,23,42,0.46) 100%),
    linear-gradient(rgba(15,23,42,0.16) 0%, rgba(15,23,42,0.30) 100%);
}
.bg-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(15,23,42,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
}
.login-card {
  position: relative; z-index: 1;
  width: 420px; max-width: 92vw;
  background: rgba(255,255,255,0.10);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  backdrop-filter: blur(18px) saturate(1.5);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 20px 60px rgba(15,23,42,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  padding: 48px 40px 40px;
}
/* 老浏览器不支持 backdrop-filter 时回退为实底白卡片，保证可读 */
@supports not ((backdrop-filter: blur(0)) or (-webkit-backdrop-filter: blur(0))) {
  .login-card { background: rgba(255,255,255,0.96); }
}
@keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.login-header { text-align: center; margin-bottom: 36px; }
.login-header .shield {
  width: 64px; height: 64px; margin: 0 auto 16px;
  background: linear-gradient(135deg, #2f6fed, #1a4a7a);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: #fff; box-shadow: 0 0 24px rgba(47,111,237,0.4);
}
.login-header h1 { font-size: 22px; color: rgba(255,255,255,0.96); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(15,23,42,0.35); }
.login-header p { font-size: 13px; color: rgba(255,255,255,0.72); }
.input-group { margin-bottom: 24px; }
.input-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.85); margin-bottom: 8px; font-weight: 500; }
.input-group input {
  width: 100%; height: 48px; padding: 0 16px;
  border: 1px solid rgba(255,255,255,0.28); border-radius: 10px;
  background: rgba(255,255,255,0.14); font-size: 15px; color: #fff; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
  letter-spacing: 1px;
}
.input-group input::placeholder { color: rgba(255,255,255,0.5); }
.input-group input:focus { border-color: #7aa6ff; box-shadow: 0 0 0 3px rgba(122,166,255,0.28); }
.input-group input.error { border-color: #e2444a; animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.login-btn {
  width: 100%; height: 48px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #2f6fed, #1a4a7a);
  color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 0 20px var(--primary-glow);
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(47,111,237,0.35); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.error-msg { text-align: center; color: #ff7a80; font-size: 13px; margin-top: 12px; min-height: 20px; text-shadow: 0 1px 3px rgba(15,23,42,0.4); }
.footer { text-align: center; margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.6); }
.footer span { color: #8ab6ff; }
@media (max-width: 480px) {
  .login-card { padding: 36px 24px 32px; }
  .login-header h1 { font-size: 19px; }
}
/* ===== 无障碍与动效偏好（reduced-motion / 键盘焦点）===== */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
/* ===== 界面细节打磨（make-interfaces-feel-better）===== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,a,.btn,input,select{touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:not(:disabled):active{transform:scale(.96)}
</style>

<script>
// ========== 自动版本检测：发现版本更新强制刷新，避免浏览器缓存旧页面（无需手动清缓存） ==========
(function() {
  try {
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.text(); })
      .then(function(v) {
        v = (v || '').trim();
        if (!v) return;
        var cur = sessionStorage.getItem('xyc_app_version');
        if (cur && cur !== v) {
          sessionStorage.setItem('xyc_app_version', v);
          location.reload(true);
        } else {
          sessionStorage.setItem('xyc_app_version', v);
        }
      })
      .catch(function() {});
  } catch(e) {}
})();

(function() {
  // 如果已经登录，直接跳转（带版本参数绕过缓存）
  if (sessionStorage.getItem('xyc_auth') === '1') {
    window.location.replace('dashboard.html?v=v20260901-37');
  }
})();

var input = document.getElementById('keyInput');
var btn = document.getElementById('loginBtn');
var error = document.getElementById('errorMsg');

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
  error.textContent = '';
  input.classList.remove('error');
});

input.addEventListener('input', function() {
  // 自动转大写
  var val = input.value;
  var upper = val.toUpperCase();
  if (upper.length <= 20) input.value = upper;
});

// 生成/复用设备标识（本机固定，用于设备绑定）
function getDeviceToken() {
  var d = localStorage.getItem('xyc_device');
  if (!d) {
    d = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
    localStorage.setItem('xyc_device', d);
  }
  return d;
}

function doLogin() {
  var key = input.value.trim();
  if (!key) {
    showError('请输入访问密钥');
    return;
  }
  btn.textContent = '正在验证…';
  btn.disabled = true;
  fetch(FEISHU_CONFIG.apiBase + '/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json; charset=utf-8' },
    body: JSON.stringify({ key: key, device_token: getDeviceToken() })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data && data.code === 0 && data.data) {
      var d = data.data;
      sessionStorage.setItem('xyc_auth', '1');
      sessionStorage.setItem('xyc_key', d.key);
      sessionStorage.setItem('xyc_label', d.label || '');
      sessionStorage.setItem('xyc_role', d.role || '村级');
      sessionStorage.setItem('xyc_village', d.village || '');
      sessionStorage.setItem('xyc_device', getDeviceToken());
      btn.textContent = '验证通过，正在进入…';
      setTimeout(function() {
        // 带版本参数跳转：绕过浏览器缓存，确保每次都加载最新版看板页面
        window.location.replace('dashboard.html?v=v20260901-37');
      }, 500);
    } else {
      btn.textContent = '进入系统';
      btn.disabled = false;
      showError((data && data.msg) || '登录失败，请稍后重试');
    }
  })
  .catch(function() {
    btn.textContent = '进入系统';
    btn.disabled = false;
    showError('网络错误，请检查网络后重试');
  });
}

function showError(msg) {
  error.textContent = msg;
  input.classList.add('error');
  setTimeout(function() { input.classList.remove('error'); }, 400);
}
</script>
<script>
// bfcache 返回强制刷新：从其他页面返回本页时若浏览器恢复旧快照，异步数据可能停留在空状态
window.addEventListener('pageshow', function(e) {
  var need = false;
  if (e.persisted) need = true;
  if (!need) {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if ((nav && nav.type === 'back_forward') || (performance.navigation && performance.navigation.type === 2)) need = true;
  }
  if (need) window.location.replace(window.location.pathname + '?_r=' + Date.now() + window.location.hash);
});
</script>

<script src="js/gsap/gsap.min.js"></script>
<script>
// ===== 登录页 GSAP 入场动画（测试站）=====
(function () {
  if (typeof gsap === 'undefined') return;
  // 尊重系统"减少动态效果"设置：不播动画，直接显示
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var card = document.querySelector('.login-card');
  var shield = document.querySelector('.shield');
  var h1 = document.querySelector('.login-header h1');
  var sub = document.querySelector('.login-header p');
  var groups = document.querySelectorAll('.input-group');
  var btn = document.querySelector('.login-btn');
  var footer = document.querySelector('.footer');
  if (!card) return;

  // 初始状态（隐藏 + 位移）
  gsap.set(card, { autoAlpha: 0, y: 40, scale: 0.96 });
  gsap.set(shield, { y: -70, scale: 0.4, rotation: -180, autoAlpha: 0 });
  gsap.set([h1, sub], { autoAlpha: 0, y: 24 });
  gsap.set(groups, { autoAlpha: 0, x: -28 });
  gsap.set(btn, { autoAlpha: 0, y: 20 });
  gsap.set(footer, { autoAlpha: 0, y: 12 });

  var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  tl.to(card, { autoAlpha: 1, y: 0, scale: 1, duration: 0.7, clearProps: 'transform' })
    .to(shield, { y: 0, scale: 1, rotation: 0, autoAlpha: 1, duration: 0.9, ease: 'elastic.out(1, 0.45)' }, '-=0.4')
    .to(h1, { autoAlpha: 1, y: 0, duration: 0.55 }, '-=0.55')
    .to(sub, { autoAlpha: 1, y: 0, duration: 0.45 }, '-=0.4')
    .to(groups, { autoAlpha: 1, x: 0, duration: 0.55, stagger: 0.12, clearProps: 'transform' }, '-=0.35')
    .to(btn, { autoAlpha: 1, y: 0, duration: 0.5, clearProps: 'transform' }, '-=0.4')
    .to(footer, { autoAlpha: 1, y: 0, duration: 0.4 }, '-=0.3');

  // 护盾呼吸光效（入场完成后持续循环，仅光晕不碰 transform）
  gsap.to(shield, { boxShadow: '0 0 36px rgba(47,111,237,0.6)', duration: 1.8, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 1.4 });

  // ===== 背景多动效编排（reduced-motion 已在开头整体跳过）=====
  var sky = document.querySelector('.css-bg');
  if (sky) gsap.to(sky, { scale: 1.08, duration: 26, yoyo: true, repeat: -1, ease: 'none' });

  var clouds = document.querySelectorAll('.css-bg .cloud');
  if (clouds.length) gsap.to(clouds, { x: 80, duration: 26, yoyo: true, repeat: -1, ease: 'sine.inOut', stagger: 7 });

  var sun = document.querySelector('.css-bg .sun');
  if (sun) gsap.to(sun, { scale: 1.18, opacity: 0.7, duration: 4.5, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 2 });

  var birds = document.querySelector('.css-bg .birds');
  if (birds) gsap.to(birds, { x: 55, y: -10, duration: 32, yoyo: true, repeat: -1, ease: 'sine.inOut' });

  var river = document.querySelector('.css-bg .river');
  if (river) gsap.to(river, { strokeDashoffset: -46, duration: 7, repeat: -1, ease: 'none' });
})();
</script>
