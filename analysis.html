<script>
/* ================= 按需加载（首屏只加载必要数据，其余切 Tab 时再下载） ================= */
var FLOOD_ZONES = null, VULN_FLOOD = null, VULN_MUD = null, FLOOD_DEPRESSION = null, DEPRESSION_META = null;
var _loading_el = null;
function _showLoad(txt){
  if (!_loading_el) {
    _loading_el = document.createElement('div');
    _loading_el.id = 'loading';
    document.body.appendChild(_loading_el);
  }
  _loading_el.textContent = txt || '正在加载数据…';
  _loading_el.style.display = 'block';
}
function _hideLoad(){ if (_loading_el) _loading_el.style.display = 'none'; }
function _loadScript(src, cb){
  var s = document.createElement('script');
  s.src = src;
  s.onload = function(){ cb(); };
  s.onerror = function(){ _hideLoad(); alert('数据加载失败，请检查网络后重试'); };
  document.head.appendChild(s);
}
function _loadSeq(arr, i, cb){
  if (i >= arr.length) { cb(); return; }
  _loadScript(arr[i] + '?v=v20260901-37', function(){ _loadSeq(arr, i + 1, cb); });
}
// 切换 Tab 前确保该 Tab 所需数据已加载
function ensureTabData(tab, cb){
  var need = [];
  if (tab === 'zone' && !FLOOD_ZONES) need.push('js_data/flood_zones.js');
  if (tab === 'vuln' && !VULN_FLOOD) need.push('js_data/vuln_data.js');
  if (tab === 'pond') {
    if (!FLOOD_DEPRESSION) need.push('js_data/flood_depression.js');
    if (!DEPRESSION_META) need.push('js_data/depression_meta.js');
  }
  if (!need.length) { cb(); return; }
  _showLoad('正在加载分析数据…');
  _loadSeq(need, 0, function(){ _hideLoad(); cb(); });
}
/* ================= 基础数据 ================= */
var map = null;
var TAB = 'rain';
var MAP_CENTER = [36.152, 105.39];
var MAP_BOUNDS = [[35.88, 104.9], [36.42, 105.9]];

var FULL2SHORT = null, SHORT2FULL = null;
var VILLAGES = [], VILLAGE_MAP = {}, CENTERS = null;
function centerOf(full){ if (!FULL2SHORT) return null; var s = FULL2SHORT[full] || full; return CENTERS ? CENTERS[s] : null; }
var PTS = [], STATIONS = [];
var DEPPTS = [], DEP_MAP = {}, DEP_VILLAGES = [], DEP_STATS = {}, POND_DEPRESSION = null;
var VILLAGE_AREAS_FC = null, RIVERS_TOWN_FC = null, AREA_NAMES = {};
// 敏感数据就绪后调用（risk_grading/analysis_meta 经 /api/data 登录取数注入为全局变量）
function buildBaseData() {
  FULL2SHORT = {'常家坪村': '常坪村', '杨家河坝村': '河坝村'};
  SHORT2FULL = {'常坪村': '常家坪村', '河坝村': '杨家河坝村'};
  VILLAGES = ANALYSIS_META.villages;
  VILLAGE_MAP = {}; VILLAGES.forEach(function(v){ VILLAGE_MAP[v.name] = v; });
  CENTERS = VILLAGE_CENTERS;
  PTS = RISK_GRADING.features.map(function(f){
    var p = f.properties, c = f.geometry.coordinates;
    return {name:p.name, cz:p.cz, full:(SHORT2FULL[p.cz]||p.cz), lng:c[0], lat:c[1],
            score:p.score, grade:p.grade, desc:p.desc, phone:p.phone, resp:p.resp, evac:p.evac,
            flood:p.flood_grade||0, mud:p.mud_grade||0, z50:p.z50||0, z100:p.z100||0, dep:null};
  });
  STATIONS = (DATA_RAIN_STATIONS && DATA_RAIN_STATIONS.features) || [];
  // 融合 DEM 积水洼地落区（dep: 洼地平均积水深度 / 0 不在洼地）

function ptInPoly(lng, lat, ring){
  var x = lng, y = lat, inside = false;
  for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function pondFaceAt(lng, lat){
  if (!POND_DEPRESSION) return null;
  for (var i = 0; i < POND_DEPRESSION.features.length; i++) {
    var g = POND_DEPRESSION.features[i].geometry, c = g.coordinates;
    if (g.type === 'Polygon' && ptInPoly(lng, lat, c[0])) return POND_DEPRESSION.features[i];
  }
  return null;
}
function bboxCenter(ring){
  var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  ring.forEach(function(c){
    if (c[0] < minx) minx = c[0];
    if (c[0] > maxx) maxx = c[0];
    if (c[1] < miny) miny = c[1];
    if (c[1] > maxy) maxy = c[1];
  });
  return [(minx + maxx) / 2, (miny + maxy) / 2];
}

function summaryHTML(tab){
  if (tab === 'rain') {
    var idx = RAIN_IDX;
    if (idx === 3) {
      var h=0, p=0; VILLAGES.forEach(function(v){ h+=v.hh||0; p+=v.people||0; });
      return '\uD83D\uDD34 ' + LEVELS[idx].name + '：全镇 ' + h + ' 户 ' + p + ' 人按预案全部转移避险';
    }
    if (idx === 2) {
      var z = PTS.filter(function(x){ return x.z50||x.z100; }).length;
      var f = PTS.filter(function(x){ return x.flood>0; }).length;
      return '\uD83D\uDFE7 ' + LEVELS[idx].name + '：洪水影响带内隐患点 ' + z + ' 处 · 山洪易发区内 ' + f + ' 处 · 低洼积水户 ' + (DEPPTS.length||0) + ' 处需重点巡查';
    }
    if (idx === 1) return '\uD83D\uDFE1 ' + LEVELS[idx].name + '：已叫应全镇 ' + VILLAGES.length + ' 个村责任人，提醒威胁户';
    return '\uD83D\uDD35 ' + LEVELS[idx].name + '：全镇值班值守，密切关注雨情';
  }
  if (tab === 'grade') {
    var n = PTS.filter(function(x){ return !VILLAGE_FILTER || x.full===VILLAGE_FILTER; }).length;
    var g = PTS.filter(function(x){ return (!VILLAGE_FILTER || x.full===VILLAGE_FILTER) && x.grade==='高'; }).length;
    var m = PTS.filter(function(x){ return (!VILLAGE_FILTER || x.full===VILLAGE_FILTER) && x.grade==='中'; }).length;
    var l = PTS.filter(function(x){ return (!VILLAGE_FILTER || x.full===VILLAGE_FILTER) && x.grade==='低'; }).length;
    return '隐患点共 ' + n + ' 处 · 高风险 ' + g + ' · 中风险 ' + m + ' · 低风险 ' + l + (VILLAGE_FILTER ? '（' + VILLAGE_FILTER + '）' : '');
  }
  if (tab === 'zone') {
    var inPts = PTS.filter(function(x){ return x.z50||x.z100; });
    var n50 = PTS.filter(function(x){ return x.z50; }).length;
    var n100 = PTS.filter(function(x){ return x.z100; }).length;
    var vs = {}; inPts.forEach(function(x){ vs[x.full]=1; });
    return '50m 带内 ' + n50 + ' 处 · 100m 带内 ' + n100 + ' 处 · 涉及 ' + Object.keys(vs).length + ' 个村';
  }
  if (tab === 'pond') {
    var feats = (POND_DEPRESSION && POND_DEPRESSION.features) ? POND_DEPRESSION.features : [];
    var n3 = 0, n2 = 0, n1 = 0;
    feats.forEach(function(f){
      var R = f.properties['r' + PRAIN], g = R ? R.g : (f.properties.grade || 1);
      if (g === 3) n3++; else if (g === 2) n2++; else if (g === 1) n1++;
    });
    var txt = PRAIN + 'mm 降雨汇流模拟：重度积水 ' + n3 + ' 处 · 中度 ' + n2 + ' 处 · 轻度 ' + n1 + ' 处（共 ' + feats.length + ' 个洼地）';
    var dv = DEP_VILLAGES.filter(function(v){ return v.grade > 0; });
    if (dv.length) {
      var pf = pondFaceAt(dv[0].lng, dv[0].lat), R = pf && pf.properties['r' + PRAIN];
      txt += ' · ' + dv[0].name + ' 村中心位于洼地内（' + PRAIN + 'mm 下最深约 ' + (R ? R.x : (pf ? pf.properties.max : dv[0].depth)) + 'm）';
    }
    return txt;
  }
  var nf = PTS.filter(function(x){ return x.flood>0; }).length;
  var nm = PTS.filter(function(x){ return x.mud>0; }).length;
  return '山洪易发区内隐患点 ' + nf + ' 处 · 泥石流易发区内 ' + nm + ' 处';
}

      var c = centerOf(v.name);
      html += '<div class="vl-row"' + (c?' data-lng="'+c.lng+'" data-lat="'+c.lat+'"':'') + '>'
        + '<div class="vl-head"><b>' + v.name + '</b><span class="vl-badge" style="background:' + lv.color + '">' + lv.act + '</span></div>'
        + '<div class="vl-sub">隐患：高 ' + (v.high||0) + ' / 中 ' + (v.mid||0) + ' / 低 ' + (v.low||0) + ' · 威胁 ' + (v.hh||0) + ' 户 ' + (v.people||0) + ' 人'
        + ((v.z50||v.z100) ? ' · 影响带内 ' + ((v.z50||0)+(v.z100||0)) + ' 处' : '') + '</div>'
        + '<div class="vl-act">' + villageAction(v, idx) + '</div>'
        + '<div class="vl-tel">\uD83D\uDCDE ' + (v.leader||'') + '</div></div>';
    });
  } else if (TAB === 'zone') {
    var inPts = PTS.filter(function(x){ return x.z50||x.z100; });
    html = '<div class="lp-title">\uD83C\uDF0A 洪水影响带内隐患点（' + inPts.length + ' 处）</div>';
    if (!inPts.length) html += '<div class="zl-row">暂无</div>';
    inPts.forEach(function(p){
      html += '<div class="zl-row" data-lng="' + p.lng + '" data-lat="' + p.lat + '"><b>' + p.name + '</b> · ' + p.full
        + (p.z50 ? '<span class="z-tag">50m</span>' : '') + (p.z100 ? '<span class="z-tag">100m</span>' : '')
        + '<div>评分 ' + p.score + ' 分（' + p.grade + '）' + (p.evac ? ' · 避险点：' + p.evac : '') + '</div></div>';
    });
  } else if (TAB === 'pond') {
    var feats = (POND_DEPRESSION && POND_DEPRESSION.features) || [];
    var psorted = feats.slice().sort(function(a, b){
      var Ra = a.properties['r' + PRAIN], Rb = b.properties['r' + PRAIN];
      return (Rb ? Rb.x : 0) - (Ra ? Ra.x : 0);
    }).slice(0, 10);
    html = '<div class="lp-title">\uD83C\uDF0A ' + PRAIN + 'mm 降雨 · 最深积水洼地 TOP' + psorted.length + '（点击定位）</div>';
    psorted.forEach(function(f){
      var pr = f.properties, R = pr['r' + PRAIN];
      var g = R ? R.g : (pr.grade || 1), mean = R ? R.m : pr.mean, mx = R ? R.x : pr.max;
      var c = bboxCenter(f.geometry.coordinates[0]);
      html += '<div class="zl-row" data-lng="' + c[0] + '" data-lat="' + c[1] + '">'
        + '<b>' + (g===3?'重度':g===2?'中度':'轻度') + '积水区</b>'
        + '<span class="z-tag" style="background:' + (g===3?'#1d4ed8':g===2?'#3b82f6':'#93c5fd') + '">均深 ' + mean + 'm / 最深 ' + mx + 'm</span>'
        + '<div>面积约 ' + (pr.area >= 10000 ? (pr.area/10000).toFixed(1) + ' 万m²' : Math.round(pr.area/1000) + ' 千m²') + '</div></div>';
    });
    if (!psorted.length) html += '<div class="zl-row">暂无洼地数据</div>';
    var dv = DEP_VILLAGES.filter(function(v){ return v.grade > 0; });
    dv.forEach(function(v){
      var pf = pondFaceAt(v.lng, v.lat), R = pf && pf.properties['r' + PRAIN];
      html += '<div class="zl-row" data-lng="' + v.lng + '" data-lat="' + v.lat + '"><b>' + v.name + '</b>（村中心位于洼地内，' + PRAIN + 'mm 下最深 ' + (R ? R.x : v.depth) + 'm）</div>';
    });
    html += '<div class="zl-row" style="color:#64748b">注：经坐标复核，全镇隐患点多位于坡面/崖边，不处于低洼蓄水区；低洼积水风险主要集中在村址与农田低地处。</div>';
  } else if (TAB === 'grade') {
    // 风险分级：隐患点列表（支持村庄筛选，高风险在前、同等级按评分降序）
    var gl = PTS.slice();
    if (VILLAGE_FILTER) gl = gl.filter(function(x){ return x.full === VILLAGE_FILTER; });
    var gOrder = {'高': 0, '中': 1, '低': 2};
    gl.sort(function(a, b){ return (gOrder[a.grade] !== undefined ? gOrder[a.grade] : 3) - (gOrder[b.grade] !== undefined ? gOrder[b.grade] : 3) || (b.score || 0) - (a.score || 0); });
    html = '<div class="lp-title">\uD83D\uDD34 风险分级 · 隐患点（' + gl.length + ' 处' + (VILLAGE_FILTER ? ' · ' + VILLAGE_FILTER : '') + '，点击定位）</div>';
    if (!gl.length) html += '<div class="zl-row">该条件下暂无隐患点</div>';
    gl.forEach(function(p){
      var c = GRADE_COLORS[p.grade] || '#64748b';
      html += '<div class="zl-row" data-lng="' + p.lng + '" data-lat="' + p.lat + '">'
        + '<b>' + p.name + '</b> · ' + p.full
        + '<span class="z-tag" style="background:' + c + '">' + p.grade + '风险</span>'
        + '<div>综合评分 ' + p.score + ' 分' + (p.evac ? ' · 避险点：' + p.evac : '') + '</div>'
        + (p.phone ? '<div style="color:#64748b;font-size:11px;">\uD83D\uDCDE ' + p.phone + '</div>' : '')
        + '</div>';
    });
  } else {
    html = '<div class="lp-title">\uD83D\uDCD0 易发性叠加</div>'
      + '<div class="zl-row">本视图暂无列表，点击地图上的隐患点查看详情。</div>';
  }
  lp.innerHTML = html;
  lp.querySelectorAll('[data-lng]').forEach(function(r){
    r.addEventListener('click', function(){
      var lat = parseFloat(r.getAttribute('data-lat')), lng = parseFloat(r.getAttribute('data-lng'));
      map.flyTo([lat, lng], 15, {duration: .8});
      if (window.innerWidth <= 768) { toggleList(); }
      // 定位后自动弹出对应隐患点信息（存在匹配点时）
      setTimeout(function(){
        var hit = null;
        for (var i = 0; i < PTS.length; i++) {
          if (Math.abs(PTS[i].lng - lng) < 1e-6 && Math.abs(PTS[i].lat - lat) < 1e-6) { hit = PTS[i]; break; }
        }
        if (hit) L.popup().setLatLng([lat, lng]).setContent(ptPopup(hit)).openOn(map);
      }, 900);
    });
  });
}

function villageAction(v, idx){
  if (idx >= 3) return '全面转移：' + (v.hh||0) + ' 户 ' + (v.people||0) + ' 人按预案全部转移避险';
  if (idx === 2) {
    var n = (v.z50||0) + (v.z100||0);
    if (n > 0) return '重点巡查洪水影响带内 ' + n + ' 处隐患点，提前转移';
    if ((v.in_flood||0) > 0) return '巡查山洪易发区内 ' + v.in_flood + ' 处隐患点';
    return '橙色响应 · 入户提醒威胁户';
  }
  if (idx === 1) return '叫应村责任人，提醒威胁户 ' + (v.hh||0) + ' 户 ' + (v.people||0) + ' 人';
  return '值班关注雨情，责任人电话待命';
}

/* ================= 地图图层 ================= */
function ptPopup(p){
  var inZone = (p.z50||p.z100);
  return '<div class="pt-pop"><b>' + p.name + '</b> <span class="g-' + p.grade + '">' + p.grade + '风险' + (inZone?'（影响带内）':'') + '</span>'
    + '<div>' + p.full + ' · 综合评分 ' + p.score + ' 分</div>'
    + (p.phone ? '<div>电话：' + p.phone + '</div>' : '')
    + (p.resp ? '<div>责任人：' + p.resp + '</div>' : '')
    + (p.evac ? '<div>避险点：' + p.evac + '</div>' : '')
    + '<div style="color:#64748b;font-size:11px;">' + (p.desc||'') + '</div></div>';
}

// 隐患点 = 淡色范围圆（提示威胁覆盖区域，区域内可能还有其他居住人员）+ 中心点，两者均可点击查看信息
function addPtRange(p, fill, markerOpts){
  grpPts.addLayer(L.circle([p.lat, p.lng], { radius: 60, color: 'transparent', weight: 0, fillColor: fill, fillOpacity: .14 }).bindPopup(ptPopup(p)));
  grpPts.addLayer(L.circleMarker([p.lat, p.lng], markerOpts).bindPopup(ptPopup(p)));
}

function refreshMap(){
  grpPts.clearLayers(); grpVillage.clearLayers(); grpZones.clearLayers(); grpVuln.clearLayers(); grpStations.clearLayers(); grpRivers.clearLayers();
  if (TAB === 'rain') {
    var idx = RAIN_IDX, lv = LEVELS[idx];
    // 镇内河流（背景）
    if (RIVERS_TOWN_FC) grpRivers.addLayer(L.geoJSON(RIVERS_TOWN_FC, { style: { color:'#0284c7', weight:1.4, opacity:.7 } }));
    // 隐患点（淡色范围圆标注威胁覆盖区域）
    PTS.forEach(function(p){
      var inZone = idx >= 2 && (p.z50||p.z100);
      var r = inZone ? 8 : (p.grade==='高' ? 7 : (p.grade==='中' ? 5 : 4));
      addPtRange(p, GRADE_COLORS[p.grade], {
        radius: r, color: inZone ? '#06b6d4' : '#ffffff', weight: inZone ? 2.5 : 1,
        fillColor: GRADE_COLORS[p.grade], fillOpacity: .95
      });
    });
    // 雨量站
    STATIONS.forEach(function(f){
      var c = f.geometry.coordinates;
      grpStations.addLayer(L.circleMarker([c[1], c[0]], {
        radius: 5, color: '#7c3aed', weight: 1.5, fillColor: '#a78bfa', fillOpacity: .85
      }).bindPopup('<b>\uD83C\uDF27\uFE0F 雨量监测站</b>'));
    });
    // 村范围：按当前响应等级着色（有村界的村用面，其余回退中心点）
    if (VILLAGE_AREAS_FC) {
      grpVillage.addLayer(L.geoJSON(VILLAGE_AREAS_FC, {
        style: function(f){
          var v = VILLAGE_MAP[f.properties.name];
          return { color: '#ffffff', weight: 1.5, opacity: .9,
                   fillColor: lv.color, fillOpacity: v ? .42 : .3 };
        },
        onEachFeature: function(f, layer){
          var nm = f.properties.name, v = VILLAGE_MAP[nm];
          layer.bindPopup('<b>' + nm + '</b> <span style="color:' + lv.color + ';font-weight:700;">' + lv.name + '</span>'
            + '<div>威胁 ' + (v ? (v.hh||0) : '-') + ' 户 ' + (v ? (v.people||0) : '-') + ' 人 · 隐患 高' + (v?(v.high||0):'-') + '/中' + (v?(v.mid||0):'-') + '/低' + (v?(v.low||0):'-') + '</div>'
            + '<div>' + (v ? villageAction(v, idx) : '') + '</div>'
            + (v && v.leader ? '<div>村负责人：' + v.leader + '</div>' : ''));
        }
      }));
    }
    // 无村界的村（如刘家湾社区）回退为中心圆点
    VILLAGES.forEach(function(v){
      if (AREA_NAMES[v.name]) return;
      var c = centerOf(v.name); if (!c) return;
      grpVillage.addLayer(L.circleMarker([c.lat, c.lng], {
        radius: 9, color: '#ffffff', weight: 2.5, fillColor: lv.color, fillOpacity: .95
      }).bindPopup('<b>' + v.name + '</b> <span style="color:' + lv.color + ';font-weight:700;">' + lv.name + '</span>'
        + '<div>威胁 ' + (v.hh||0) + ' 户 ' + (v.people||0) + ' 人</div>'
        + '<div>' + villageAction(v, idx) + '</div>'));
    });
  }
  else if (TAB === 'grade') {
    PTS.forEach(function(p){
      if (VILLAGE_FILTER && p.full !== VILLAGE_FILTER) return;
      addPtRange(p, GRADE_COLORS[p.grade], {
        radius: p.grade==='高' ? 8 : (p.grade==='中' ? 6 : 4.5),
        color: '#ffffff', weight: 1.5, fillColor: GRADE_COLORS[p.grade], fillOpacity: .95
      });
    });
    if (VILLAGE_FILTER) {
      var c = centerOf(VILLAGE_FILTER);
      if (c) { map.flyTo([c.lat, c.lng], 14, {duration: .8}); }
    }
  }
  else if (TAB === 'zone') {
    // 镇内河流线
    if (RIVERS_TOWN_FC) grpRivers.addLayer(L.geoJSON(RIVERS_TOWN_FC, { style: { color:'#0284c7', weight:1.8, opacity:.85 } }));
    if (ZSTATE.z50 && FLOOD_ZONES) grpZones.addLayer(L.geoJSON(FLOOD_ZONES.z50, { style: { color:'#0284c7', weight:1, opacity:.9, fillColor:'#7dd3fc', fillOpacity:.5 } }));
    if (ZSTATE.z100 && FLOOD_ZONES) grpZones.addLayer(L.geoJSON(FLOOD_ZONES.z100, { style: { color:'#0369a1', weight:1, opacity:.9, fillColor:'#38bdf8', fillOpacity:.35 } }));
    if (ZSTATE.pts) {
      PTS.forEach(function(p){
        var inZone = p.z50||p.z100;
        if (inZone) {
          // 带内隐患点画成区域（户周边 60m 范围，区域内可能还有其他居住人员）
          grpPts.addLayer(L.circle([p.lat, p.lng], { radius: 60,
            color: '#dc2626', weight: 2, fillColor: '#ef4444', fillOpacity: .4
          }).bindPopup(ptPopup(p)));
        } else {
          // 带外对照点：紫色半透明小点（避免与卫星图大地色混淆）
          grpPts.addLayer(L.circleMarker([p.lat, p.lng], {
            radius: 3.5, color: '#7c3aed', weight: 1, fillColor: '#a855f7', fillOpacity: .7
          }).bindPopup(ptPopup(p)));
        }
      });
    }
  }
  else if (TAB === 'pond') {
    // 镇内河流（背景）
    if (RIVERS_TOWN_FC) grpRivers.addLayer(L.geoJSON(RIVERS_TOWN_FC, { style: { color:'#0284c7', weight:1.4, opacity:.7 } }));
    // 洼地积水区（12.5m DEM 降雨汇流模拟，按所选降雨量切换等级与水深）
    if (POND_DEPRESSION) {
      var PCOL = {3: '#1d4ed8', 2: '#3b82f6', 1: '#93c5fd'};
      var POP = {3: '重度积水', 2: '中度积水', 1: '轻度积水'};
      var pondFeats = POND_DEPRESSION.features.filter(function(f){
        var R = f.properties['r' + PRAIN];
        var g = R ? R.g : (f.properties.grade || 1);
        if (g === 3 && !PONDSTATE.heavy) return false;
        if (g === 2 && !PONDSTATE.mid) return false;
        if (g === 1 && !PONDSTATE.light) return false;
        return true;
      });
      if (pondFeats.length) {
        grpZones.addLayer(L.geoJSON({type:'FeatureCollection', features: pondFeats}, {
          style: function(f){
            var R = f.properties['r' + PRAIN];
            var g = R ? R.g : (f.properties.grade || 1);
            return { color:'#ffffff', weight:.6, opacity:.7, fillColor: PCOL[g], fillOpacity: g===3 ? .62 : (g===2 ? .52 : .45) };
          },
          onEachFeature: function(f, layer){
            var pr = f.properties, R = pr['r' + PRAIN];
            var g = R ? R.g : (pr.grade || 1);
            var mean = R ? R.m : pr.mean, mx = R ? R.x : pr.max;
            layer.bindPopup('<b>' + (POP[g] || '积水区') + ' · ' + PRAIN + 'mm 降雨模拟</b>'
              + '<div>平均水深 ' + mean + 'm · 最深 ' + mx + 'm</div>'
              + '<div>面积约 ' + (pr.area >= 10000 ? (pr.area/10000).toFixed(1) + ' 万m²' : Math.round(pr.area/1000) + ' 千m²') + '</div>'
              + '<div style="color:#64748b">地形最大蓄水 平均 ' + pr.mean + 'm / 最深 ' + pr.max + 'm</div>');
          }
        }));
      }
    }
    if (PONDSTATE.pts) {
      PTS.forEach(function(p){
        grpPts.addLayer(L.circleMarker([p.lat, p.lng], {
          radius: 3.5, color: '#7c3aed', weight: 1, fillColor: '#a855f7', fillOpacity: .65
        }).bindPopup(ptPopup(p)));
      });
    }
    // 洼地内村中心
    DEP_VILLAGES.forEach(function(v){
      if (!(v.grade > 0)) return;
      var pf = pondFaceAt(v.lng, v.lat), R = pf && pf.properties['r' + PRAIN];
      var mean = R ? R.m : v.depth, mx = R ? R.x : v.depth;
      grpVillage.addLayer(L.circleMarker([v.lat, v.lng], {
        radius: 11, color: '#ffffff', weight: 2.5, fillColor: '#b91c1c', fillOpacity: .95
      }).bindPopup('<b>' + v.name + '</b> <span style="color:#b91c1c;font-weight:700;">村中心位于积水洼地内</span>'
        + '<div>' + PRAIN + 'mm 降雨模拟：平均水深约 ' + mean + 'm · 最深 ' + mx + 'm，强降雨时注意防范内涝</div>'));
    });
  }
  else { /* vuln */
    var showF = (MODE==='flood'||MODE==='both');
    var showM = (MODE==='mud'||MODE==='both');
    if (showF && VULN_FLOOD) grpVuln.addLayer(L.geoJSON(VULN_FLOOD, { style: vulnStyle(VULN_FLOOD, OPACITY.flood/100) }));
    if (showM && VULN_MUD) grpVuln.addLayer(L.geoJSON(VULN_MUD, { style: vulnStyle(VULN_MUD, OPACITY.mud/100) }));
    PTS.forEach(function(p){
      var g = MODE==='mud' ? p.mud : p.flood;
      var on = g > 0;
      addPtRange(p, on ? CLASS_COLORS[Math.min(g,4)-1] : '#cbd5e1', {
        radius: on ? 6 : 3.5, color: on ? '#ffffff' : '#94a3b8',
        weight: on ? 1.5 : 0, fillColor: on ? CLASS_COLORS[Math.min(g,4)-1] : '#cbd5e1', fillOpacity: on ? .95 : .55
      });
    });
  }
}
function vulnStyle(data, op){
  return function(feature){
    var gc = feature.properties.gridcode || 1;
    return { color:'#000000', weight:1, opacity:.85,
      fillColor: CLASS_COLORS[Math.min(Math.max(gc,1),4)-1], fillOpacity: op };
  };
}

/* ================= 控件事件（事件委托，防止重渲染丢失） ================= */
document.addEventListener('input', function(e){
  if (e.target.hasAttribute('data-rain')) {
    RAIN_IDX = parseInt(e.target.value, 10);
    var lv = LEVELS[RAIN_IDX];
    document.querySelectorAll('[data-rain]').forEach(function(s){ s.value = RAIN_IDX; });
    document.querySelectorAll('.rain-val').forEach(function(s){ s.textContent = lv.mm + 'mm'; });
    document.querySelectorAll('.v29-lv-btn').forEach(function(b, j){ b.classList.toggle('on', j === RAIN_IDX); });
    document.querySelectorAll('.v29-lv-badge').forEach(function(b){ b.style.background = lv.color; b.innerHTML = '<b>' + lv.mm + 'mm</b> · ' + lv.name + ' · ' + v29BriefAct(); });
    document.querySelectorAll('.rain-level').forEach(function(s){
      s.innerHTML = '<span class="mm">' + lv.mm + 'mm</span> · ' + lv.name + ' · ' + lv.act;
      s.style.color = lv.color;
    });
    var rH = RAIN_IDX === 0 ? '全镇值班值守，密切关注雨情，各村责任人电话待命。'
      : (RAIN_IDX === 1 ? '已叫应全镇 ' + VILLAGES.length + ' 个村责任人，提醒威胁户注意防范。'
      : (RAIN_IDX === 2 ? '洪水影响带与山洪易发区内隐患点重点巡查、逐户叫应，提前组织转移。'
      : '威胁户全部转移避险，洪水影响带与山洪易发区内隐患点重点巡查、逐户叫应，确保不漏一人。'));
    document.querySelectorAll('.rain-hint').forEach(function(h){
      h.innerHTML = '<b>分级参考：</b>10mm 蓝 / 20mm 黄 / 50mm 橙 / 80mm 红。<br>'
        + '<b style="color:' + lv.color + '">' + lv.mm + 'mm ' + lv.name + '</b>：' + rH + '<br>'
        + '（是否积水受地形高程影响，图中以<u>洪水影响带 + 山洪易发区</u>近似指示高风险积水区域）';
    });
    var lg = document.getElementById('legend');
    if (lg) lg.innerHTML = legendHTML('rain');
    var slg = document.querySelector('#sheet-body .sheet-legend');
    if (slg) slg.innerHTML = legendHTML('rain');
    document.getElementById('summary').innerHTML = summaryHTML('rain');
    renderList();
    refreshMap();
  }
  else if (e.target.hasAttribute('data-op')) {
    var k = e.target.getAttribute('data-op');
    OPACITY[k] = parseInt(e.target.value, 10);
    document.querySelectorAll('.op-val[data-opval="' + k + '"]').forEach(function(s){ s.textContent = OPACITY[k] + '%'; });
    if (TAB === 'vuln') refreshMap();
  }
});
document.addEventListener('change', function(e){
  if (e.target.hasAttribute('data-zcb')) {
    ZSTATE[e.target.getAttribute('data-zcb')] = e.target.checked;
    refreshMap();
  }
  else if (e.target.hasAttribute('data-pcb')) {
    PONDSTATE[e.target.getAttribute('data-pcb')] = e.target.checked;
    refreshMap();
  }
  else if (e.target.hasAttribute('data-prain')) {
    PRAIN = parseInt(e.target.getAttribute('data-prain'), 10);
    document.querySelectorAll('[data-prain]').forEach(function(rb){
      var sel = (parseInt(rb.getAttribute('data-prain'), 10) === PRAIN);
      rb.checked = sel;
      if (rb.parentElement) rb.parentElement.classList.toggle('on', sel);
    });
    var pdH = PRAIN === 20 ? '20mm 中雨：汇入低洼区的雨量较少，仅最低处洼地出现浅积水，重点提醒村址低洼住户。'
      : (PRAIN === 50 ? '50mm 暴雨：洼地蓄水量增大，孟塬村等村址洼地平均水深明显抬升，需提前防范内涝。'
      : '80mm 大暴雨：各洼地接近蓄满，村址洼地积水最深，威胁户按预案提前转移避险。');
    document.querySelectorAll('.pond-hint').forEach(function(h){
      var b = h.querySelector('b[style*="b91c1c"]');
      if (b) b.textContent = pdH;
    });
    var lg2 = document.getElementById('legend');
    if (lg2) lg2.innerHTML = legendHTML('pond');
    var slg2 = document.querySelector('#sheet-body .sheet-legend');
    if (slg2) slg2.innerHTML = legendHTML('pond');
    document.getElementById('summary').innerHTML = summaryHTML('pond');
    renderList();
    refreshMap();
  }
  else if (e.target.classList && e.target.classList.contains('village-filter')) {
    VILLAGE_FILTER = e.target.value;
    document.querySelectorAll('.village-filter').forEach(function(s){ s.value = VILLAGE_FILTER; });
    refreshMap();
    document.getElementById('summary').innerHTML = summaryHTML('grade');
    renderList();
  }
  else if (e.target.hasAttribute('data-mode')) {
    MODE = e.target.getAttribute('data-mode');
    document.querySelectorAll('[data-mode]').forEach(function(rb){ rb.checked = (rb.value === MODE); });
    refreshMap();
  }
});

// ========== bfcache 往返缓存修复 ==========
// 从其他页面返回本页时，浏览器可能直接从 bfcache 恢复页面快照（JS 不重新执行），
// 导致敏感数据/地图停留在空状态。检测到从 bfcache 恢复时强制整页刷新。
window.addEventListener('pageshow', function(e) {
  var needReload = false;
  if (e.persisted) needReload = true;
  if (!needReload) {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if ((nav && nav.type === 'back_forward') || (performance.navigation && performance.navigation.type === 2)) needReload = true;
  }
  if (needReload) {
    window.location.replace(window.location.pathname + '?_r=' + Date.now() + window.location.hash);
  }
});

window.onload = function() {
  // 敏感数据（隐患点名册/村情汇总）登录后从云函数取数，就绪后再初始化地图
  var ANA_DATA_FILES = ['risk_grading.js', 'analysis_meta.js'];
  function anaDataReady() { return typeof RISK_GRADING !== 'undefined' && typeof ANALYSIS_META !== 'undefined'; }
  function startAna(attempt) {
    loadSecureData(ANA_DATA_FILES, function() {
      if (!anaDataReady()) {
        if (attempt > 0) { setTimeout(function() { startAna(attempt - 1); }, 600); return; }
        document.getElementById('map').innerHTML = '<div style="text-align:center;color:#f87171;padding-top:60px;font-size:15px;">&#x26A0; 数据加载失败（网络或服务器异常），<a href="javascript:location.reload()" style="color:#fbbf24;">点此刷新重试</a></div>';
        return;
      }
      buildBaseData();
      initMap();
    }, { force: attempt < 3 });
  }
  startAna(3);
};
