<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新塬镇应急避险指挥系统</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; overflow: hidden; background: #eef2f7; }

#map { position: fixed; inset: 0; z-index: 1; background: #e2e8f0; }

/* ===== 顶栏 ===== */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 54px;
  background: rgba(255,255,255,0.92);
  border-bottom: 1px solid #e3e8f0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; color: #14213d;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
#topbar .logo-area { display: flex; align-items: center; gap: 10px; }
#topbar .logo-icon {
  width: 36px; height: 36px; background: linear-gradient(135deg, #1a4a7a, #12314f);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 16px rgba(47,111,237,0.25);
}
#topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: 0.5px; }
#topbar .village-select {
  display: flex; align-items: center; gap: 6px;
  background: rgba(20,33,61,0.05); border: 1px solid rgba(20,33,61,0.08);
  border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  transition: background 0.2s; color: #8a95ad;
}
#topbar .village-select:hover { background: rgba(20,33,61,0.08); color: #14213d; }
#topbar .village-select .arrow { font-size: 10px; transition: transform 0.2s; }
#topbar .village-select.open .arrow { transform: rotate(180deg); }
#topbar .logout-btn {
  background: rgba(20,33,61,0.05); border: 1px solid rgba(20,33,61,0.08);
  color: #8a95ad; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s;
}
#topbar .logout-btn:hover { background: rgba(47,111,237,0.12); color: #2f6fed; border-color: rgba(47,111,237,0.25); }
#topbar .back-link {
  color: #8a95ad; text-decoration: none; font-size: 12px;
  display: flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 6px; transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s;
}
#topbar .back-link:hover { background: rgba(20,33,61,0.05); color: #14213d; }

/* ===== 村庄下拉 ===== */
#village-dropdown {
  position: fixed; top: 56px; right: 16px; z-index: 1001;
  background: #ffffff; border: 1px solid rgba(20,33,61,0.08);
  border-radius: 10px; min-width: 180px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(20,33,61,0.12);
  display: none; max-height: 420px; overflow-y: auto;
}
#village-dropdown.show { display: block; animation: dropIn 0.2s ease; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
#village-dropdown .v-item {
  padding: 12px 16px; cursor: pointer; color: #4a5878; font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid rgba(20,33,61,0.04);
  transition: background 0.15s;
}
#village-dropdown .v-item:hover { background: rgba(47,111,237,0.1); color: #2f6fed; }
#village-dropdown .v-item.active { background: rgba(47,111,237,0.15); color: #2f6fed; }
#village-dropdown .v-item .v-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2444a; flex-shrink: 0; }
#village-dropdown .v-item .v-count { font-size: 11px; color: #8a95ad; margin-left: auto; }

/* ===== 村庄信息侧边栏 ===== */
#village-info {
  position: fixed; top: 62px; left: 16px; z-index: 998;
  width: 300px; max-height: calc(100vh - 140px); overflow-y: auto;
  background: rgba(255,255,255,0.96); border: 1px solid rgba(20,33,61,0.06);
  border-radius: 12px; padding: 0; color: #8a95ad; font-size: 13px;
  backdrop-filter: blur(16px); display: none;
  box-shadow: 0 8px 24px rgba(20,33,61,0.12);
  -webkit-backdrop-filter: blur(16px);
}
#village-info::-webkit-scrollbar { width: 4px; }
#village-info::-webkit-scrollbar-thumb { background: rgba(20,33,61,0.08); border-radius: 2px; }
#village-info.show { display: block; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
#village-info .vi-header {
  padding: 14px 16px; border-bottom: 1px solid rgba(20,33,61,0.05);
  display: flex; justify-content: space-between; align-items: center;
}
#village-info .vi-header h3 { font-size: 16px; color: #2f6fed; font-weight: 700; }
#village-info .vi-close {
  background: none; border: none; color: #8a95ad; font-size: 18px; cursor: pointer;
  width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
}
#village-info .vi-close:hover { background: rgba(20,33,61,0.05); color: #14213d; }
#village-info .vi-body { padding: 14px 16px; }
#village-info .vi-section { margin-bottom: 14px; }
#village-info .vi-section:last-child { margin-bottom: 0; }
#village-info .vi-section h4 {
  font-size: 11px; color: #8a95ad; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 6px; font-weight: 600;
}
#village-info .vi-contact {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(20,33,61,0.03);
}
#village-info .vi-contact .vi-label { color: #8a95ad; font-size: 12px; min-width: 60px; }
#village-info .vi-contact .vi-value { color: #14213d; font-weight: 500; }
#village-info .vi-contact .vi-phone { color: #2f6fed; margin-left: auto; font-size: 12px; }
#village-info .vi-text { color: #8a95ad; font-size: 12px; line-height: 1.6; }
#village-info .vi-hh-list { max-height: 200px; overflow-y: auto; }
#village-info .vi-hh-item {
  display: flex; justify-content: space-between; padding: 4px 0;
  border-bottom: 1px solid rgba(20,33,61,0.02); font-size: 12px;
}
#village-info .vi-hh-item .vi-hh-name { color: #14213d; }
#village-info .vi-hh-item .vi-hh-count { color: #2f6fed; }
#village-info .vi-hh-item .vi-hh-shelter { color: #22a55b; font-size: 11px; }

/* ===== 统计面板 ===== */
#stats-panel {
  position: fixed; top: 68px; left: 16px; z-index: 997;
  display: flex; gap: 8px; flex-wrap: wrap;
}
#stats-panel.hidden { display: none; }
#stats-panel .stat-card {
  background: rgba(255,255,255,0.9); border: 1px solid rgba(20,33,61,0.06);
  border-radius: 10px; padding: 10px 16px; color: #fff; font-size: 12px;
  backdrop-filter: blur(10px); min-width: 80px; text-align: center;
}
#stats-panel .stat-card .stat-num { font-size: 22px; font-weight: 700; color: #2f6fed; }
#stats-panel .stat-card .stat-label { color: #8a95ad; margin-top: 2px; }

/* ===== 图例 ===== */
#legend {
  position: fixed; bottom: 30px; left: 16px; z-index: 999;
  background: rgba(255,255,255,0.92); border: 1px solid rgba(20,33,61,0.08);
  border-radius: 10px; padding: 12px 16px; color: #4a5878; font-size: 12px;
  backdrop-filter: blur(10px);
}
#legend .l-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#legend .l-item:last-child { margin-bottom: 0; }
#legend .l-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ===== 图层控制 ===== */
#layer-ctrl {
  position: fixed; right: 16px; bottom: 30px; z-index: 999;
  display: flex; flex-direction: column; gap: 6px;
}
#layer-ctrl button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(20,33,61,0.12);
  background: rgba(255,255,255,0.9); color: #4a5878; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s; backdrop-filter: blur(10px);
}
#layer-ctrl button:hover { background: rgba(47,111,237,0.12); border-color: #2f6fed; }
#layer-ctrl button.off { opacity: 0.35; }

/* ===== 弹窗 ===== */
.leaflet-popup-content-wrapper {
  background: rgba(255,255,255,0.97) !important;
  color: #14213d !important; border-radius: 12px !important;
  border: 1px solid rgba(20,33,61,0.08) !important;
  box-shadow: 0 8px 24px rgba(20,33,61,0.12) !important;
  backdrop-filter: blur(10px);
}
.leaflet-popup-tip { background: rgba(255,255,255,0.97) !important; }
.popup-content { min-width: 260px; max-width: 380px; font-size: 13px; line-height: 1.8; }
.popup-content .pop-title { font-size: 15px; font-weight: 700; color: #2f6fed; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(20,33,61,0.06); }
.popup-content .pop-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(20,33,61,0.03); }
.popup-content .pop-label { color: #8a95ad; white-space: nowrap; }
.popup-content .pop-val { color: #14213d; font-weight: 500; text-align: right; }
.popup-content .pop-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.popup-content .pop-badge.danger { background: rgba(47,111,237,0.12); color: #2f6fed; }
.popup-content .pop-badge.warn { background: rgba(238,139,36,0.2); color: #ee8b24; }
.popup-content .pop-badge.info { background: rgba(33,150,243,0.2); color: #2f6fed; }
.popup-content .pop-desc { margin-top: 8px; padding: 8px 10px; background: rgba(20,33,61,0.03); border-radius: 6px; color: #4a5878; font-size: 12px; line-height: 1.7; border-left: 2px solid rgba(226,68,74,0.3); }
.pop-photos { margin-top: 8px; }
.pop-photos .pop-photo-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 6px; cursor: zoom-in; display: block; }
.pop-photos .ph-muted { color: #8a95ad; font-size: 12px; }

/* ===== 状态栏 ===== */
#status {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000;
  background: rgba(10,25,50,0.88); color: #fff; padding: 6px 20px;
  border-radius: 20px; font-size: 12px; display: none; pointer-events: none;
  white-space: nowrap;
}

/* ===== 侧边信息面板 ===== */
#side-panel-toggle {
  position: fixed; top: 68px; left: 16px; z-index: 999;
  width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid rgba(20,33,61,0.12);
  background: rgba(255,255,255,0.92); color: #4a5878; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s; backdrop-filter: blur(10px);
}
#side-panel-toggle:hover { background: rgba(47,111,237,0.12); border-color: #2f6fed; color: #2f6fed; }
#side-panel-toggle.active { background: rgba(47,111,237,0.18); color: #2f6fed; }

#side-panel {
  position: fixed; top: 68px; left: 64px; z-index: 998;
  width: 340px; max-height: calc(100vh - 100px); overflow-y: auto;
  background: rgba(255,255,255,0.96); border: 1px solid rgba(20,33,61,0.06);
  border-radius: 12px; color: #8a95ad; font-size: 13px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 24px rgba(20,33,61,0.12);
  display: none; transition:background-color 0.3s,color 0.3s,border-color 0.3s,transform 0.3s,opacity 0.3s,box-shadow 0.3s ease;
}
#side-panel.show { display: block; animation: panelSlideIn 0.3s ease; }
@keyframes panelSlideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
#side-panel::-webkit-scrollbar { width: 4px; }
#side-panel::-webkit-scrollbar-thumb { background: rgba(20,33,61,0.08); border-radius: 2px; }

#side-panel .sp-header {
  padding: 16px; border-bottom: 1px solid rgba(20,33,61,0.05);
  display: flex; justify-content: space-between; align-items: center;
}
#side-panel .sp-header h3 { font-size: 16px; color: #2f6fed; font-weight: 700; }
#side-panel .sp-header .sp-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
  background: rgba(47,111,237,0.12); color: #2f6fed;
}
#side-panel .sp-close {
  background: none; border: none; color: #8a95ad; font-size: 16px;
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
#side-panel .sp-close:hover { background: rgba(20,33,61,0.06); color: #14213d; }
#side-panel .sp-body { padding: 14px 16px; }
#side-panel .sp-section { margin-bottom: 16px; }
#side-panel .sp-section:last-child { margin-bottom: 0; }
#side-panel .sp-section h4 {
  font-size: 11px; color: #8a95ad; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
#side-panel .sp-section h4 .sp-icon { font-size: 14px; }
#side-panel .sp-contact-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(20,33,61,0.03);
}
#side-panel .sp-contact-row:last-child { border-bottom: none; }
#side-panel .sp-contact-row .sp-label { color: #8a95ad; font-size: 12px; min-width: 56px; }
#side-panel .sp-contact-row .sp-value { color: #14213d; font-weight: 500; flex: 1; }
#side-panel .sp-contact-row .sp-phone { color: #2f6fed; font-size: 12px; white-space: nowrap; }
#side-panel .sp-risk-item {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(47,111,237,0.05); border: 1px solid rgba(47,111,237,0.08);
  font-size: 12px; line-height: 1.7;
}
#side-panel .sp-risk-item .sp-risk-name { color: #e2444a; font-weight: 600; font-size: 13px; }
#side-panel .sp-risk-item .sp-risk-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-left: 6px;
  background: rgba(47,111,237,0.12); color: #e2444a;
}
#side-panel .sp-risk-item .sp-risk-detail { color: #8a95ad; margin-top: 4px; }
#side-panel .sp-risk-item .sp-risk-contact { color: #2f6fed; font-size: 11px; }
#side-panel .sp-empty {
  text-align: center; padding: 20px; color: #8a95ad; font-size: 12px;
}
#side-panel .sp-text { color: #8a95ad; font-size: 12px; line-height: 1.6; }

/* 全镇概览特殊样式 */
#side-panel.overview .sp-header h3 { color: #ee8b24; }
#side-panel.overview .sp-header .sp-badge { background: rgba(238,139,36,0.15); color: #ee8b24; }

/* ===== 子菜单面板（村级详情） ===== */
.vp-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  padding: 10px 12px; border-bottom: 1px solid rgba(20,33,61,0.05);
  background: rgba(20,33,61,0.04);
}
.vp-tab {
  padding: 8px 4px; border-radius: 8px;
  border: 1px solid rgba(20,33,61,0.06);
  background: rgba(20,33,61,0.03); color: #8a95ad;
  font-size: 12px; cursor: pointer; text-align: center;
  transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s; line-height: 1.3;
}
.vp-tab .vp-tab-icon { display: block; font-size: 15px; margin-bottom: 2px; }
.vp-tab:hover { background: rgba(20,33,61,0.06); color: #14213d; }
.vp-tab.active {
  background: rgba(47,111,237,0.14); border-color: rgba(47,111,237,0.4);
  color: #e2444a; font-weight: 600;
}
.vp-content { padding: 12px 14px; }
.vp-content::-webkit-scrollbar { width: 4px; }
.vp-content::-webkit-scrollbar-thumb { background: rgba(20,33,61,0.08); border-radius: 2px; }

.vp-sec-title {
  font-size: 11px; color: #8a95ad; letter-spacing: 1px;
  margin: 4px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.vp-sec-title .sp-icon { font-size: 13px; }

/* 联系人卡片 */
.vp-person {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(20,33,61,0.03); border: 1px solid rgba(20,33,61,0.05);
}
.vp-person .vp-role {
  font-size: 11px; color: #8a95ad; min-width: 64px; flex-shrink: 0;
}
.vp-person .vp-name { color: #14213d; font-weight: 600; flex: 1; font-size: 13px; }
.vp-person .vp-phone { color: #2f6fed; font-size: 12px; white-space: nowrap; margin-right: 6px; }

/* 隐患点卡片 */
.vp-hazard {
  background: rgba(47,111,237,0.05); border: 1px solid rgba(47,111,237,0.1);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
}
.vp-hazard .vp-h-name { color: #e2444a; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vp-hazard .vp-h-badge {
  font-size: 10px; padding: 1px 8px; border-radius: 10px;
  background: rgba(47,111,237,0.16); color: #f2a3a8; font-weight: 600;
}
.vp-hazard .vp-h-scope { color: #8a95ad; font-size: 11px; margin: 4px 0 6px; }
.vp-hh {
  padding: 5px 8px; margin-bottom: 4px; border-radius: 6px;
  background: rgba(20,33,61,0.03); border-left: 2px solid rgba(47,111,237,0.25);
}
.vp-hh .vp-hh-top { display: flex; align-items: center; gap: 6px; }
.vp-hh .vp-hh-name { color: #14213d; font-weight: 600; font-size: 12px; }
.vp-hh .vp-hh-count { color: #e2444a; font-size: 11px; }
.vp-hh .vp-hh-list { color: #8a95ad; font-size: 11px; line-height: 1.6; margin-top: 3px; }
.vp-h-info { color: #8a95ad; font-size: 11px; margin-top: 5px; line-height: 1.5; }
.vp-h-info b { color: #2f6fed; font-weight: 600; }

/* 规则列表 */
.vp-rule {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(20,33,61,0.03); border: 1px solid rgba(20,33,61,0.05);
  color: #8a95ad; font-size: 12px; line-height: 1.5;
}
.vp-rule .vp-rule-ico { flex-shrink: 0; font-size: 14px; }

/* 应急电话 */
.vp-phone-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(47,111,237,0.06); border: 1px solid rgba(47,111,237,0.15);
}
.vp-phone-item .vp-phone-dep { color: #14213d; font-weight: 600; font-size: 13px; flex: 1; }
.vp-phone-item .vp-phone-duty { color: #8a95ad; font-size: 11px; }
.vp-phone-item .vp-phone-num { color: #2f6fed; font-size: 13px; font-weight: 600; }

/* 拨打按钮 */
.call-btn {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; border-radius: 13px; text-decoration: none;
  background: rgba(34,165,91,0.14); border: 1px solid rgba(34,165,91,0.3);
  color: #22a55b; font-size: 11px; cursor: pointer; transition:background-color 0.2s,color 0.2s,border-color 0.2s,transform 0.2s,opacity 0.2s,box-shadow 0.2s;
  white-space: nowrap;
}
.call-btn:hover { background: rgba(34,165,91,0.28); color: #34b96f; }
.call-btn.red { background: rgba(47,111,237,0.12); border-color: rgba(47,111,237,0.25); color: #e2444a; }
.call-btn.red:hover { background: rgba(47,111,237,0.22); color: #f2a3a8; }

/* 导航前往按钮 */
.pop-nav { margin-top: 10px; }
.pn-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 9px 0; border-radius: 8px;
  background: linear-gradient(135deg, #2f6fed, #1a4a7a);
  border: none; color: #fff; font-size: 13px; font-weight: 700;

<script>
// ========== 权限验证 ==========
if (sessionStorage.getItem('xyc_auth') !== '1') {
  window.location.replace('index.html');
}

// ========== bfcache 往返缓存修复 ==========
// 从看板/其他页面返回地图页时，浏览器可能直接从 bfcache 恢复页面快照（JS 不重新执行），
// 导致地图图层/隐患点/天气数据停留在空状态。检测到从 bfcache 恢复时强制整页刷新。
window.addEventListener('pageshow', function(e) {
  var needReload = false;
  if (e.persisted) needReload = true;
  if (!needReload) {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if ((nav && nav.type === 'back_forward') || (performance.navigation && performance.navigation.type === 2)) needReload = true;
  }
  if (needReload) {
    window.location.replace(window.location.pathname + '?_r=' + Date.now() + window.location.hash);
  }
});

// ========== 村庄配置 ==========
// SHP数据中的村名映射（SHP名 → 完整名）
var SHP_VILLAGE_MAP = {
  '常坪村': '常家坪村',
  '河坝村': '杨家河坝村'
};

// 完整名 → SHP名
var REVERSE_SHP_MAP = {
  '常家坪村': '常坪村',
  '杨家河坝村': '河坝村'
};

// 从 village_centers.js 动态构建村庄列表
var VILLAGE_ORDER = ['上塬村', '东塬村', '刘家湾社区', '孟塬村', '常家坪村', '新塬村', '杨坪村', '杨家河坝村', '甘岔村', '老庄村'];
var VILLAGES = [{ id: 'all', name: '全部村庄', center: [36.15, 105.38], zoom: 13 }];
// 注意：village_centers.js 是 defer 脚本，解析内联脚本时尚未执行，故在 onload（defer 全部执行完）后再构建
function buildVillages() {
  if (typeof VILLAGE_CENTERS === 'undefined') return;
  VILLAGE_ORDER.forEach(function(vname) {
    var shpName = REVERSE_SHP_MAP[vname] || vname;
    var center = VILLAGE_CENTERS[shpName];
    if (center) {
      VILLAGES.push({ id: vname, name: vname, center: [center.lat, center.lng], zoom: 16 });
    }
  });
}

// ========== 全局变量 ==========
var map = null;
var layers = {};
var layerVisible = { hazards: true, routes: true, sites: true, threatened: true, majorRoads: true, placeNames: true };
var currentVillageId = 'all';
var MAP_BOUNDS = [[35.5, 104.5], [37.0, 106.8]];
// 导航（路线规划）相关
var routeLayer = null;      // 驾车路线折线
var routeMarker = null;     // 终点标记
var routeInfoEl = null;     // 路线信息浮层

// ========== 工具函数 ==========
// SHP村名映射（SHP数据用简称 → 完整名）
var SHP_VILLAGE_MAP = {
  '常坪村': '常家坪村',
  '河坝村': '杨家河坝村'
};
var REVERSE_SHP_MAP = {};
Object.keys(SHP_VILLAGE_MAP).forEach(function(k) { REVERSE_SHP_MAP[SHP_VILLAGE_MAP[k]] = k; });

// 各村切坡建房户数（按 SHP 隐患点位统计：每户一个点，与地图红点一一对应）
// 排除7个"全镇级"地质灾害汇总点；受威胁人口来自"一页纸数据"威胁户人数
function getShpHouseholds(vname) {
  var shpName = REVERSE_SHP_MAP[vname] || vname;
  var count = 0;
  if (typeof DATA_HAZARD_POINTS === 'undefined' || !DATA_HAZARD_POINTS.features) return 0;
  DATA_HAZARD_POINTS.features.forEach(function(f) {
    var p = f.properties || {};
    if (p.source === 'vector_data') return;
    if ((p.CZ || '') === shpName) count++;
  });
  return count;
}

function getVillagePlanStats(vname) {
  var stats = { hazards: 0, households: 0, people: 0 };
  if (typeof VILLAGE_PLANS === 'undefined' || !VILLAGE_PLANS[vname]) return stats;
  var hazards = VILLAGE_PLANS[vname].hazards || [];
  stats.hazards = hazards.length;
  // 切坡建房户数按 SHP 隐患点位统计（与地图红点一致）
  stats.households = getShpHouseholds(vname);
  // 受威胁人口保留"一页纸数据"口径（威胁户/人）
  hazards.forEach(function(h) {
    var m = (h.scope || '').match(/(\d+)\s*户\s*(\d+)\s*人/);
    if (m) {
      stats.people += parseInt(m[2], 10);
    }
  });
  return stats;
}

function showStatus(msg) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 3000);
}

// ========== 导航前往（安置点/备选点/隐患点通用） ==========
function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
}
function showRouteInfo(html) {
  if (!routeInfoEl) {
    routeInfoEl = document.createElement('div');
    routeInfoEl.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:1200;'
      + 'background:rgba(255,255,255,0.96);color:#14213d;padding:10px 18px;border-radius:10px;'
      + 'border:1px solid #1e293b;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.5);'
      + 'text-align:center;max-width:90vw;display:flex;align-items:center;gap:10px;';
    routeInfoEl.appendChild(document.createElement('span'));
    var btn = document.createElement('button');
    btn.textContent = '\u00D7';
    btn.style.cssText = 'background:transparent;border:none;color:#8a95ad;font-size:16px;cursor:pointer;line-height:1;';
    btn.onclick = function() { hideRouteInfo(); };
    routeInfoEl.appendChild(btn);
    document.body.appendChild(routeInfoEl);
  }
  routeInfoEl.childNodes[0].innerHTML = html;
  routeInfoEl.style.display = 'flex';
}
function hideRouteInfo() {
  if (routeInfoEl) routeInfoEl.style.display = 'none';
}
function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (routeMarker) { map.removeLayer(routeMarker); routeMarker = null; }
  hideRouteInfo();
}

// 导航前往：手机唤起高德App，电脑端规划驾车路线
function navigateTo(lng, lat, name) {
  if (isMobileDevice()) {
    // 手机端：唤起高德地图App（未安装则打开网页版导航）
    var url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car&src=xinyuan';
    window.open(url, '_blank');
    return;
  }
  // PC端：先获取当前位置作为起点，再规划驾车路线
  if (!navigator.geolocation) { alert('浏览器不支持定位，无法规划路线'); return; }
  showRouteInfo('正在获取当前位置…');
  navigator.geolocation.getCurrentPosition(function(pos) {
    var gcj = wgs84ToGcj02(pos.coords.longitude, pos.coords.latitude);
    planRoute(gcj[0], gcj[1], lng, lat, name);
  }, function() {
    hideRouteInfo();
    alert('无法获取当前位置，请先在浏览器中允许定位，或直接用手机导航');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

// PC端：调用云函数 /api/route 中转高德驾车路线（安全改造：高德 Key 不再出现在前端）
function planRoute(slng, slat, elng, elat, name) {
  clearRoute();
  showRouteInfo('正在规划驾车路线…');
  var key = sessionStorage.getItem('xyc_key') || '';
  var device = sessionStorage.getItem('xyc_device') || '';
  fetch(FEISHU_CONFIG.apiBase + '/api/route', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json; charset=utf-8',
      'x-xyc-key': key,
      'x-xyc-device': device
    },
    body: JSON.stringify({ origin: slng + ',' + slat, destination: elng + ',' + elat })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d && d.code === 0 && d.data) { handleRouteResult(d.data, elng, elat, name); return; }
    hideRouteInfo();
    alert('路线获取失败：' + ((d && d.msg) || '未知原因'));
  })
  .catch(function() { hideRouteInfo(); alert('网络错误，路线获取失败'); });
}
function handleRouteResult(data, elng, elat, name) {
  if (!data || data.status !== '1' || !data.route || !data.route.paths || data.route.paths.length === 0) {
    hideRouteInfo();
    alert('未找到可行路线：' + ((data && data.info) || '未知原因'));
    return;
  }
  var path = data.route.paths[0];
  var points = [];
  (path.steps || []).forEach(function(st) {
    if (!st.polyline) return;
    st.polyline.split(';').forEach(function(pt) {
      var xy = pt.split(',');
      if (xy.length >= 2) points.push([parseFloat(xy[1]), parseFloat(xy[0])]);
    });
  });
  if (points.length === 0) { hideRouteInfo(); alert('路线解析失败，请重试'); return; }
  routeLayer = L.polyline(points, { color: '#2f6fed', weight: 5, opacity: 0.9, dashArray: '10, 8' }).addTo(map);
  map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });
  routeMarker = L.circleMarker([elat, elng], { radius: 8, fillColor: '#2f6fed', color: '#fff', weight: 2, fillOpacity: 0.9 })
    .addTo(map).bindPopup('<b>' + esc(name) + '</b>（终点）');
  var distKm = (path.distance / 1000).toFixed(1);
  var mins = Math.round(path.duration / 60);
  showRouteInfo('&#x1F6E3; 驾车约 <b>' + distKm + ' 公里</b> · 预计 <b>' + mins + ' 分钟</b>');
}

// 导航按钮 HTML（安置点/备选点弹窗通用）
function navButtonHtml(lng, lat, name) {
  return '<div class="pop-nav"><button class="pn-btn" onclick="navigateTo(' +
    lng + ',' + lat + ',\'' + escAttr(name) + '\')">&#x1F9ED; 导航前往</button></div>';
}

// ========== WGS84 → GCJ-02 ==========
var PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
function isOutOfChina(lng, lat) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function transformLat(x, y) {
  var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320.0 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lng, lat) {
  if (isOutOfChina(lng, lat)) return [lng, lat];
  var dLat = transformLat(lng - 105.0, lat - 35.0);
  var dLng = transformLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * PI;
  var magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}
function convertCoords(obj) {
  if (obj === null || obj === undefined) return obj;
  if (Array.isArray(obj) && obj.length === 2 && typeof obj[0] === 'number' && typeof obj[1] === 'number') {
    return wgs84ToGcj02(obj[0], obj[1]);
  }
  if (Array.isArray(obj)) return obj.map(convertCoords);
  return obj;
}
function convertGeoJSON(geojson) {
  return JSON.parse(JSON.stringify(geojson), function(key, value) {
    if (key === 'coordinates') return convertCoords(value);
    return value;
  });
}

// SHP村名 → 完整村名
function shpToFullName(shpName) {
  return SHP_VILLAGE_MAP[shpName] || shpName;
}

// 完整村名 → SHP村名
function fullToShpName(fullName) {
  return REVERSE_SHP_MAP[fullName] || fullName;
}

// ========== 初始化地图 ==========
function initMap() {
  showStatus('正在加载地图…');

  map = L.map('map', {
    center: VILLAGES[0].center,
    zoom: 13,
    minZoom: 10,
    maxBounds: MAP_BOUNDS,
    maxBoundsViscosity: 0.8,
    zoomControl: false,
    attributionControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 高德卫星图
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3
  }).addTo(map);

  // 高德路网标注
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3, opacity: 0.6
  }).addTo(map);

  // 初始化图层组
  layers.hazards = L.layerGroup().addTo(map);
  layers.routes = L.layerGroup().addTo(map);
  layers.sites = L.layerGroup().addTo(map);
  layers.backups = L.layerGroup().addTo(map);
  layers.stations = L.layerGroup().addTo(map);
  layers.rivers = L.layerGroup().addTo(map);
  layers.roads = L.layerGroup().addTo(map);
  layers.threatened = L.layerGroup().addTo(map);
  layers.majorRoads = L.layerGroup().addTo(map);
  layers.placeNames = L.layerGroup().addTo(map);

  // 加载数据
  loadHazardPoints();
  loadHazardAreas();
  loadEvacuationRoutes();
  loadEvacuationSites();
  loadBackupSites();
  loadRainStations();
  loadThreatenedAreas();
  loadLargeLayers();

  // 构建村庄下拉
  buildVillageDropdown();
  updateStats();

  // 点击地图空白处自动收起图例/图层面板，避免遮挡
  map.on('click', function() {
    if (window.innerWidth <= 768) {
      setLegendOpen(false);
      closeLayerSheet();
    }
  });

  // 手机端图例默认折叠
  if (window.innerWidth <= 768) setLegendOpen(false);

  showStatus('地图加载完成');
}

// ========== 加载数据图层 ==========
function loadHazardPoints() {
  if (typeof DATA_HAZARD_POINTS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_POINTS);
  var geojson = L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      var p = feature.properties;
      var risk = p.risk_level || '';
      var radius = 7;
      var fillColor = '#ff4444';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) {
        radius = 9; fillColor = '#d32f2f';
      } else if (risk.indexOf('一般') >= 0) {
        radius = 6; fillColor = '#ff7043';
      }
      return L.circleMarker(latlng, {
        radius: radius, fillColor: fillColor, color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var risk = p.risk_level || '';

      // 风险等级徽章
      var badgeClass = 'info';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) badgeClass = 'danger';
      else if (risk.indexOf('一般') >= 0) badgeClass = 'warn';

      var html = '<div class="popup-content">';
      html += '<div class="pop-title">' + esc(p.HZXM || '隐患点') + ' 的家</div>';

      // 户主信息
      if (p.HZXM) html += '<div class="pop-row"><span class="pop-label">户主</span><span class="pop-val">' + esc(p.HZXM) + '</span></div>';
      if (p.phone) html += '<div class="pop-row"><span class="pop-label">电话</span><span class="pop-val">' + esc(p.phone) + '</span></div>';

      // 村组
      var cz = shpToFullName(p.CZ) || p.CZ;
      if (cz) html += '<div class="pop-row"><span class="pop-label">所属村组</span><span class="pop-val">' + esc(cz) + '</span></div>';

      // 风险等级
      if (risk) html += '<div class="pop-row"><span class="pop-label">风险等级</span><span class="pop-val"><span class="pop-badge ' + esc(badgeClass) + '">' + esc(risk) + '</span></span></div>';

      // 责任人
      if (p.resp_person) html += '<div class="pop-row"><span class="pop-label">避险责任人</span><span class="pop-val">' + esc(p.resp_person) + '</span></div>';
      if (p.resp_phone) html += '<div class="pop-row"><span class="pop-label">责任人电话</span><span class="pop-val">' + esc(p.resp_phone) + '</span></div>';

      // 避险点
      if (p.evac_site) html += '<div class="pop-row"><span class="pop-label">避险点</span><span class="pop-val">' + esc(p.evac_site) + '</span></div>';

      // 隐患详情（YHXX原始文本）
      if (p.YHXX) {
        var desc = esc(p.YHXX).replace(/\n/g, '<br>');
        html += '<div class="pop-desc">' + desc + '</div>';
      }

      // 切坡建房照片（登录后拉取，点击可放大）
      var popVillage = shpToFullName(p.CZ) || p.CZ || '';
      var popOwner = p.HZXM || '';
      if (popVillage && popOwner) {
        html += '<div class="pop-photos" data-v="' + esc(popVillage) + '" data-o="' + esc(popOwner) + '"><span class="ph-muted">照片加载中…</span></div>';
      }

      html += '</div>';
      layer.bindPopup(html, { maxWidth: 400, className: 'custom-popup' });
      if (popVillage && popOwner) {
        layer.on('popupopen', function() {
          var el = layer.getPopup().getElement();
          var holder = el.querySelector('.pop-photos');
          if (holder && !holder.dataset.done) {
            holder.dataset.done = '1';
            photoFillPopup(holder, popVillage, popOwner);
          }
        });
      }
    }
  });
  layers.hazards.addLayer(geojson);
}

function loadHazardAreas() {
  if (typeof DATA_HAZARD_AREAS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_AREAS);
  L.geoJSON(data, {
    style: { color: '#ff4444', fillColor: '#ff4444', fillOpacity: 0.12, weight: 2 },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.YCMC || p.XZQMC || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'hazard-tooltip' });
    }
  }).addTo(layers.hazards);
}

function loadEvacuationRoutes() {
  if (typeof DATA_EVACUATION_ROUTES === 'undefined') return;
  var data = convertGeoJSON(DATA_EVACUATION_ROUTES);
  L.geoJSON(data, {
    style: function(feature) {
      return { color: '#2196f3', weight: 4, opacity: 0.75, dashArray: '8, 6' };
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.ROAD_NAME || p.NAME || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'route-tooltip' });
    }
  }).addTo(layers.routes);
}

function loadEvacuationSites() {

// 安全加载 js_data 静态文件：解析 `var NAME = {...}` 为 JSON 后赋值全局变量（不再使用 eval）
function parseJsDataText(text) {
  try {
    var clean = String(text || '').replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:])\/\/.*$/gm, '$1');
    var m = /(?:^|\n)\s*(?:var\s+|window\.)?([A-Za-z_$][\w$]*)\s*=\s*([\[\{])/.exec(clean);
    if (!m) return null;
    var name = m[1], open = m[2], close = open === '{' ? '}' : ']';
    var depth = 0, inStr = false, escF = false, seg = '', i = m.index + m[0].length - 1;
    for (; i < clean.length; i++) {
      var ch = clean[i];
      if (inStr) {
        seg += ch;
        if (escF) escF = false;
        else if (ch === '\\') escF = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') { inStr = true; seg += ch; continue; }
      if (ch === open) depth++;
      else if (ch === close) { depth--; if (depth === 0) { seg += ch; i++; break; } }
      seg += ch;
    }
    if (depth !== 0) return null;
    window[name] = JSON.parse(seg);
    return { name: name, data: window[name] };
  } catch (e) { return null; }
}
function loadJsData(path, onload) {
  fetch(path).then(function(r) { return r.text(); }).then(function(js) {
    var v = parseJsDataText(js);
    if (onload) onload(v);
  }).catch(function() { if (onload) onload(null); });
}

function buildVillageDropdown() {
  var dropdown = document.getElementById('village-dropdown');
  VILLAGES.forEach(function(v) {

      var total = 0;
      VILLAGE_ORDER.forEach(function(vname) { total += getVillagePlanStats(vname).hazards; });
      document.getElementById('count-all').textContent = total + '处';
      return;
    }
    var stats = getVillagePlanStats(v.id);
    var div = document.createElement('div');
    div.className = 'v-item';
    div.setAttribute('data-vid', v.id);
    div.innerHTML = '<span class="v-dot"></span>' + v.name + '<span class="v-count">' + (stats.hazards > 0 ? stats.hazards + '处' : '') + '</span>';

function selectVillage(id, name, suppressInfo) {
  currentVillageId = id;
  document.getElementById('currentVillage').textContent = name;
  document.getElementById('village-dropdown').classList.remove('show');
  document.getElementById('villageSelect').classList.remove('open');

  // 更新下拉高亮
  document.querySelectorAll('#village-dropdown .v-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-vid') === id) el.classList.add('active');
  });

  var v = VILLAGES.find(function(v) { return v.id === id; });
  if (v) {
    map.flyTo(v.center, v.zoom, { duration: 1 });
  }

  // 显示/隐藏村庄信息面板
  if (id === 'all') {
    closeVillageInfo();
    if (sidePanelOpen) showSidePanelOverview();
    var bbAll = document.getElementById('bb-panel');
    if (bbAll) bbAll.classList.remove('active');
  } else {
    if (!suppressInfo) showVillageInfo(id);
    if (sidePanelOpen) showSidePanelVillage(id);
    var bbSel = document.getElementById('bb-panel');
    if (bbSel) bbSel.classList.add('active');
  }
}

// ========== 村庄信息面板（子菜单模板） ==========
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 从文本提取电话号码
function extractPhone(str) {
  if (!str) return '';
  var m = str.match(/\d{11}|(?:\d{3,4})-?\d{7,8}/);
  return m ? m[0] : '';
}

var VP_TABS = [
  ['cmd', '&#x1F465;', '应急指挥'],
  ['transfer', '&#x26A0;', '转移谁'],
  ['when', '&#x23F0;', '何时转'],
  ['where', '&#x1F3E0;', '转何处'],
  ['return', '&#x1F6AB;', '不擅返'],
  ['phone', '&#x1F4DE;', '应急电话'],
  ['patrol', '&#x1F4DD;', '巡查记录']
];

function renderVpTabContent(vid, tab, plan) {
  var has = plan !== null;
  if (tab === 'cmd') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F3E2;</span>应急指挥</div>';
    if (!has || (!plan.leader && !plan.town_contact)) return h + '<div class="vp-empty">暂无应急指挥信息</div>';
    if (plan.leader) {
      var lp = extractPhone(plan.leader);
      h += '<div class="vp-person"><span class="vp-role">总指挥</span><span class="vp-name">' + esc(plan.leader) + '</span>' +
        (lp ? '<span class="vp-phone">' + lp + '</span><a class="call-btn" href="tel:' + lp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
    }
    if (plan.town_contact) {
      var tp = extractPhone(plan.town_contact);
      h += '<div class="vp-person"><span class="vp-role">乡镇责任人</span><span class="vp-name">' + esc(plan.town_contact) + '</span>' +
        (tp ? '<span class="vp-phone">' + tp + '</span><a class="call-btn" href="tel:' + tp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
    }
    return h;
  }

  if (tab === 'transfer') {
    var h = '<div class="vp-sec-title"><span class="sp-icon"><span data-ic="alert-triangle" data-ic-size="15"></span></span>转移谁（隐患点明细）</div>';
    if (!has || !plan.hazards || plan.hazards.length === 0) return h + '<div class="vp-empty">暂无隐患点数据</div>';
    plan.hazards.forEach(function(hz, idx) {
      h += '<div class="vp-hazard">';
      h += '<div class="vp-h-name">' + (idx + 1) + '. ' + esc(hz.name) + (hz.scope ? '<span class="vp-h-badge">' + esc(hz.scope) + '</span>' : '') + '</div>';
      if (hz.persons && hz.persons.length > 0) {
        hz.persons.forEach(function(p) {
          if (!p.name) return;
          h += '<div class="vp-hh"><div class="vp-hh-top"><span class="vp-hh-name">' + esc(p.name) + '</span>' +
            (p.count ? '<span class="vp-hh-count">撤离 ' + esc(p.count) + ' 人</span>' : '') + '</div>';
          if (p.list) h += '<div class="vp-hh-list">' + esc(p.list) + '</div>';
          h += '</div>';
        });
      }
      if (hz.responsible) {
        var rp = extractPhone(hz.responsible);
        h += '<div class="vp-h-info">责任人：<b>' + esc(hz.responsible) + '</b>' + (rp ? ' <a class="call-btn red" href="tel:' + rp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
      }
      if (hz.shelter) h += '<div class="vp-h-info">安置点：' + esc(hz.shelter) + '</div>';
      h += '</div>';
    });
    return h;
  }

  if (tab === 'when') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x23F0;</span>何时转（转移时机）</div>';
    if (!has || !plan.rules_transfer || plan.rules_transfer.length === 0) return h + '<div class="vp-empty">暂无转移原则</div>';
    plan.rules_transfer.forEach(function(r) {
      h += '<div class="vp-rule"><span class="vp-rule-ico">&#x2705;</span><span>' + esc(r) + '</span></div>';
    });
    return h;
  }

  if (tab === 'where') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F3E0;</span>转何处（安置点）</div>';
    if (!has || !plan.shelters || plan.shelters.length === 0) return h + '<div class="vp-empty">暂无安置点数据</div>';
    plan.shelters.forEach(function(s, idx) {
      h += '<div class="vp-hazard" style="border-color:rgba(34,197,94,0.15);background:rgba(34,197,94,0.05);">';
      h += '<div class="vp-h-name" style="color:#22a55b;">' + (idx + 1) + '. ' + esc(s.name) + '</div>';
      if (s.shelter) h += '<div class="vp-h-info">安置地点：<b>' + esc(s.shelter) + '</b></div>';
      if (s.responsible) {
        var sp = extractPhone(s.responsible);
        h += '<div class="vp-h-info">安置点负责人：<b>' + esc(s.responsible) + '</b>' + (sp ? ' <a class="call-btn" href="tel:' + sp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
      }
      h += '</div>';
    });
    return h;
  }

  if (tab === 'return') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F6AB;</span>不擅返（返回规定）</div>';
    if (!has || !plan.rules_return || plan.rules_return.length === 0) return h + '<div class="vp-empty">暂无返回规定</div>';
    plan.rules_return.forEach(function(r) {
      h += '<div class="vp-rule"><span class="vp-rule-ico">&#x1F6D1;</span><span>' + esc(r) + '</span></div>';
    });
    return h;
  }

  if (tab === 'phone') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F4DE;</span>上级应急部门电话</div>';
    var contacts = (typeof AUTHORITY_CONTACTS !== 'undefined') ? AUTHORITY_CONTACTS : [];
    if (contacts.length === 0) return h + '<div class="vp-empty">暂无应急电话</div>';
    contacts.forEach(function(c) {
      var ph = c.phone || '';
      h += '<div class="vp-phone-item"><span class="vp-phone-dep">' + esc(c.department) + '</span>' +
        (c.duty ? '<span class="vp-phone-duty">' + esc(c.duty) + '</span>' : '') +
        '<span class="vp-phone-num">' + esc(ph) + '</span>' +
        '<a class="call-btn" href="tel:' + ph + '">&#x1F4DE;</a></div>';
    });
    return h;
  }
  if (tab === 'patrol') {
    return renderPatrolTab(vid);
  }
  return '';
}

// 渲染村级详情面板（子菜单）
// hidePatrol: 为 true 时隐藏"巡查记录"页签（左上角村庄信息弹窗用它，巡查统一走底部工具栏入口）
function renderVillagePanel(vid, container, hidePatrol) {
  var plan = (typeof VILLAGE_PLANS !== 'undefined' && VILLAGE_PLANS[vid]) ? VILLAGE_PLANS[vid] : null;
  var contentId = 'vp-content-' + encodeURIComponent(vid);
  var html = '<div class="vp-tabs">';
  VP_TABS.forEach(function(t, i) {
    if (hidePatrol && t[0] === 'patrol') return;
    html += '<div class="vp-tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t[0] + '"><span class="vp-tab-icon">' + t[1] + '</span>' + t[2] + '</div>';
  });
  html += '</div>';
  html += '<div class="vp-content" id="' + contentId + '">' + renderVpTabContent(vid, 'cmd', plan) + '</div>';
  container.innerHTML = html;

  var tabs = container.querySelectorAll('.vp-tab');
  for (var i = 0; i < tabs.length; i++) {
    (function(tab) {
      tab.onclick = function() {
        for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
        tab.classList.add('active');
        var c = document.getElementById(contentId);
        if (c) {
          c.innerHTML = renderVpTabContent(vid, tab.getAttribute('data-tab'), plan);
          // 巡查记录：渲染后异步从云端刷新，保证多账号共享的最新数据可见
          if (tab.getAttribute('data-tab') === 'patrol' && typeof refreshPatrolList === 'function') {
            refreshPatrolList(vid);
          }
        }
      };
    })(tabs[i]);
  }
}

// ========== 图层切换 ==========
function toggleLayer(name) {
  layerVisible[name] = !layerVisible[name];
  var visible = layerVisible[name];
  var btn = document.getElementById('btn-' + name);
  if (visible) {
    if (name === 'sites') {
      layers.sites.addTo(map);
      layers.backups.addTo(map);
    } else {
      layers[name].addTo(map);
    }
  } else {
    if (name === 'sites') {
      layers.sites.remove();
      layers.backups.remove();
    } else {
      layers[name].remove();
    }
  }
  if (btn) {
    visible ? btn.classList.remove('off') : btn.classList.add('off');
  }
  syncLayerSheet();
}

function renderLayerSheet() {

function escAttr(s) { return String(s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function fmtTime(v) {
  if (!v) return '';
  var s = String(v);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function out(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  // 纯数字时间戳（秒或毫秒）
  if (/^\d{10,13}$/.test(s)) {
    var n = Number(s); if (n < 1e12) n *= 1000;
    var d = new Date(n);
    if (!isNaN(d.getTime())) return out(d);
  }
  // ISO 格式（含 T 或带时区偏移）
  if (s.indexOf('T') > -1) {
    var d2 = new Date(s);
    if (!isNaN(d2.getTime())) return out(d2);
  }
  // 已格式化的 2026-08-28 10:30（无 T）或无法解析：直接规整显示
  return s.replace(/T/g, ' ').replace(/\.\d+/, '').replace(/(\+|-)\d{2}:?\d{2}$/, '');
}

function compressPhoto(file, callback) {
  v29CompressPhoto(file, function(blob) {
    if (!blob) { callback(''); return; }
    var r = new FileReader();
    r.onload = function(e) { callback(e.target.result); };
    r.readAsDataURL(blob);
  });
}
function v29CompressPhoto(file, cb) {
  if (!file) { cb(null); return; }
  if (typeof localStorage !== 'undefined' && localStorage.getItem('xyc_nocompress') === '1') { cb(file); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX = 1600;
      var scale = Math.min(1, MAX / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      try {
        var d = new Date();
        var pad2 = function(n) { return String(n).padStart(2, '0'); };
        var stamp = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        var fs = Math.max(12, Math.round(cv.width / 85));
        ctx.font = fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textBaseline = 'bottom';
        var label = '新塬应急 ' + stamp;
        var tw = ctx.measureText(label).width;
        var bx = cv.width - tw - 12, by = cv.height - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 6, by - fs - 6, tw + 12, fs + 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(label, bx, by);
      } catch(e2) {}
      if (cv.toBlob) { cv.toBlob(function(blob) { cb(blob); }, 'image/jpeg', 0.8); }
      else {
        var dataUrl = cv.toDataURL('image/jpeg', 0.8);
        var bin = atob(dataUrl.split(',')[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        cb(new Blob([arr], { type: 'image/jpeg' }));
      }
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

// ===== IndexedDB 巡查离线队列（升级 v20260901-m1）=====
function openPatrolDB(cb) {
  if (PT_DB) { cb(PT_DB); return; }
  try {
    var req = indexedDB.open(PT_DB_NAME, 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath: 'id' });
    };
    req.onsuccess = function(e) { PT_DB = e.target.result; cb(PT_DB); };
    req.onerror = function() { cb(null); };
  } catch(e2) { cb(null); }
}
function queueOfflinePatrol(record) {
  openPatrolDB(function(db) {
    if (!db) { try { var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]'); all.unshift(record); localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(all)); } catch(e2){} return; }
    try { var tx = db.transaction('queue', 'readwrite'); tx.objectStore('queue').put(record); } catch(e2){}
  });
  saveLocalPatrolRecord(record);
}
function getOfflineQueue(cb) {
  openPatrolDB(function(db) {
    if (!db) { cb([]); return; }
    try {
      var tx = db.transaction('queue', 'readonly');
      var req = tx.objectStore('queue').getAll();
      req.onsuccess = function() { cb(req.result || []); };
      req.onerror = function() { cb([]); };
    } catch(e2) { cb([]); }
  });
}
function delOfflineQueue(id) {
  openPatrolDB(function(db) {
    if (!db) return;
    try { var tx = db.transaction('queue', 'readwrite'); tx.objectStore('queue').delete(id); } catch(e2){}
  });
}
function saveCloudOfflinePatrol(record, callback) {
  var photos = record.ptPhotos || [];
  var urls = [];
  var step = 0;
  function next() {
    if (step < photos.length) {
      uploadPatrolPhoto(photos[step].dataUrl, record.village).then(function(url) {
        if (url) urls.push(url);
        step++; next();
      });
    } else {
      record.photoUrls = urls;
      savePatrolRecord(record, function(ok) { callback(ok); });
    }
  }
  next();
}
function flushOfflinePatrol() {
  if (navigator.onLine === false) return;
  getOfflineQueue(function(queue) {
    var bar = document.getElementById('pf-offline-bar');
    if (!queue.length) { if (bar) bar.style.display = 'none'; return; }
    if (bar) { bar.style.display = 'block'; bar.textContent = '正在补传 ' + queue.length + ' 条离线巡查记录…'; }
    var done = 0;
    queue.forEach(function(rec) {
      saveCloudOfflinePatrol(rec, function(ok) {
        if (ok) delOfflineQueue(rec.id);
        if (++done >= queue.length) {
          if (bar) { bar.textContent = ok ? '离线记录补传完成' : '部分离线记录补传失败，稍后再试'; setTimeout(function(){ bar.style.display = 'none'; }, 3000); }
          var listEl = document.querySelector('.patrol-list');
          if (listEl && currentPatrolVid) refreshPatrolList(currentPatrolVid);
        }
      });
    });
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(flushOfflinePatrol, 2000); });
} else {
  setTimeout(flushOfflinePatrol, 2000);
}
window.addEventListener('online', flushOfflinePatrol);

function getLocalPatrolRecords(vname) {

}

function saveLocalPatrolRecord(record) {
  try {
    var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
    all.unshift(record);
    while (all.length > 200) all.pop();
    localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(all));
    return true;
  } catch(e) { return false; }
}

function deleteLocalPatrolRecord(id, vname) {
  try {
    var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
    all = all.filter(function(r) { return !(r.id === id && r.village === vname); });
    localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(all));
    return true;
  } catch(e) { return false; }
}

function getPatrolRecords(vname, callback) {
  var filter = JSON.stringify({ logic: 'and', conditions: [['村名', '==', vname]] });
  var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
    '/tables/' + FEISHU_CONFIG.tables.patrol +
    '/records?page_size=200&filter=' + encodeURIComponent(filter);
  feishuRequest('GET', path, null, function(data, err) {
    if (err || !data || data.code !== 0) {
      if (callback) callback(getLocalPatrolRecords(vname));
      return;
    }
    var records = feishuRowsToObjects(data).map(function(it) {
      var f = it.fields || {};
      var lng = f['经度'], lat = f['纬度'];
      var loc = null;
      if (lng != null && lat != null) loc = { lng: Number(lng), lat: Number(lat) };
      var photoUrls = (f['照片URLs'] || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      return {
        record_id: it.record_id || '',
        id: it.record_id || (vname + '-' + (f['巡查时间'] || '')),
        village: vname,
        inspector: f['巡查人'] || '',
        location: loc,
        locationText: loc ? '经度 ' + loc.lng.toFixed(6) + ' 纬度 ' + loc.lat.toFixed(6) : '',
        locationDesc: f['位置描述'] || '',
        weather: f['天气'] || '',
        photo: f['照片base64'] || '',
        photoUrls: photoUrls,
        description: f['巡查描述'] || '',
        time: fmtTime(f['巡查时间'])
      };
    });
    try {
      var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
      var others = all.filter(function(r) { return r.village !== vname; });
      var merged = records.slice();
      var seenIds = {};
      records.forEach(function(r) { if (r.record_id) seenIds[r.record_id] = true; });
      all.forEach(function(r) {
        if (r.village !== vname) return;
        if (r.record_id && seenIds[r.record_id]) return;
        merged.push(r);
      });
      var seen = {};
      var seenContent = {};
      merged = merged.filter(function(r) {
        var k = r.record_id || r.id;
        if (!k || seen[k]) return false;
        seen[k] = true;
        var ck = (r.village||'') + '|' + (r.inspector||'') + '|' + (r.time||'') + '|' + (r.description||'');
        if (seenContent[ck]) return false;
        seenContent[ck] = true;
        return true;
      });
      localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(others.concat(merged)));
      if (callback) callback(merged);
      return;
    } catch(e) {}
    if (callback) callback(records);
  });
}

function savePatrolRecord(record, callback) {
  var fields = {
    '村名': record.village,
    '巡查人': record.inspector || '',
    '巡查描述': record.description || '',
    '天气': record.weather || '',
    '巡查时间': record.time || ''
  };
  if (record.location) {
    fields['经度'] = record.location.lng;
    fields['纬度'] = record.location.lat;
  }
  if (record.locationDesc) fields['位置描述'] = record.locationDesc;
  if (record.photoUrls && record.photoUrls.length) fields['照片URLs'] = record.photoUrls.join(',');
  else if (record.photo && record.photo.length < 120000) fields['照片base64'] = record.photo;
  var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
    '/tables/' + FEISHU_CONFIG.tables.patrol + '/records';
  feishuRequest('POST', path, fields, function(data, err) {
    if (err || !data || data.code !== 0) {
      saveLocalPatrolRecord(record);
      var reason = err || (data && data.msg) || '云端响应超时，已暂存本机';
      if (callback) callback(false, reason);
      return;
    }
    var rid = (data.data && data.data.record_id_list && data.data.record_id_list[0]) || '';
    if (rid) { record.record_id = rid; record.id = rid; }
    saveLocalPatrolRecord(record);
    if (callback) callback(true);
  });
}

function deletePatrolRecord(id, vname, callback) {
  deleteLocalPatrolRecord(id, vname);
  var rid = (typeof id === 'string' && id.indexOf('rec') === 0) ? id : '';
  if (rid) {
    var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
      '/tables/' + FEISHU_CONFIG.tables.patrol + '/records/' + encodeURIComponent(rid);
    feishuRequest('DELETE', path, null, function() {
      if (callback) callback();
    });
  } else {
    if (callback) callback();
  }
}

function getPatrolLocation() {
  if (!navigator.geolocation) {
    showPfMsg('浏览器不支持定位功能，可手动填写位置描述', 'error');
    var ld = document.getElementById('pf-loc-desc');
    if (ld) ld.focus();
    return;
  }
  var el = document.getElementById('pf-location');
  if (el) el.textContent = '正在获取位置…';
  navigator.geolocation.getCurrentPosition(function(pos) {
    var gcj = wgs84ToGcj02(pos.coords.longitude, pos.coords.latitude);
    currentPatrolLocation = { lat: gcj[1], lng: gcj[0] };
    if (el) el.textContent = '经度：' + gcj[0].toFixed(6) + '，纬度：' + gcj[1].toFixed(6);
    fetchPatrolWeather(pos.coords.latitude, pos.coords.longitude);
  }, function(err) {
    if (el) el.textContent = '定位失败，可手动填写位置描述';
    showPfMsg('定位失败，请允许定位权限或在下方填写位置描述（将兜底使用地图中心点）', 'error');
    var ld = document.getElementById('pf-loc-desc');
    if (ld) ld.focus();
  }, { enableHighAccuracy: true, timeout: 20000 });
}

function onPatrolPhotoSelect(input) {
  var files = input.files;
  if (!files || !files.length) return;
  var total = files.length, done = 0;
  showPfMsg('正在压缩 ' + total + ' 张照片…', '');
  var village = currentPatrolVid;
  var role = sessionStorage.getItem('xyc_role') || '';
  var myVillage = sessionStorage.getItem('xyc_village') || '';
  if (role === '村级' && myVillage) village = myVillage;
  Array.prototype.forEach.call(files, function(file) {
    v29CompressPhoto(file, function(blob) {
      done++;
      if (!blob) { if (done >= total) renderPatrolPhotoPreviews(); return; }
      var r = new FileReader();
      r.onload = function(e) {
        var dataUrl = e.target.result;
        patrolPhotos.push({ dataUrl: dataUrl, url: '' });
        if (navigator.onLine !== false && village) {
          uploadPatrolPhoto(dataUrl, village).then(function(url) {
            for (var i = 0; i < patrolPhotos.length; i++) {
              if (patrolPhotos[i].dataUrl === dataUrl) { patrolPhotos[i].url = url || ''; break; }
            }
            renderPatrolPhotoPreviews();
            showPfMsg('已上传云端（共 ' + patrolPhotos.length + ' 张，约 ' + Math.round(patrolPhotos.reduce(function(s,p){return s+p.dataUrl.length/1024;},0)) + 'KB）', 'success');
          });
        } else {
          renderPatrolPhotoPreviews();
          showPfMsg('已离线暂存 ' + patrolPhotos.length + ' 张照片，提交后自动补传', 'success');
        }
      };
      r.readAsDataURL(blob);
    });
  });
  input.value = '';
}
function renderPatrolPhotoPreviews() {
  var box = document.getElementById('pf-photo-thumbs');
  if (!box) return;
  var h = '';
  patrolPhotos.forEach(function(p, i) {
    h += '<div class="ptp-item">'
      + '<img src="' + p.dataUrl + '" alt="照片' + (i + 1) + '" onclick="event.stopPropagation();previewPhoto(this.src)">'
      + '<button type="button" class="ptp-del" onclick="event.stopPropagation();delPatrolPhoto(' + i + ')">&#10005;</button>'
      + (p.url ? '' : '<span class="ptp-off">待传</span>')
      + '</div>';
  });
  box.innerHTML = h;
  box.style.display = patrolPhotos.length ? 'flex' : 'none';
}
function delPatrolPhoto(i) { patrolPhotos.splice(i, 1); renderPatrolPhotoPreviews(); }
function uploadPatrolPhoto(dataUrl, village) {
  return new Promise(function(resolve) {
    fetch(FEISHU_CONFIG.apiBase + '/api/patrol_upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8',
        'x-xyc-key': sessionStorage.getItem('xyc_key') || '',
        'x-xyc-device': sessionStorage.getItem('xyc_device') || '' },
      body: JSON.stringify({ village: village || '', img: dataUrl })
    }).then(function(r){ return r.json(); })
      .then(function(d){ resolve((d && d.code === 0 && d.data && d.data.url) ? d.data.url : null); })
      .catch(function(){ resolve(null); });
  });
}

function submitPatrol(vid) {
  var role = sessionStorage.getItem('xyc_role') || '';
  var myVillage = sessionStorage.getItem('xyc_village') || '';
  var recordVillage = (role === '村级' && myVillage) ? myVillage : vid;
  var inspector = document.getElementById('pf-inspector');
  var desc = document.getElementById('pf-desc');
  var locDescEl = document.getElementById('pf-loc-desc');
  var inspectorVal = inspector ? inspector.value.trim() : '';
  var descVal = desc ? desc.value.trim() : '';
  var locDescVal = locDescEl ? locDescEl.value.trim() : '';

  if (!inspectorVal) { showPfMsg('请填写巡查人姓名', 'error'); return; }
  if (!currentPatrolLocation) {
    var mapCenter = map && map.getCenter();
    if (mapCenter) currentPatrolLocation = { lng: mapCenter.lng, lat: mapCenter.lat };
  }

  var dupKey = vid + '|' + inspectorVal + '|' + descVal + '|' + locDescVal + '|' + patrolPhotos.length;
  if (window._lastPatrolSubmit && window._lastPatrolSubmit.key === dupKey && Date.now() - window._lastPatrolSubmit.ts < 3000) {
    showPfMsg('正在提交中，请勿重复点击', 'error');
    return;
  }

  var btn = document.querySelector('.pf-submit');
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  window._lastPatrolSubmit = { key: dupKey, ts: Date.now() };

  var now = new Date();
  function p2(n) { return String(n).padStart(2,'0'); }
  var timeStr = now.getFullYear() + '-' + p2(now.getMonth()+1) + '-' + p2(now.getDate())
    + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':' + p2(now.getSeconds());

  var record = {
    id: now.getTime(),
    village: recordVillage,
    inspector: inspectorVal,
    location: currentPatrolLocation,
    locationText: currentPatrolLocation ? ('经度 ' + currentPatrolLocation.lng.toFixed(6) + ' 纬度 ' + currentPatrolLocation.lat.toFixed(6)) : '',
    locationDesc: locDescVal,
    weather: getWeatherText(),
    photo: '',
    description: descVal,
    time: timeStr
  };

  function clearForm() {
    patrolPhotos = [];
    currentPatrolLocation = null;
    var box = document.getElementById('pf-photo-thumbs');
    if (box) { box.innerHTML = ''; box.style.display = 'none'; }
    var preview = document.getElementById('pf-photo-preview');
    if (preview) { preview.src = ''; preview.style.display = 'none'; }
    var pi1 = document.getElementById('pf-photo-cam'); if (pi1) pi1.value = '';
    var pi2 = document.getElementById('pf-photo-album'); if (pi2) pi2.value = '';
    if (desc) desc.value = '';
    if (locDescEl) locDescEl.value = '';
    var locEl = document.getElementById('pf-location');
    if (locEl) locEl.textContent = '点击获取GPS位置…';
  }

  // 无网络：整条记录（含照片）入离线队列 IndexedDB
  if (navigator.onLine === false) {
    record.ptPhotos = patrolPhotos.slice();
    queueOfflinePatrol(record);
    if (btn) { btn.disabled = false; btn.textContent = '提交巡查记录'; }
    localStorage.setItem('xyc_last_inspector', inspectorVal);
    showPfMsg('无网络，已离线保存，有网后自动补传', 'success');
    clearForm();
    refreshPatrolList(vid);
    return;
  }

  var pending = patrolPhotos.filter(function(p){ return !p.url; });
  var urls = patrolPhotos.filter(function(p){ return p.url; }).map(function(p){ return p.url; });
  function finishSave() {
    record.photoUrls = urls;
    savePatrolRecord(record, function(ok, err) {
      if (btn) { btn.disabled = false; btn.textContent = '提交巡查记录'; }
      if (ok) {
        localStorage.setItem('xyc_last_inspector', inspectorVal);
        showPfMsg('巡查记录已同步保存！', 'success');
        clearForm();
        refreshPatrolList(vid);
      } else {
        showPfMsg('云端保存失败，已存入本机（' + (err || '未知原因') + '）', 'error');
        setTimeout(function(){ refreshPatrolList(vid); }, 500);
      }
    });
  }
  if (pending.length) {
    showPfMsg('正在上传 ' + pending.length + ' 张照片…', '');
    var step = 0;
    function upNext() {
      if (step < pending.length) {
        uploadPatrolPhoto(pending[step].dataUrl, recordVillage).then(function(url) {
          if (url) { pending[step].url = url; urls.push(url); }
          step++; upNext();
        });
      } else { finishSave(); }
    }
    upNext();
  } else { finishSave(); }
}

function exportPatrolCSV(vid) {
  getPatrolRecords(vid, function(records) {
    if (records.length === 0) {
      alert('该村暂无巡查记录可导出');
      return;
    }
    var BOM = '\uFEFF';
    var header = '序号,村名,巡查人,巡查点位（经度）,巡查点位（纬度）,位置描述,天气情况,巡查情况描述,照片链接,巡查时间\n';
    var rows = '';
    records.forEach(function(r, i) {
      var desc = (r.description || '').replace(/"/g, '""');
      var locDesc = (r.locationDesc || '').replace(/"/g, '""');
      var photoLink = (r.photoUrls && r.photoUrls.length) ? r.photoUrls.join(';') : '';
      rows += (i + 1) + ',' + r.village + ',' + (r.inspector || '') + ',' +
        (r.location ? r.location.lng.toFixed(6) : '') + ',' +
        (r.location ? r.location.lat.toFixed(6) : '') + ',"' + locDesc + '",' +
        (r.weather || '').replace(/,/g, ' ') + ',"' + desc + '",' + photoLink.replace(/,/g, ';') + ',' + r.time + '\n';
    });
    var csv = BOM + header + rows;
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = vid + '_巡查记录_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

  var MAP_DATA_FILES = ['hazard_points.js', 'village_info.js', 'village_plans.js',
                  'village_hazard_summary.js', 'threatened_areas.js',
                  'evacuation_sites.js', 'backup_sites.js'];
  // 地图关键数据就绪检查：任一缺失自动重试恢复（防"返回地图后数据没了"）
  function mapDataReady() {
    return typeof DATA_HAZARD_POINTS !== 'undefined' &&
           typeof VILLAGE_INFO !== 'undefined' &&
           typeof VILLAGE_PLANS !== 'undefined' &&
           typeof DATA_THREATENED_AREAS !== 'undefined' &&
           typeof DATA_EVACUATION_SITES !== 'undefined' &&
           typeof DATA_BACKUP_SITES !== 'undefined';
  }
  function startMap(attempt) {
    loadSecureData(MAP_DATA_FILES, function() {
      if (!mapDataReady()) {
        if (attempt > 0) { setTimeout(function() { startMap(attempt - 1); }, 600); return; }
        document.getElementById('map').innerHTML = '<div style="text-align:center;color:#e2444a;padding-top:60px;font-size:15px;">&#x26A0; 数据加载失败（网络或服务器异常），<a href="javascript:location.reload()" style="color:#fbbf24;">点此刷新重试</a></div>';
        return;
      }
      buildVillages();          // defer 的 village_centers.js 此时已执行，可安全构建村庄列表
      initMap();
      // 从看板点击村庄卡片跳转：自动选中目标村（一次性），不弹左上角信息窗（避免手机端拥挤）
      var target = sessionStorage.getItem('xyc_map_village');
      if (target) {
        sessionStorage.removeItem('xyc_map_village');
        setTimeout(function() {
          selectVillage(target, target, true);
        }, 800);
      } else {
        // 村级账号：自动定位到本村，巡查记录直接归本村
        var myVillage = sessionStorage.getItem('xyc_village');
        var role = sessionStorage.getItem('xyc_role') || '';
        if (myVillage && role === '村级') {
          setTimeout(function() {
            selectVillage(myVillage, myVillage, true);
          }, 800);
        }
      }
    }, { force: attempt < 3 });
  }
  startMap(3);
};

<script>
// ===== 全站 GSAP 入场动画（测试站统一注入，reduced-motion 自动跳过）=====
(function () {
  if (typeof gsap === 'undefined') return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gsap.defaults({ duration: 0.6, ease: 'power3.out' });
  // 顶栏 / 侧栏：入场滑入
  var top = document.querySelector('.topbar, #topbar, .sidebar');
  if (top) {
    var isSide = top.classList.contains('sidebar');
    gsap.from(top, { y: isSide ? 0 : -18, x: isSide ? -28 : 0, autoAlpha: 0, duration: 0.5 });
  }
  // 页头
  var head = document.querySelector('.page-head');
  if (head) gsap.from(head, { y: 22, autoAlpha: 0, duration: 0.55, delay: 0.1 });
  // 主体内容区块：渐次浮现（最多前 14 个参与，其余直接显示）
  var kids = Array.prototype.slice.call(document.querySelectorAll('.content > *, .container > *'))
    .filter(function (el) { return el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE' && el.offsetParent !== null; })
    .slice(0, 14);
  if (kids.length) gsap.from(kids, { y: 26, autoAlpha: 0, duration: 0.55, stagger: { each: 0.05 } });
  // 地图页浮层：轻微浮现
  var fl = document.querySelectorAll('#stats-panel, #legend, #village-info');
  if (fl.length) gsap.from(fl, { y: 18, autoAlpha: 0, duration: 0.5, stagger: 0.1, delay: 0.3 });
})();
</script>
