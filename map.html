<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新塬镇应急避险指挥系统</title>
<link rel="stylesheet" href="leaflet/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; background: #0a0f14; }

#map { position: fixed; inset: 0; z-index: 1; background: #1a1a2e; }

/* ===== 顶栏 ===== */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 54px;
  background: rgba(15,20,30,0.92);
  border-bottom: 1px solid rgba(239,68,68,0.15);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; color: #e2e8f0;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
#topbar .logo-area { display: flex; align-items: center; gap: 10px; }
#topbar .logo-icon {
  width: 36px; height: 36px; background: linear-gradient(135deg, #4d6bfe, #7c3aed);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 16px rgba(77,107,254,0.35);
}
#topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: 0.5px; }
#topbar .village-select {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  transition: background 0.2s; color: #94a3b8;
}
#topbar .village-select:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
#topbar .village-select .arrow { font-size: 10px; transition: transform 0.2s; }
#topbar .village-select.open .arrow { transform: rotate(180deg); }
#topbar .logout-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: #94a3b8; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  transition: all 0.2s;
}
#topbar .logout-btn:hover { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.3); }
#topbar .back-link {
  color: #94a3b8; text-decoration: none; font-size: 12px;
  display: flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 6px; transition: all 0.2s;
}
#topbar .back-link:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }

/* ===== 村庄下拉 ===== */
#village-dropdown {
  position: fixed; top: 56px; right: 16px; z-index: 1001;
  background: #1e2a3a; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; min-width: 180px; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none; max-height: 420px; overflow-y: auto;
}
#village-dropdown.show { display: block; animation: dropIn 0.2s ease; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
#village-dropdown .v-item {
  padding: 12px 16px; cursor: pointer; color: #ccc; font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background 0.15s;
}
#village-dropdown .v-item:hover { background: rgba(211,47,47,0.15); color: #fff; }
#village-dropdown .v-item.active { background: rgba(211,47,47,0.25); color: #ff6b6b; }
#village-dropdown .v-item .v-dot { width: 8px; height: 8px; border-radius: 50%; background: #d32f2f; flex-shrink: 0; }
#village-dropdown .v-item .v-count { font-size: 11px; color: #888; margin-left: auto; }

/* ===== 统计面板 ===== */
#stats-panel {
  position: fixed; top: 68px; left: 16px; z-index: 997;
  display: flex; gap: 8px; flex-wrap: wrap;
}
#stats-panel.hidden { display: none; }
#stats-panel .stat-card {
  background: rgba(26,26,46,0.9); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 10px 16px; color: #fff; font-size: 12px;
  backdrop-filter: blur(10px); min-width: 80px; text-align: center;
}
#stats-panel .stat-card .stat-num { font-size: 22px; font-weight: 700; color: #ff6b6b; }
#stats-panel .stat-card .stat-label { color: #999; margin-top: 2px; }

/* ===== 图例 ===== */
#legend {
  position: fixed; bottom: 30px; left: 16px; z-index: 996;
  background: rgba(26,26,46,0.92); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 12px 16px; color: #ccc; font-size: 12px;
  backdrop-filter: blur(10px);
  pointer-events: auto;
}
#legend .l-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#legend .l-item:last-child { margin-bottom: 0; }
#legend .l-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ===== 图层控制 ===== */
#layer-ctrl {
  position: fixed; right: 16px; bottom: 30px; z-index: 996;
  display: flex; flex-direction: column; gap: 6px;
}
#layer-ctrl button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(26,26,46,0.9); color: #ccc; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; backdrop-filter: blur(10px);
}
#layer-ctrl button:hover { background: rgba(211,47,47,0.2); border-color: #d32f2f; }
#layer-ctrl button.off { opacity: 0.35; }

/* ===== 弹窗 ===== */
.leaflet-popup-content-wrapper {
  background: rgba(26,26,46,0.95) !important;
  color: #e0e0e0 !important; border-radius: 12px !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
  backdrop-filter: blur(10px);
}
.leaflet-popup-tip { background: rgba(26,26,46,0.95) !important; }
.popup-content { min-width: 260px; max-width: 380px; font-size: 13px; line-height: 1.8; }
.popup-content .pop-title { font-size: 15px; font-weight: 700; color: #ff6b6b; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.popup-content .pop-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.popup-content .pop-label { color: #999; white-space: nowrap; }
.popup-content .pop-val { color: #e0e0e0; font-weight: 500; text-align: right; }
.popup-content .pop-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.popup-content .pop-badge.danger { background: rgba(211,47,47,0.2); color: #ff6b6b; }
.popup-content .pop-badge.warn { background: rgba(255,152,0,0.2); color: #ffb74d; }
.popup-content .pop-badge.info { background: rgba(33,150,243,0.2); color: #64b5f6; }
.popup-content .pop-desc { margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; color: #aaa; font-size: 12px; line-height: 1.7; border-left: 2px solid rgba(211,47,47,0.3); }
.popup-content .pop-nav { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
.popup-content .pn-btn {
  width: 100%; padding: 9px 0; border: none; border-radius: 8px; cursor: pointer;
  background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
  font-size: 13px; font-weight: 700; transition: all 0.2s;
  box-shadow: 0 0 14px rgba(59,130,246,0.25);
}
.popup-content .pn-btn:hover { transform: translateY(-1px); box-shadow: 0 0 22px rgba(59,130,246,0.45); }

/* ===== 状态栏 ===== */
#status {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000;
  background: rgba(0,0,0,0.8); color: #fff; padding: 6px 20px;
  border-radius: 20px; font-size: 12px; display: none; pointer-events: none;
  white-space: nowrap;
}

/* ===== 侧边信息面板 ===== */
#side-panel-toggle {
  position: fixed; top: 68px; right: 16px; z-index: 999;
  width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(26,26,46,0.92); color: #ccc; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; backdrop-filter: blur(10px);
}
#side-panel-toggle:hover { background: rgba(211,47,47,0.2); border-color: #d32f2f; color: #fff; }
#side-panel-toggle.active { background: rgba(211,47,47,0.3); color: #ff6b6b; }

#side-panel {
  position: fixed; top: 68px; left: 64px; z-index: 998;
  width: 340px; max-height: calc(100vh - 100px); overflow-y: auto;
  background: rgba(17,24,39,0.95); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; color: #94a3b8; font-size: 13px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none; transition: all 0.3s ease;
}
#side-panel.show { display: block; animation: panelSlideIn 0.3s ease; }
@keyframes panelSlideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
#side-panel::-webkit-scrollbar { width: 4px; }
#side-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

#side-panel .sp-header {
  padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center;
}
#side-panel .sp-header h3 { font-size: 16px; color: #ef4444; font-weight: 700; }
#side-panel .sp-header .sp-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
  background: rgba(239,68,68,0.15); color: #ef4444;
}
#side-panel .sp-body { padding: 14px 16px; }
#side-panel .sp-section { margin-bottom: 16px; }
#side-panel .sp-section:last-child { margin-bottom: 0; }
#side-panel .sp-section h4 {
  font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
#side-panel .sp-section h4 .sp-icon { font-size: 14px; }
#side-panel .sp-contact-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
#side-panel .sp-contact-row:last-child { border-bottom: none; }
#side-panel .sp-contact-row .sp-label { color: #64748b; font-size: 12px; min-width: 56px; }
#side-panel .sp-contact-row .sp-value { color: #e2e8f0; font-weight: 500; flex: 1; }
#side-panel .sp-contact-row .sp-phone { color: #60a5fa; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
#side-panel .sp-risk-item {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.1);
  font-size: 12px; line-height: 1.7;
}
#side-panel .sp-risk-item .sp-risk-name { color: #f87171; font-weight: 600; font-size: 13px; }
#side-panel .sp-risk-item .sp-risk-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-left: 6px;
  background: rgba(239,68,68,0.15); color: #f87171;
}
#side-panel .sp-risk-item .sp-risk-detail { color: #94a3b8; margin-top: 4px; }
#side-panel .sp-risk-item .sp-risk-contact { color: #60a5fa; font-size: 11px; }
#side-panel .sp-empty {
  text-align: center; padding: 20px; color: #555; font-size: 12px;
}
#side-panel .sp-text { color: #94a3b8; font-size: 12px; line-height: 1.6; }

/* 全镇概览特殊样式 */
#side-panel.overview .sp-header h3 { color: #f59e0b; }
#side-panel.overview .sp-header .sp-badge { background: rgba(245,158,11,0.15); color: #f59e0b; }

/* ===== 子菜单面板（村级详情） ===== */
.vp-tabs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
  padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.15);
}
.vp-tab {
  padding: 8px 4px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03); color: #94a3b8;
  font-size: 12px; cursor: pointer; text-align: center;
  transition: all 0.2s; line-height: 1.3;
}
.vp-tab .vp-tab-icon { display: block; font-size: 15px; margin-bottom: 2px; }
.vp-tab:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
.vp-tab.active {
  background: rgba(239,68,68,0.16); border-color: rgba(239,68,68,0.45);
  color: #f87171; font-weight: 600;
}
.vp-content { padding: 12px 14px; }
.vp-content::-webkit-scrollbar { width: 4px; }
.vp-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.vp-sec-title {
  font-size: 11px; color: #64748b; letter-spacing: 1px;
  margin: 4px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.vp-sec-title .sp-icon { font-size: 13px; }

/* 联系人卡片 */
.vp-person {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
}
.vp-person .vp-role {
  font-size: 11px; color: #64748b; min-width: 64px; flex-shrink: 0;
}
.vp-person .vp-name { color: #e2e8f0; font-weight: 600; flex: 1 1 auto; font-size: 13px; min-width: 0; }
.vp-person .vp-phone { color: #60a5fa; font-size: 12px; white-space: nowrap; margin-right: 6px; flex-shrink: 0; }
.vp-person .call-btn { flex-shrink: 0; margin-left: auto; }

/* 隐患点卡片 */
.vp-hazard {
  background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.12);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
}
.vp-hazard .vp-h-name { color: #f87171; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vp-hazard .vp-h-badge {
  font-size: 10px; padding: 1px 8px; border-radius: 10px;
  background: rgba(239,68,68,0.2); color: #fca5a5; font-weight: 600;
}
.vp-hazard .vp-h-scope { color: #94a3b8; font-size: 11px; margin: 4px 0 6px; }
.vp-hh {
  padding: 5px 8px; margin-bottom: 4px; border-radius: 6px;
  background: rgba(255,255,255,0.03); border-left: 2px solid rgba(239,68,68,0.3);
}
.vp-hh .vp-hh-top { display: flex; align-items: center; gap: 6px; }
.vp-hh .vp-hh-name { color: #e2e8f0; font-weight: 600; font-size: 12px; }
.vp-hh .vp-hh-count { color: #f87171; font-size: 11px; }
.vp-hh .vp-hh-list { color: #94a3b8; font-size: 11px; line-height: 1.6; margin-top: 3px; }
.vp-h-info { color: #64748b; font-size: 11px; margin-top: 5px; line-height: 1.5; }
.vp-h-info b { color: #60a5fa; font-weight: 600; }
.vp-h-info .call-btn { flex-shrink: 0; }

/* 规则列表 */
.vp-rule {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  color: #94a3b8; font-size: 12px; line-height: 1.5;
}
.vp-rule .vp-rule-ico { flex-shrink: 0; font-size: 14px; }

/* 应急电话 */
.vp-phone-item {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15);
}
.vp-phone-item .vp-phone-dep { color: #e2e8f0; font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
.vp-phone-item .vp-phone-duty { color: #64748b; font-size: 11px; flex-shrink: 0; }
.vp-phone-item .vp-phone-num { color: #60a5fa; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.vp-phone-item .call-btn { flex-shrink: 0; }

/* 拨打按钮 */
.call-btn {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; border-radius: 13px; text-decoration: none;
  background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.3);
  color: #4ade80; font-size: 11px; cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.call-btn:hover { background: rgba(34,197,94,0.28); color: #86efac; }
.call-btn.red { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.3); color: #f87171; }
.call-btn.red:hover { background: rgba(239,68,68,0.28); color: #fca5a5; }

/* 空状态 */
.vp-empty {
  text-align: center; padding: 24px 10px; color: #555; font-size: 12px;
}

/* ===== PC/手机切换按钮 ===== */
#mode-toggle {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: #94a3b8; padding: 5px 10px; border-radius: 6px; font-size: 14px; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
#mode-toggle:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
#mode-toggle.mobile-active { background: rgba(59,130,246,0.15); color: #60a5fa; border-color: rgba(59,130,246,0.3); }

/* ===== 巡查记录模块 ===== */
.patrol-form { padding: 2px 0; }
.patrol-form .pf-row { margin-bottom: 12px; }
.patrol-form .pf-label {
  font-size: 11px; color: #64748b; margin-bottom: 5px; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.patrol-form .pf-input {
  width: 100%; padding: 9px 11px; border-radius: 8px; font-size: 13px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: #e2e8f0; outline: none; font-family: inherit; transition: border-color 0.2s;
}
.patrol-form .pf-input:focus { border-color: #3b82f6; }
.patrol-form textarea.pf-input { min-height: 80px; resize: vertical; }
.patrol-form .pf-auto {
  padding: 9px 11px; border-radius: 8px; font-size: 12px;
  background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15);
  color: #60a5fa; line-height: 1.5;
}
.patrol-form .pf-auto .pf-auto-label { font-size: 10px; color: #64748b; }
.patrol-form .pf-photo-preview {
  width: 100%; max-height: 160px; border-radius: 8px; object-fit: cover;
  margin-top: 8px; display: none; border: 1px solid rgba(255,255,255,0.1);
}
.patrol-form .pf-photo-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25);
  color: #60a5fa; transition: all 0.2s;
}
.patrol-form .pf-photo-btn:hover { background: rgba(59,130,246,0.2); }
.patrol-form .pf-submit {
  width: 100%; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; color: #fff; transition: all 0.2s;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  box-shadow: 0 0 16px rgba(59,130,246,0.25);
}
.patrol-form .pf-submit:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(59,130,246,0.4); }
.patrol-form .pf-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.patrol-form .pf-export {
  width: 100%; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid rgba(34,197,94,0.3); color: #4ade80;
  background: rgba(34,197,94,0.08); margin-top: 8px; transition: all 0.2s;
}
.patrol-form .pf-export:hover { background: rgba(34,197,94,0.18); }
.patrol-form .pf-msg {
  text-align: center; font-size: 12px; margin-top: 8px; min-height: 18px; transition: all 0.3s;
}
.patrol-form .pf-msg.success { color: #4ade80; }
.patrol-form .pf-msg.error { color: #f87171; }

/* 巡查记录列表 */
.patrol-list { margin-top: 14px; }
.patrol-list .pl-title {
  font-size: 11px; color: #64748b; letter-spacing: 1px; font-weight: 600;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.patrol-list .pl-item {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  font-size: 12px; line-height: 1.6;

<script>
// ========== 权限验证 ==========
if (sessionStorage.getItem('xyc_auth') !== '1') {
  window.location.replace('index.html');
}

// ========== 村庄配置 ==========
// SHP数据中的村名映射（SHP名 → 完整名）
var SHP_VILLAGE_MAP = {
  '常坪村': '常家坪村',
  '河坝村': '杨家河坝村'
};

// 完整名 → SHP名
var REVERSE_SHP_MAP = {
  '常家坪村': '常坪村',
  '杨家河坝村': '河坝村'
};

// 从 village_centers.js 动态构建村庄列表
var VILLAGE_ORDER = ['上塬村', '东塬村', '刘家湾社区', '孟塬村', '常家坪村', '新塬村', '杨坪村', '杨家河坝村', '甘岔村', '老庄村'];
var VILLAGES = [{ id: 'all', name: '全部村庄', center: [36.15, 105.38], zoom: 13 }];

VILLAGE_ORDER.forEach(function(vname) {
  var shpName = REVERSE_SHP_MAP[vname] || vname;
  var center = VILLAGE_CENTERS[shpName];
  if (center) {
    VILLAGES.push({ id: vname, name: vname, center: [center.lat, center.lng], zoom: 16 });
  }
});

// ========== 全局变量 ==========
var map = null;
var layers = {};
var layerVisible = { hazards: true, routes: true, sites: true, threatened: true, majorRoads: true, placeNames: true };
var currentVillageId = 'all';
var MAP_BOUNDS = [[35.5, 104.5], [37.0, 106.8]];

// ========== 工具函数 ==========
// 各村切坡建房户数 / 隐患点数量（来源：《新塬镇一页纸数据》Excel，非矢量点位）
function getVillagePlanStats(vname) {
  var stats = { hazards: 0, households: 0, people: 0 };
  if (typeof VILLAGE_PLANS === 'undefined' || !VILLAGE_PLANS[vname]) return stats;
  var hazards = VILLAGE_PLANS[vname].hazards || [];
  stats.hazards = hazards.length;
  hazards.forEach(function(h) {
    var m = (h.scope || '').match(/(\d+)\s*户\s*(\d+)\s*人/);
    if (m) {
      stats.households += parseInt(m[1], 10);
      stats.people += parseInt(m[2], 10);
    }
  });
  return stats;
}

function showStatus(msg) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 3000);
}

// ========== WGS84 → GCJ-02 ==========
var PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
function isOutOfChina(lng, lat) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function transformLat(x, y) {
  var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320.0 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lng, lat) {
  if (isOutOfChina(lng, lat)) return [lng, lat];
  var dLat = transformLat(lng - 105.0, lat - 35.0);
  var dLng = transformLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * PI;
  var magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}
function convertCoords(obj) {
  if (obj === null || obj === undefined) return obj;
  if (Array.isArray(obj) && obj.length === 2 && typeof obj[0] === 'number' && typeof obj[1] === 'number') {
    return wgs84ToGcj02(obj[0], obj[1]);
  }
  if (Array.isArray(obj)) return obj.map(convertCoords);
  return obj;
}
function convertGeoJSON(geojson) {
  return JSON.parse(JSON.stringify(geojson), function(key, value) {
    if (key === 'coordinates') return convertCoords(value);
    return value;
  });
}

// SHP村名 → 完整村名
function shpToFullName(shpName) {
  return SHP_VILLAGE_MAP[shpName] || shpName;
}

// 完整村名 → SHP村名
function fullToShpName(fullName) {
  return REVERSE_SHP_MAP[fullName] || fullName;
}

// ========== 初始化地图 ==========
function initMap() {
  showStatus('正在加载地图...');

  map = L.map('map', {
    center: VILLAGES[0].center,
    zoom: 13,
    minZoom: 10,
    maxBounds: MAP_BOUNDS,
    maxBoundsViscosity: 0.8,
    zoomControl: false,
    attributionControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 高德卫星图
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3
  }).addTo(map);

  // 高德路网标注
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3, opacity: 0.6
  }).addTo(map);

  // 初始化图层组
  layers.hazards = L.layerGroup().addTo(map);
  layers.routes = L.layerGroup().addTo(map);
  layers.sites = L.layerGroup().addTo(map);
  layers.backups = L.layerGroup().addTo(map);
  layers.stations = L.layerGroup().addTo(map);
  layers.rivers = L.layerGroup().addTo(map);
  layers.roads = L.layerGroup().addTo(map);
  layers.threatened = L.layerGroup().addTo(map);
  layers.majorRoads = L.layerGroup().addTo(map);
  layers.placeNames = L.layerGroup().addTo(map);

  // 加载数据
  loadHazardPoints();
  loadHazardAreas();
  loadEvacuationRoutes();
  loadEvacuationSites();
  loadBackupSites();
  loadRainStations();
  loadThreatenedAreas();
  loadLargeLayers();

  // 构建村庄下拉
  buildVillageDropdown();
  updateStats();

  showStatus('地图加载完成');
}

// ========== 加载数据图层 ==========
function loadHazardPoints() {
  if (typeof DATA_HAZARD_POINTS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_POINTS);
  var geojson = L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      var p = feature.properties;
      var risk = p.risk_level || '';
      var radius = 7;
      var fillColor = '#ff4444';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) {
        radius = 9; fillColor = '#d32f2f';
      } else if (risk.indexOf('一般') >= 0) {
        radius = 6; fillColor = '#ff7043';
      }
      return L.circleMarker(latlng, {
        radius: radius, fillColor: fillColor, color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var risk = p.risk_level || '';

      // 风险等级徽章
      var badgeClass = 'info';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) badgeClass = 'danger';
      else if (risk.indexOf('一般') >= 0) badgeClass = 'warn';

      var html = '<div class="popup-content">';
      html += '<div class="pop-title">' + (p.HZXM || '隐患点') + ' 的家</div>';

      // 户主信息
      if (p.HZXM) html += '<div class="pop-row"><span class="pop-label">户主</span><span class="pop-val">' + p.HZXM + '</span></div>';
      if (p.phone) html += '<div class="pop-row"><span class="pop-label">电话</span><span class="pop-val">' + p.phone + '</span></div>';

      // 村组
      var cz = shpToFullName(p.CZ) || p.CZ;
      if (cz) html += '<div class="pop-row"><span class="pop-label">所属村组</span><span class="pop-val">' + cz + '</span></div>';

      // 风险等级
      if (risk) html += '<div class="pop-row"><span class="pop-label">风险等级</span><span class="pop-val"><span class="pop-badge ' + badgeClass + '">' + risk + '</span></span></div>';

      // 责任人
      if (p.resp_person) html += '<div class="pop-row"><span class="pop-label">避险责任人</span><span class="pop-val">' + p.resp_person + '</span></div>';
      if (p.resp_phone) html += '<div class="pop-row"><span class="pop-label">责任人电话</span><span class="pop-val">' + p.resp_phone + '</span></div>';

      // 避险点
      if (p.evac_site) html += '<div class="pop-row"><span class="pop-label">避险点</span><span class="pop-val">' + p.evac_site + '</span></div>';

      // 隐患详情（YHXX原始文本）
      if (p.YHXX) {
        var desc = p.YHXX.replace(/\n/g, '<br>');
        html += '<div class="pop-desc">' + desc + '</div>';
      }

      // 导航前往按钮（手机唤起高德App，PC显示驾车路线）
      // 注意：onEachFeature 回调没有 latlng 参数，需用 layer.getLatLng() 获取点坐标
      var ll = layer.getLatLng ? layer.getLatLng() : null;
      if (ll) {
        html += '<div class="pop-nav"><button class="pn-btn" onclick="navigateTo(' +
          ll.lng + ',' + ll.lat + ',\'' + escAttr(p.HZXM || '隐患点') + '\')">&#x1F9ED; 导航前往</button></div>';
      }

      html += '</div>';
      layer.bindPopup(html, { maxWidth: 400, className: 'custom-popup' });
    }
  });
  layers.hazards.addLayer(geojson);
}

function loadHazardAreas() {
  if (typeof DATA_HAZARD_AREAS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_AREAS);
  L.geoJSON(data, {
    style: { color: '#ff4444', fillColor: '#ff4444', fillOpacity: 0.12, weight: 2 },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.YCMC || p.XZQMC || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'hazard-tooltip' });
    }
  }).addTo(layers.hazards);
}

function loadEvacuationRoutes() {
  if (typeof DATA_EVACUATION_ROUTES === 'undefined') return;
  var data = convertGeoJSON(DATA_EVACUATION_ROUTES);
  L.geoJSON(data, {
    style: function(feature) {
      return { color: '#2196f3', weight: 4, opacity: 0.75, dashArray: '8, 6' };
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.ROAD_NAME || p.NAME || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'route-tooltip' });
    }
  }).addTo(layers.routes);
}

function loadEvacuationSites() {
  if (typeof DATA_EVACUATION_SITES === 'undefined') return;
  var data = convertGeoJSON(DATA_EVACUATION_SITES);
  L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 8, fillColor: '#4caf50', color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {

function loadThreatenedAreas() {

function loadLargeLayers() {

      eval(js);

        var data = convertGeoJSON(DATA_ROADS_SIMPLE);
        L.geoJSON(data, {
          style: { color: '#9e9e9e', weight: 1.5, opacity: 0.45 }
        }).addTo(layers.roads);
      }
    })
    .catch(function() { console.log('道路数据加载失败'); });

  // 主要道路（省道县道）
  fetch('js_data/major_roads.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {

      if (typeof DATA_MAJOR_ROADS !== 'undefined') {
        var data = convertGeoJSON(DATA_MAJOR_ROADS);

  // 地名标注
  fetch('js_data/place_names.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {
      eval(js);
      if (typeof DATA_PLACE_NAMES !== 'undefined') {
        var data = convertGeoJSON(DATA_PLACE_NAMES);
        // 只加载新塬镇范围内的地名（约36.0-36.3, 105.2-105.5）
        var filtered = { type: 'FeatureCollection', features: data.features.filter(function(f) {
          var c = f.geometry.coordinates;
          return c[0] > 105.2 && c[0] < 105.5 && c[1] > 35.95 && c[1] < 36.35;
        })};
        L.geoJSON(filtered, {
          pointToLayer: function(feature, latlng) {

                iconSize: [0, 0], iconAnchor: [0, 0]

    .catch(function() { console.log('地名数据加载失败'); });
}

function buildVillageDropdown() {
  var dropdown = document.getElementById('village-dropdown');
  VILLAGES.forEach(function(v) {

      var total = 0;
      VILLAGE_ORDER.forEach(function(vname) { total += getVillagePlanStats(vname).hazards; });

      return;
    }
    var stats = getVillagePlanStats(v.id);

    div.className = 'v-item';
    div.setAttribute('data-vid', v.id);
    div.innerHTML = '<span class="v-dot"></span>' + v.name + '<span class="v-count">' + (stats.hazards > 0 ? stats.hazards + '处' : '') + '</span>';
    div.onclick = function() { selectVillage(v.id, v.name); };

  var dd = document.getElementById('village-dropdown');
  var sel = document.getElementById('villageSelect');
  dd.classList.toggle('show');
  sel.classList.toggle('open');
}

function selectVillage(id, name) {
  currentVillageId = id;
  document.getElementById('currentVillage').textContent = name;
  document.getElementById('village-dropdown').classList.remove('show');
  document.getElementById('villageSelect').classList.remove('open');

  // 更新下拉高亮
  document.querySelectorAll('#village-dropdown .v-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-vid') === id) el.classList.add('active');
  });

  var v = VILLAGES.find(function(v) { return v.id === id; });
  if (v) {
    map.flyTo(v.center, v.zoom, { duration: 1 });
  }

  // 面板互斥逻辑：全部村庄→统计卡片；具体村庄→侧边详情面板
  if (id === 'all') {
    document.getElementById('side-panel').classList.remove('show');
    document.getElementById('side-panel-toggle').classList.remove('active');
    sidePanelOpen = false;
    document.getElementById('stats-panel').classList.remove('hidden');

    document.getElementById('side-panel').classList.add('show');
    document.getElementById('side-panel-toggle').classList.add('active');
    sidePanelOpen = true;
    document.getElementById('stats-panel').classList.add('hidden');
    showSidePanelVillage(id);
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 从文本提取电话号码
function extractPhone(str) {
  if (!str) return '';
  var m = str.match(/\d{11}|(?:\d{3,4})-?\d{7,8}/);
  return m ? m[0] : '';
}

// 从"职位姓名电话"文本中去掉电话号码，只留姓名/职位（避免与电话号码重复显示导致一行过长）
function cleanContactName(str) {
  if (!str) return '';
  return String(str)
    .replace(/\d{11}|(?:\d{3,4})-?\d{7,8}/g, '')
    .replace(/[：:]\s*/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function toggleLayer(name) {
  layerVisible[name] = !layerVisible[name];

  if (visible) {

// ========== 定位 ==========
function locateMe() {
  if (!navigator.geolocation) { showStatus('浏览器不支持定位'); return; }
  showStatus('正在获取位置...');
  navigator.geolocation.getCurrentPosition(function(pos) {
    // 浏览器返回的是 WGS84 坐标，需转换为 GCJ02 才能与地图底图（高德）对齐
    var gcj = wgs84ToGcj02(pos.coords.longitude, pos.coords.latitude);
    map.setView([gcj[1], gcj[0]], 16);
    L.circleMarker([gcj[1], gcj[0]], {
      radius: 8, fillColor: '#1976d2', color: '#fff', weight: 3, fillOpacity: 1
    }).addTo(map).bindPopup('我的位置').openPopup();
    showStatus('已定位');
  }, function() { showStatus('无法获取位置'); }, { enableHighAccuracy: true, timeout: 10000 });
}

// ========== 导航功能 ==========
var routeLayer = null;
var routeMarker = null;

// 判断是否移动设备
function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
}

// 导航前往：手机唤起高德App导航，PC端在地图上显示驾车路线
function navigateTo(lng, lat, name) {
  if (isMobileDevice()) {
    // 手机端：唤起高德地图App（未安装则打开网页版导航）
    var url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car&src=xinyuan';
    window.open(url, '_blank');
    return;
  }
  // PC端：先获取当前位置作为起点，再规划驾车路线
  if (!navigator.geolocation) { alert('浏览器不支持定位，无法规划路线'); return; }
  showRouteInfo('正在获取当前位置...');
  navigator.geolocation.getCurrentPosition(function(pos) {
    var gcj = wgs84ToGcj02(pos.coords.longitude, pos.coords.latitude);
    planRoute(gcj[0], gcj[1], lng, lat, name);
  }, function() {
    hideRouteInfo();
    alert('无法获取当前位置，请先在浏览器中允许定位，或直接用手机导航');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

// PC端：调用高德Web服务API规划驾车路线（JSONP方式，不受跨域限制）
function planRoute(slng, slat, elng, elat, name) {
  clearRoute();
  if (typeof AMAP_KEY === 'undefined' || !AMAP_KEY) {
    hideRouteInfo();
    alert('未配置高德API Key，无法规划路线');
    return;
  }
  showRouteInfo('正在规划驾车路线...');
  var url = 'https://restapi.amap.com/v3/direction/driving?origin=' + slng + ',' + slat +
    '&destination=' + elng + ',' + elat + '&extensions=all&key=' + AMAP_KEY + '&callback=__amapRouteCb';
  window.__amapRouteCb = function(data) {
    var s = document.querySelector('script[data-navroute="1"]');
    if (s) s.parentNode.removeChild(s);
    if (!data || data.status !== '1' || !data.route || !data.route.paths || data.route.paths.length === 0) {
      hideRouteInfo();
      alert('未找到可行路线：' + ((data && data.info) || '未知原因'));
      return;
    }
    var path = data.route.paths[0];
    var points = [];
    (path.steps || []).forEach(function(st) {
      if (!st.polyline) return;
      st.polyline.split(';').forEach(function(pt) {
        var xy = pt.split(',');
        if (xy.length >= 2) points.push([parseFloat(xy[1]), parseFloat(xy[0])]);
      });
    });
    if (points.length === 0) { hideRouteInfo(); alert('路线解析失败，请重试'); return; }
    routeLayer = L.polyline(points, { color: '#3b82f6', weight: 5, opacity: 0.9, dashArray: '10, 8' }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });
    routeMarker = L.circleMarker([elat, elng], { radius: 8, fillColor: '#ef4444', color: '#fff', weight: 2, fillOpacity: 0.9 })
      .addTo(map).bindPopup('<b>' + name + '</b>（终点）');
    var distKm = (path.distance / 1000).toFixed(1);
    var mins = Math.round(path.duration / 60);
    showRouteInfo('&#x1F6E3; 驾车约 <b>' + distKm + ' 公里</b> · 预计 <b>' + mins + ' 分钟</b>');
  };
  var script = document.createElement('script');
  script.setAttribute('data-navroute', '1');
  script.src = url;
  script.onerror = function() { hideRouteInfo(); alert('路线规划服务暂不可用，请重试'); };
  document.body.appendChild(script);
}

// 清除路线
function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (routeMarker) { map.removeLayer(routeMarker); routeMarker = null; }
  hideRouteInfo();
}

// 显示/隐藏路线信息条
function showRouteInfo(text) {
  var el = document.getElementById('route-info');
  var txt = document.getElementById('route-info-text');
  if (!el || !txt) return;
  txt.innerHTML = text;
  el.style.display = 'flex';
}
function hideRouteInfo() {
  var el = document.getElementById('route-info');
  if (el) el.style.display = 'none';
}

// ========== 巡查记录模块 ==========
var PATROL_STORAGE_KEY = 'xyc_patrol_records';

// ===== 巡查记录：飞书云端为主，localStorage 为缓存备份 =====

// 本地缓存读取
function getLocalPatrolRecords(vname) {
  try {
    var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
    return all.filter(function(r) { return r.village === vname; });
  } catch(e) { return []; }
}

// 本地缓存写入
function saveLocalPatrolRecord(record) {
  try {
    var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
    all.unshift(record);
    // 本地最多保留 200 条，防止照片撑爆 localStorage
    while (all.length > 200) all.pop();
    localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(all));
    return true;
  } catch(e) { return false; }
}

function deleteLocalPatrolRecord(id, vname) {
  try {
    var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
    all = all.filter(function(r) { return !(r.id === id && r.village === vname); });
    localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(all));
    return true;
  } catch(e) { return false; }
}

// 从飞书拉取某村巡查记录（异步），成功则更新本地缓存并回调
function getPatrolRecords(vname, callback) {
  var filter = JSON.stringify({
    logic: 'and',
    conditions: [['村名', '==', vname]]
  });
  var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
    '/tables/' + FEISHU_CONFIG.tables.patrol +
    '/records?page_size=200&filter=' + encodeURIComponent(filter);
  feishuRequest('GET', path, null, function(data, err) {
    if (err || !data || data.code !== 0) {
      // 云端不可用时回退本地缓存
      if (callback) callback(getLocalPatrolRecords(vname));
      return;
    }
    // 飞书返回列数组格式，转换为对象数组
    var records = feishuRowsToObjects(data).map(function(it) {
      var f = it.fields || {};
      var lng = f['经度'], lat = f['纬度'];
      var loc = null;
      if (lng != null && lat != null) loc = { lng: Number(lng), lat: Number(lat) };
      return {
        record_id: it.record_id || '',
        id: it.record_id || (vname + '-' + (f['巡查时间'] || '')),
        village: vname,
        inspector: f['巡查人'] || '',
        location: loc,
        locationText: loc ? '经度' + loc.lng.toFixed(6) + ' 纬度' + loc.lat.toFixed(6) : '',
        weather: f['天气'] || '',
        photo: f['照片base64'] || '',
        description: f['巡查描述'] || '',
        time: f['巡查时间'] || ''
      };
    });
    // 同步本地缓存：云端记录 + 本地尚未出现在云端的记录（应对飞书同步延迟）
    try {
      var all = JSON.parse(localStorage.getItem(PATROL_STORAGE_KEY) || '[]');
      var others = all.filter(function(r) { return r.village !== vname; });
      var cloudIds = {};
      records.forEach(function(r) { if (r.record_id) cloudIds[r.record_id] = true; });
      var merged = records.concat(all.filter(function(r) {
        return r.village === vname && (!r.record_id || !cloudIds[r.record_id]);
      }));
      // 去重（按 id）
      var seen = {};
      merged = merged.filter(function(r) {
        var k = r.id || r.record_id;
        if (!k || seen[k]) return false;
        seen[k] = true;
        return true;
      });
      while (merged.length > 200) merged.pop();
      localStorage.setItem(PATROL_STORAGE_KEY, JSON.stringify(others.concat(merged)));
      // 回调返回云端记录 + 本地待同步记录（应对飞书同步延迟，保证新记录立即显示）
      if (callback) callback(merged);
      return;
    } catch(e) {}
    if (callback) callback(records);
  });
}

// 保存巡查记录：写入飞书（异步），同时写本地缓存
function savePatrolRecord(record, callback) {
  var fields = {
    '村名': record.village,
    '巡查人': record.inspector || '',
    '巡查描述': record.description || '',
    '天气': record.weather || '',
    '巡查时间': record.time || ''
  };
  if (record.location) {
    fields['经度'] = record.location.lng;
    fields['纬度'] = record.location.lat;
  }
  // 照片 base64 较大，飞书文本字段有长度限制，超长则仅存本地
  if (record.photo && record.photo.length < 120000) {
    fields['照片base64'] = record.photo;
  }
  var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
    '/tables/' + FEISHU_CONFIG.tables.patrol + '/records';
  feishuRequest('POST', path, fields, function(data, err) {
    if (err || !data || data.code !== 0) {
      // 云端失败仍保存本地
      saveLocalPatrolRecord(record);
      if (callback) callback(false, err || (data && data.msg));
      return;
    }
    // 记录云端返回的 record_id，保证删除时能同步删除云端
    var rid = (data.data && data.data.record_id_list && data.data.record_id_list[0]) || '';
    if (rid) { record.record_id = rid; record.id = rid; }
    saveLocalPatrolRecord(record);
    if (callback) callback(true);
  });
}

// 删除巡查记录：删除飞书记录（异步），同时删本地
function deletePatrolRecord(id, vname, callback) {
  deleteLocalPatrolRecord(id, vname);
  // 若为飞书记录，调删除接口
  var rid = (typeof id === 'string' && id.indexOf('rec') === 0) ? id : '';
  if (rid) {
    var path = '/open-apis/base/v3/bases/' + FEISHU_CONFIG.baseToken +
      '/tables/' + FEISHU_CONFIG.tables.patrol + '/records/' + encodeURIComponent(rid);
    feishuRequest('DELETE', path, null, function() {
      if (callback) callback();
    });
  } else {
    if (callback) callback();
  }
}

// 照片压缩
function compressPhoto(file, callback) {
  if (!file) { callback(''); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 800;
      var scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.55));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

    '&current=temperature_2m,weathercode,wind_speed_10m&timezone=Asia%2FShanghai';
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.current) {
        weatherCache = data.current;
        // 更新页面上已渲染的天气显示
        var el = document.getElementById('patrol-weather-' + escAttr(currentPatrolVid));
        if (el) el.textContent = getWeatherText();

    .catch(function() {});
}

// 获取巡查位置
function getPatrolLocation() {
  if (!navigator.geolocation) {
    showPfMsg('浏览器不支持定位功能', 'error');
    return;
  }
  var el = document.getElementById('pf-location');
  if (el) el.textContent = '正在获取位置...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    // WGS84 → GCJ02 转换，保证记录点与地图对齐
    var gcj = wgs84ToGcj02(pos.coords.longitude, pos.coords.latitude);
    currentPatrolLocation = { lat: gcj[1], lng: gcj[0] };
    if (el) el.textContent = '经度：' + gcj[0].toFixed(6) + '，纬度：' + gcj[1].toFixed(6);
    // 获取天气（用原始 WGS84 坐标查询即可，天气 API 不要求 GCJ02）
    fetchPatrolWeather(pos.coords.latitude, pos.coords.longitude);
  }, function(err) {
    if (el) el.textContent = '获取位置失败，请重试';
    showPfMsg('获取位置失败，请检查GPS权限', 'error');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function onPatrolPhotoSelect(input) {
  var file = input.files[0];
  if (!file) return;

      preview.style.display = 'block';

    showPfMsg('照片已压缩（约' + Math.round(dataUrl.length / 1024) + 'KB）', 'success');
  });
}

// 提交巡查记录
function submitPatrol(vid) {
  var inspector = document.getElementById('pf-inspector');
  var desc = document.getElementById('pf-desc');
  var inspectorVal = inspector ? inspector.value.trim() : '';
  var descVal = desc ? desc.value.trim() : '';

  if (!inspectorVal) { showPfMsg('请填写巡查人姓名', 'error'); return; }
  if (!currentPatrolLocation) { showPfMsg('请先获取巡查点位', 'error'); return; }

  var btn = document.querySelector('.pf-submit');
  if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }

  var now = new Date();
  var timeStr = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');

  var record = {
    id: now.getTime(),
    village: vid,
    inspector: inspectorVal,
    location: currentPatrolLocation,
    locationText: '经度' + currentPatrolLocation.lng.toFixed(6) + ' 纬度' + currentPatrolLocation.lat.toFixed(6),
    weather: getWeatherText(),
    photo: patrolPhotoData,
    description: descVal,
    time: timeStr
  };

  savePatrolRecord(record, function(ok, err) {
    if (ok) {
      localStorage.setItem('xyc_last_inspector', inspectorVal);
      showPfMsg('巡查记录已同步保存！', 'success');
      // 清空表单
      patrolPhotoData = '';
      currentPatrolLocation = null;
      var preview = document.getElementById('pf-photo-preview');
      if (preview) { preview.src = ''; preview.style.display = 'none'; }
      var photoInput = document.getElementById('pf-photo-input');
      if (photoInput) photoInput.value = '';
      if (desc) desc.value = '';
      var locEl = document.getElementById('pf-location');
      if (locEl) locEl.textContent = '点击获取GPS位置...';
      // 刷新列表
      refreshPatrolList(vid);
    } else {
      showPfMsg('云端保存失败，已存入本机（' + (err || '未知原因') + '）', 'error');
      refreshPatrolList(vid);
    }
    if (btn) { btn.disabled = false; btn.textContent = '✅ 提交巡查记录'; }
  });
}

// 删除巡查记录
function delPatrol(id, vid) {
  if (!confirm('确定删除这条巡查记录吗？')) return;
  deletePatrolRecord(id, vid, function() {
    refreshPatrolList(vid);
  });
}

// 刷新巡查记录列表（云端优先）
function refreshPatrolList(vid) {
  getPatrolRecords(vid, function(records) {
    var listEl = document.querySelector('.patrol-list');
    if (!listEl) return;
    var h = '<div class="pl-title">&#x1F4CB; 历史巡查记录（' + records.length + '条）</div>';
    if (records.length === 0) {
      h += '<div class="pl-empty">暂无巡查记录</div>';
    } else {
      records.forEach(function(r) {
        h += '<div class="pl-item">';
        h += '<button class="pl-del" onclick="event.stopPropagation();delPatrol(\'' + escAttr(r.id) + '\',\'' + escAttr(vid) + '\')">&#x2716;</button>';
        h += '<div class="pl-time">' + esc(r.time) + '</div>';
        h += '<div class="pl-inspector">&#x1F464; ' + esc(r.inspector || '未知') + ' <span style="color:#94a3b8;font-weight:400;">' + esc(r.weather || '') + '</span></div>';
        h += '<div class="pl-loc">&#x1F4CD; ' + esc(r.locationText || '') + '</div>';
        if (r.description) h += '<div class="pl-desc">' + esc(r.description) + '</div>';
        if (r.photo) h += '<img class="pl-photo" src="' + r.photo + '" onclick="event.stopPropagation();previewPhoto(\'' + escAttr(r.photo) + '\')" alt="巡查照片">';
        h += '</div>';
      });
    }
    listEl.innerHTML = h;
  });
}

// 照片预览
function previewPhoto(dataUrl) {
  var overlay = document.getElementById('photoOverlay');
  var img = document.getElementById('photoPreviewImg');
  if (overlay && img) {
    img.src = dataUrl;
    overlay.classList.add('show');
  }
}

function closePhotoPreview() {
  var overlay = document.getElementById('photoOverlay');
  if (overlay) overlay.classList.remove('show');
}

// 提示消息
function showPfMsg(msg, type) {
  var el = document.getElementById('pf-msg');
  if (el) {
    el.textContent = msg;
    el.className = 'pf-msg ' + (type || '');
    if (type === 'success') {
      setTimeout(function() { el.textContent = ''; el.className = 'pf-msg'; }, 3000);
    }
  }
}

// 导出CSV（从云端加载后导出）
function exportPatrolCSV(vid) {
  getPatrolRecords(vid, function(records) {
    if (records.length === 0) {
      alert('该村暂无巡查记录可导出');
      return;
    }
    var BOM = '\uFEFF';
    var header = '序号,村名,巡查人,巡查点位（经度）,巡查点位（纬度）,天气情况,巡查情况描述,巡查时间\n';
    var rows = '';
    records.forEach(function(r, i) {
      var desc = (r.description || '').replace(/"/g, '""');
      rows += (i + 1) + ',' + r.village + ',' + (r.inspector || '') + ',' +
        (r.location ? r.location.lng.toFixed(6) : '') + ',' +
        (r.location ? r.location.lat.toFixed(6) : '') + ',' +
        (r.weather || '').replace(/,/g, ' ') + ',"' + desc + '",' + r.time + '\n';
    });
    var csv = BOM + header + rows;
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = vid + '_巡查记录_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

// ========== 关闭下拉（点击外部） ==========
document.addEventListener('click', function(e) {
  var dd = document.getElementById('village-dropdown');
  var sel = document.getElementById('villageSelect');
  if (!sel.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('show');
    sel.classList.remove('open');
  }
});

// ========== 启动 ==========
window.onload = function() {
  initMode();
  initMap();
  // 如果从仪表盘跳转过来，自动选中村庄
  var preVillage = sessionStorage.getItem('xyc_village');
  if (preVillage) {
    sessionStorage.removeItem('xyc_village');
    setTimeout(function() {
      selectVillage(preVillage, preVillage);
    }, 800);
  }
};
</script>
