<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新塬镇应急避险指挥系统</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; background: #0a0f14; }

#map { position: fixed; inset: 0; z-index: 1; background: #1a1a2e; }

/* ===== 顶栏 ===== */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 54px;
  background: rgba(15,20,30,0.92);
  border-bottom: 1px solid rgba(239,68,68,0.15);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; color: #e2e8f0;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
#topbar .logo-area { display: flex; align-items: center; gap: 10px; }
#topbar .logo-icon {
  width: 36px; height: 36px; background: linear-gradient(135deg, #ef4444, #dc2626);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 16px rgba(239,68,68,0.3);
}
#topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: 0.5px; }
#topbar .village-select {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  transition: background 0.2s; color: #94a3b8;
}
#topbar .village-select:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
#topbar .village-select .arrow { font-size: 10px; transition: transform 0.2s; }
#topbar .village-select.open .arrow { transform: rotate(180deg); }
#topbar .logout-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: #94a3b8; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
  transition: all 0.2s;
}
#topbar .logout-btn:hover { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.3); }
#topbar .back-link {
  color: #94a3b8; text-decoration: none; font-size: 12px;
  display: flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 6px; transition: all 0.2s;
}
#topbar .back-link:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }

/* ===== 村庄下拉 ===== */
#village-dropdown {
  position: fixed; top: 56px; right: 16px; z-index: 1001;
  background: #1e2a3a; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; min-width: 180px; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none; max-height: 420px; overflow-y: auto;
}
#village-dropdown.show { display: block; animation: dropIn 0.2s ease; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
#village-dropdown .v-item {
  padding: 12px 16px; cursor: pointer; color: #ccc; font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background 0.15s;
}
#village-dropdown .v-item:hover { background: rgba(211,47,47,0.15); color: #fff; }
#village-dropdown .v-item.active { background: rgba(211,47,47,0.25); color: #ff6b6b; }
#village-dropdown .v-item .v-dot { width: 8px; height: 8px; border-radius: 50%; background: #d32f2f; flex-shrink: 0; }
#village-dropdown .v-item .v-count { font-size: 11px; color: #888; margin-left: auto; }

/* ===== 村庄信息侧边栏 ===== */
#village-info {
  position: fixed; top: 62px; left: 16px; z-index: 998;
  width: 300px; max-height: calc(100vh - 140px); overflow-y: auto;
  background: rgba(17,24,39,0.95); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 0; color: #94a3b8; font-size: 13px;
  backdrop-filter: blur(16px); display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  -webkit-backdrop-filter: blur(16px);
}
#village-info::-webkit-scrollbar { width: 4px; }
#village-info::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
#village-info.show { display: block; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
#village-info .vi-header {
  padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center;
}
#village-info .vi-header h3 { font-size: 16px; color: #ef4444; font-weight: 700; }
#village-info .vi-close {
  background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer;
  width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
}
#village-info .vi-close:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }
#village-info .vi-body { padding: 14px 16px; }
#village-info .vi-section { margin-bottom: 14px; }
#village-info .vi-section:last-child { margin-bottom: 0; }
#village-info .vi-section h4 {
  font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 6px; font-weight: 600;
}
#village-info .vi-contact {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
#village-info .vi-contact .vi-label { color: #64748b; font-size: 12px; min-width: 60px; }
#village-info .vi-contact .vi-value { color: #e2e8f0; font-weight: 500; }
#village-info .vi-contact .vi-phone { color: #60a5fa; margin-left: auto; font-size: 12px; }
#village-info .vi-text { color: #94a3b8; font-size: 12px; line-height: 1.6; }
#village-info .vi-hh-list { max-height: 200px; overflow-y: auto; }
#village-info .vi-hh-item {
  display: flex; justify-content: space-between; padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 12px;
}
#village-info .vi-hh-item .vi-hh-name { color: #e2e8f0; }
#village-info .vi-hh-item .vi-hh-count { color: #ef4444; }
#village-info .vi-hh-item .vi-hh-shelter { color: #22c55e; font-size: 11px; }

/* ===== 统计面板 ===== */
#stats-panel {
  position: fixed; top: 68px; left: 16px; z-index: 997;
  display: flex; gap: 8px; flex-wrap: wrap;
}
#stats-panel.hidden { display: none; }
#stats-panel .stat-card {
  background: rgba(26,26,46,0.9); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 10px 16px; color: #fff; font-size: 12px;
  backdrop-filter: blur(10px); min-width: 80px; text-align: center;
}
#stats-panel .stat-card .stat-num { font-size: 22px; font-weight: 700; color: #ff6b6b; }
#stats-panel .stat-card .stat-label { color: #999; margin-top: 2px; }

/* ===== 图例 ===== */
#legend {
  position: fixed; bottom: 30px; left: 16px; z-index: 999;
  background: rgba(26,26,46,0.92); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 12px 16px; color: #ccc; font-size: 12px;
  backdrop-filter: blur(10px);
}
#legend .l-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#legend .l-item:last-child { margin-bottom: 0; }
#legend .l-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ===== 图层控制 ===== */
#layer-ctrl {
  position: fixed; right: 16px; bottom: 30px; z-index: 999;
  display: flex; flex-direction: column; gap: 6px;
}
#layer-ctrl button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(26,26,46,0.9); color: #ccc; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; backdrop-filter: blur(10px);
}
#layer-ctrl button:hover { background: rgba(211,47,47,0.2); border-color: #d32f2f; }
#layer-ctrl button.off { opacity: 0.35; }

/* ===== 弹窗 ===== */
.leaflet-popup-content-wrapper {
  background: rgba(26,26,46,0.95) !important;
  color: #e0e0e0 !important; border-radius: 12px !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
  backdrop-filter: blur(10px);
}
.leaflet-popup-tip { background: rgba(26,26,46,0.95) !important; }
.popup-content { min-width: 260px; max-width: 380px; font-size: 13px; line-height: 1.8; }
.popup-content .pop-title { font-size: 15px; font-weight: 700; color: #ff6b6b; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.popup-content .pop-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.popup-content .pop-label { color: #999; white-space: nowrap; }
.popup-content .pop-val { color: #e0e0e0; font-weight: 500; text-align: right; }
.popup-content .pop-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.popup-content .pop-badge.danger { background: rgba(211,47,47,0.2); color: #ff6b6b; }
.popup-content .pop-badge.warn { background: rgba(255,152,0,0.2); color: #ffb74d; }
.popup-content .pop-badge.info { background: rgba(33,150,243,0.2); color: #64b5f6; }
.popup-content .pop-desc { margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; color: #aaa; font-size: 12px; line-height: 1.7; border-left: 2px solid rgba(211,47,47,0.3); }

/* ===== 状态栏 ===== */
#status {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000;
  background: rgba(0,0,0,0.8); color: #fff; padding: 6px 20px;
  border-radius: 20px; font-size: 12px; display: none; pointer-events: none;
  white-space: nowrap;
}

/* ===== 侧边信息面板 ===== */
#side-panel-toggle {
  position: fixed; top: 68px; left: 16px; z-index: 999;
  width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(26,26,46,0.92); color: #ccc; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; backdrop-filter: blur(10px);
}
#side-panel-toggle:hover { background: rgba(211,47,47,0.2); border-color: #d32f2f; color: #fff; }
#side-panel-toggle.active { background: rgba(211,47,47,0.3); color: #ff6b6b; }

#side-panel {
  position: fixed; top: 68px; left: 64px; z-index: 998;
  width: 340px; max-height: calc(100vh - 100px); overflow-y: auto;
  background: rgba(17,24,39,0.95); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; color: #94a3b8; font-size: 13px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none; transition: all 0.3s ease;
}
#side-panel.show { display: block; animation: panelSlideIn 0.3s ease; }
@keyframes panelSlideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
#side-panel::-webkit-scrollbar { width: 4px; }
#side-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

#side-panel .sp-header {
  padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center;
}
#side-panel .sp-header h3 { font-size: 16px; color: #ef4444; font-weight: 700; }
#side-panel .sp-header .sp-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
  background: rgba(239,68,68,0.15); color: #ef4444;
}
#side-panel .sp-body { padding: 14px 16px; }
#side-panel .sp-section { margin-bottom: 16px; }
#side-panel .sp-section:last-child { margin-bottom: 0; }
#side-panel .sp-section h4 {
  font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
#side-panel .sp-section h4 .sp-icon { font-size: 14px; }
#side-panel .sp-contact-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
#side-panel .sp-contact-row:last-child { border-bottom: none; }
#side-panel .sp-contact-row .sp-label { color: #64748b; font-size: 12px; min-width: 56px; }
#side-panel .sp-contact-row .sp-value { color: #e2e8f0; font-weight: 500; flex: 1; }
#side-panel .sp-contact-row .sp-phone { color: #60a5fa; font-size: 12px; white-space: nowrap; }
#side-panel .sp-risk-item {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.1);
  font-size: 12px; line-height: 1.7;
}
#side-panel .sp-risk-item .sp-risk-name { color: #f87171; font-weight: 600; font-size: 13px; }
#side-panel .sp-risk-item .sp-risk-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-left: 6px;
  background: rgba(239,68,68,0.15); color: #f87171;
}
#side-panel .sp-risk-item .sp-risk-detail { color: #94a3b8; margin-top: 4px; }
#side-panel .sp-risk-item .sp-risk-contact { color: #60a5fa; font-size: 11px; }
#side-panel .sp-empty {
  text-align: center; padding: 20px; color: #555; font-size: 12px;
}
#side-panel .sp-text { color: #94a3b8; font-size: 12px; line-height: 1.6; }

/* 全镇概览特殊样式 */
#side-panel.overview .sp-header h3 { color: #f59e0b; }
#side-panel.overview .sp-header .sp-badge { background: rgba(245,158,11,0.15); color: #f59e0b; }

/* ===== 子菜单面板（村级详情） ===== */
.vp-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.15);
}
.vp-tab {
  padding: 8px 4px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03); color: #94a3b8;
  font-size: 12px; cursor: pointer; text-align: center;
  transition: all 0.2s; line-height: 1.3;
}
.vp-tab .vp-tab-icon { display: block; font-size: 15px; margin-bottom: 2px; }
.vp-tab:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
.vp-tab.active {
  background: rgba(239,68,68,0.16); border-color: rgba(239,68,68,0.45);
  color: #f87171; font-weight: 600;
}
.vp-content { padding: 12px 14px; }
.vp-content::-webkit-scrollbar { width: 4px; }
.vp-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.vp-sec-title {
  font-size: 11px; color: #64748b; letter-spacing: 1px;
  margin: 4px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.vp-sec-title .sp-icon { font-size: 13px; }

/* 联系人卡片 */
.vp-person {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
}
.vp-person .vp-role {
  font-size: 11px; color: #64748b; min-width: 64px; flex-shrink: 0;
}
.vp-person .vp-name { color: #e2e8f0; font-weight: 600; flex: 1; font-size: 13px; }
.vp-person .vp-phone { color: #60a5fa; font-size: 12px; white-space: nowrap; margin-right: 6px; }

/* 隐患点卡片 */
.vp-hazard {
  background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.12);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
}
.vp-hazard .vp-h-name { color: #f87171; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vp-hazard .vp-h-badge {
  font-size: 10px; padding: 1px 8px; border-radius: 10px;
  background: rgba(239,68,68,0.2); color: #fca5a5; font-weight: 600;
}
.vp-hazard .vp-h-scope { color: #94a3b8; font-size: 11px; margin: 4px 0 6px; }
.vp-hh {
  padding: 5px 8px; margin-bottom: 4px; border-radius: 6px;
  background: rgba(255,255,255,0.03); border-left: 2px solid rgba(239,68,68,0.3);
}
.vp-hh .vp-hh-top { display: flex; align-items: center; gap: 6px; }
.vp-hh .vp-hh-name { color: #e2e8f0; font-weight: 600; font-size: 12px; }
.vp-hh .vp-hh-count { color: #f87171; font-size: 11px; }
.vp-hh .vp-hh-list { color: #94a3b8; font-size: 11px; line-height: 1.6; margin-top: 3px; }
.vp-h-info { color: #64748b; font-size: 11px; margin-top: 5px; line-height: 1.5; }
.vp-h-info b { color: #60a5fa; font-weight: 600; }

/* 规则列表 */
.vp-rule {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  color: #94a3b8; font-size: 12px; line-height: 1.5;
}
.vp-rule .vp-rule-ico { flex-shrink: 0; font-size: 14px; }

/* 应急电话 */
.vp-phone-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; margin-bottom: 6px; border-radius: 8px;
  background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.15);
}
.vp-phone-item .vp-phone-dep { color: #e2e8f0; font-weight: 600; font-size: 13px; flex: 1; }
.vp-phone-item .vp-phone-duty { color: #64748b; font-size: 11px; }
.vp-phone-item .vp-phone-num { color: #60a5fa; font-size: 13px; font-weight: 600; }

/* 拨打按钮 */
.call-btn {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; border-radius: 13px; text-decoration: none;
  background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.3);
  color: #4ade80; font-size: 11px; cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.call-btn:hover { background: rgba(34,197,94,0.28); color: #86efac; }
.call-btn.red { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.3); color: #f87171; }
.call-btn.red:hover { background: rgba(239,68,68,0.28); color: #fca5a5; }

/* 空状态 */
.vp-empty {
  text-align: center; padding: 24px 10px; color: #555; font-size: 12px;
}

/* ===== 手机适配 ===== */
@media (max-width: 768px) {
  #topbar h1 { font-size: 13px; }
  #topbar .logo-icon { width: 28px; height: 28px; font-size: 14px; }
  #village-info { width: calc(100vw - 32px); left: 16px; right: 16px; max-height: 50vh; }
  #legend { bottom: 80px; font-size: 11px; padding: 8px 12px; }
  #layer-ctrl { right: 8px; bottom: 80px; }
  #layer-ctrl button { width: 36px; height: 36px; font-size: 14px; border-radius: 8px; }
  #stats-panel { top: 60px; left: 8px; }
  #stats-panel .stat-card { padding: 8px 12px; }
  #stats-panel .stat-card .stat-num { font-size: 18px; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div class="logo-area">
    <div class="logo-icon">&#x1F6E1;</div>
    <h1>新塬镇应急避险指挥系统</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="vuln.html" class="back-link">&#x1F3D4; 易发性分析</a>
    <a href="dashboard.html" class="back-link">&#x2190; 返回看板</a>
    <div class="village-select" id="villageSelect" onclick="toggleVillageDropdown()">
      <span id="currentVillage">全部村庄</span>
      <span class="arrow">&#x25BC;</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">退出</button>
  </div>
</div>

<div id="village-dropdown">
  <div class="v-item" data-vid="all" onclick="selectVillage('all', '全部村庄')">
    <span class="v-dot" style="background:#fff"></span>全部村庄
    <span class="v-count" id="count-all"></span>
  </div>
</div>

<div id="village-info">
  <div class="vi-header">
    <h3 id="vi-title">村庄信息</h3>
    <button class="vi-close" onclick="closeVillageInfo()">&times;</button>
  </div>

<script>
// ========== 权限验证 ==========
if (sessionStorage.getItem('xyc_auth') !== '1') {
  window.location.replace('index.html');
}

// ========== 村庄配置 ==========
// SHP数据中的村名映射（SHP名 → 完整名）
var SHP_VILLAGE_MAP = {
  '常坪村': '常家坪村',
  '河坝村': '杨家河坝村'
};

// 完整名 → SHP名
var REVERSE_SHP_MAP = {
  '常家坪村': '常坪村',
  '杨家河坝村': '河坝村'
};

// 从 village_centers.js 动态构建村庄列表
var VILLAGE_ORDER = ['上塬村', '东塬村', '刘家湾社区', '孟塬村', '常家坪村', '新塬村', '杨坪村', '杨家河坝村', '甘岔村', '老庄村'];
var VILLAGES = [{ id: 'all', name: '全部村庄', center: [36.15, 105.38], zoom: 13 }];

VILLAGE_ORDER.forEach(function(vname) {
  var shpName = REVERSE_SHP_MAP[vname] || vname;
  var center = VILLAGE_CENTERS[shpName];
  if (center) {
    VILLAGES.push({ id: vname, name: vname, center: [center.lat, center.lng], zoom: 16 });
  }
});

// ========== 全局变量 ==========
var map = null;
var layers = {};
var layerVisible = { hazards: true, routes: true, sites: true, threatened: true, majorRoads: true, placeNames: true };
var currentVillageId = 'all';
var MAP_BOUNDS = [[35.5, 104.5], [37.0, 106.8]];

// ========== 工具函数 ==========
// 各村切坡建房户数 / 隐患点数量（来源：《新塬镇一页纸数据》Excel，非矢量点位）
function getVillagePlanStats(vname) {
  var stats = { hazards: 0, households: 0, people: 0 };
  if (typeof VILLAGE_PLANS === 'undefined' || !VILLAGE_PLANS[vname]) return stats;
  var hazards = VILLAGE_PLANS[vname].hazards || [];
  stats.hazards = hazards.length;
  hazards.forEach(function(h) {
    var m = (h.scope || '').match(/(\d+)\s*户\s*(\d+)\s*人/);
    if (m) {
      stats.households += parseInt(m[1], 10);
      stats.people += parseInt(m[2], 10);
    }
  });
  return stats;
}

function showStatus(msg) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 3000);
}

// ========== WGS84 → GCJ-02 ==========
var PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
function isOutOfChina(lng, lat) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function transformLat(x, y) {
  var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320.0 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lng, lat) {
  if (isOutOfChina(lng, lat)) return [lng, lat];
  var dLat = transformLat(lng - 105.0, lat - 35.0);
  var dLng = transformLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * PI;
  var magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}
function convertCoords(obj) {
  if (obj === null || obj === undefined) return obj;
  if (Array.isArray(obj) && obj.length === 2 && typeof obj[0] === 'number' && typeof obj[1] === 'number') {
    return wgs84ToGcj02(obj[0], obj[1]);
  }
  if (Array.isArray(obj)) return obj.map(convertCoords);
  return obj;
}
function convertGeoJSON(geojson) {
  return JSON.parse(JSON.stringify(geojson), function(key, value) {
    if (key === 'coordinates') return convertCoords(value);
    return value;
  });
}

// SHP村名 → 完整村名
function shpToFullName(shpName) {
  return SHP_VILLAGE_MAP[shpName] || shpName;
}

// 完整村名 → SHP村名
function fullToShpName(fullName) {
  return REVERSE_SHP_MAP[fullName] || fullName;
}

// ========== 初始化地图 ==========
function initMap() {
  showStatus('正在加载地图...');

  map = L.map('map', {
    center: VILLAGES[0].center,
    zoom: 13,
    minZoom: 10,
    maxBounds: MAP_BOUNDS,
    maxBoundsViscosity: 0.8,
    zoomControl: false,
    attributionControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 高德卫星图
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3
  }).addTo(map);

  // 高德路网标注
  L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'], maxZoom: 18, minZoom: 3, opacity: 0.6
  }).addTo(map);

  // 初始化图层组
  layers.hazards = L.layerGroup().addTo(map);
  layers.routes = L.layerGroup().addTo(map);
  layers.sites = L.layerGroup().addTo(map);
  layers.backups = L.layerGroup().addTo(map);
  layers.stations = L.layerGroup().addTo(map);
  layers.rivers = L.layerGroup().addTo(map);
  layers.roads = L.layerGroup().addTo(map);
  layers.threatened = L.layerGroup().addTo(map);
  layers.majorRoads = L.layerGroup().addTo(map);
  layers.placeNames = L.layerGroup().addTo(map);

  // 加载数据
  loadHazardPoints();
  loadHazardAreas();
  loadEvacuationRoutes();
  loadEvacuationSites();
  loadBackupSites();
  loadRainStations();
  loadThreatenedAreas();
  loadLargeLayers();

  // 构建村庄下拉
  buildVillageDropdown();
  updateStats();

  showStatus('地图加载完成');
}

// ========== 加载数据图层 ==========
function loadHazardPoints() {
  if (typeof DATA_HAZARD_POINTS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_POINTS);
  var geojson = L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      var p = feature.properties;
      var risk = p.risk_level || '';
      var radius = 7;
      var fillColor = '#ff4444';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) {
        radius = 9; fillColor = '#d32f2f';
      } else if (risk.indexOf('一般') >= 0) {
        radius = 6; fillColor = '#ff7043';
      }
      return L.circleMarker(latlng, {
        radius: radius, fillColor: fillColor, color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var risk = p.risk_level || '';

      // 风险等级徽章
      var badgeClass = 'info';
      if (risk.indexOf('严重') >= 0 || risk.indexOf('重大') >= 0) badgeClass = 'danger';
      else if (risk.indexOf('一般') >= 0) badgeClass = 'warn';

      var html = '<div class="popup-content">';
      html += '<div class="pop-title">' + (p.HZXM || '隐患点') + ' 的家</div>';

      // 户主信息
      if (p.HZXM) html += '<div class="pop-row"><span class="pop-label">户主</span><span class="pop-val">' + p.HZXM + '</span></div>';
      if (p.phone) html += '<div class="pop-row"><span class="pop-label">电话</span><span class="pop-val">' + p.phone + '</span></div>';

      // 村组
      var cz = shpToFullName(p.CZ) || p.CZ;
      if (cz) html += '<div class="pop-row"><span class="pop-label">所属村组</span><span class="pop-val">' + cz + '</span></div>';

      // 风险等级
      if (risk) html += '<div class="pop-row"><span class="pop-label">风险等级</span><span class="pop-val"><span class="pop-badge ' + badgeClass + '">' + risk + '</span></span></div>';

      // 责任人
      if (p.resp_person) html += '<div class="pop-row"><span class="pop-label">避险责任人</span><span class="pop-val">' + p.resp_person + '</span></div>';
      if (p.resp_phone) html += '<div class="pop-row"><span class="pop-label">责任人电话</span><span class="pop-val">' + p.resp_phone + '</span></div>';

      // 避险点
      if (p.evac_site) html += '<div class="pop-row"><span class="pop-label">避险点</span><span class="pop-val">' + p.evac_site + '</span></div>';

      // 隐患详情（YHXX原始文本）
      if (p.YHXX) {
        var desc = p.YHXX.replace(/\n/g, '<br>');
        html += '<div class="pop-desc">' + desc + '</div>';
      }

      html += '</div>';
      layer.bindPopup(html, { maxWidth: 400, className: 'custom-popup' });
    }
  });
  layers.hazards.addLayer(geojson);
}

function loadHazardAreas() {
  if (typeof DATA_HAZARD_AREAS === 'undefined') return;
  var data = convertGeoJSON(DATA_HAZARD_AREAS);
  L.geoJSON(data, {
    style: { color: '#ff4444', fillColor: '#ff4444', fillOpacity: 0.12, weight: 2 },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.YCMC || p.XZQMC || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'hazard-tooltip' });
    }
  }).addTo(layers.hazards);
}

function loadEvacuationRoutes() {
  if (typeof DATA_EVACUATION_ROUTES === 'undefined') return;
  var data = convertGeoJSON(DATA_EVACUATION_ROUTES);
  L.geoJSON(data, {
    style: function(feature) {
      return { color: '#2196f3', weight: 4, opacity: 0.75, dashArray: '8, 6' };
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.ROAD_NAME || p.NAME || '';
      if (name) layer.bindTooltip(name, { direction: 'center', className: 'route-tooltip' });
    }
  }).addTo(layers.routes);
}

function loadEvacuationSites() {
  if (typeof DATA_EVACUATION_SITES === 'undefined') return;
  var data = convertGeoJSON(DATA_EVACUATION_SITES);
  L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 8, fillColor: '#4caf50', color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.NAME || p.MC || p.XZQMC || '安置点';
      layer.bindTooltip(name, { direction: 'top' });
    }
  }).addTo(layers.sites);
}

function loadBackupSites() {
  if (typeof DATA_BACKUP_SITES === 'undefined') return;
  var data = convertGeoJSON(DATA_BACKUP_SITES);
  L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 6, fillColor: '#ff9800', color: '#fff', weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function(feature, layer) {
      var p = feature.properties;
      var name = p.NAME || p.MC || '备选点';
      layer.bindTooltip(name, { direction: 'top' });
    }
  }).addTo(layers.backups);
}

function loadRainStations() {
  if (typeof DATA_RAIN_STATIONS === 'undefined') return;
  var data = convertGeoJSON(DATA_RAIN_STATIONS);
  L.geoJSON(data, {
    pointToLayer: function(feature, latlng) {
      return L.marker(latlng, {
        icon: L.divIcon({ className: 'rain-icon', html: '&#x1F4A7;', iconSize: [20, 20], iconAnchor: [10, 10] })
      });
    }
  }).addTo(layers.stations);
}

function loadThreatenedAreas() {
  if (typeof DATA_THREATENED_AREAS === 'undefined') return;
  var data = convertGeoJSON(DATA_THREATENED_AREAS);
  L.geoJSON(data, {
    style: { color: '#ff9800', fillColor: '#ff9800', fillOpacity: 0.15, weight: 2, dashArray: '5, 3' },
    onEachFeature: function(feature, layer) {
      layer.bindTooltip('受威胁区域', { direction: 'center', className: 'threatened-tooltip' });
    }
  }).addTo(layers.threatened);
}

function loadLargeLayers() {
  fetch('js_data/rivers_simple.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {
      eval(js);
      if (typeof DATA_RIVERS_SIMPLE !== 'undefined') {
        var data = convertGeoJSON(DATA_RIVERS_SIMPLE);
        L.geoJSON(data, {
          style: { color: '#00bcd4', weight: 1.5, opacity: 0.45 }
        }).addTo(layers.rivers);
      }
    })
    .catch(function() { console.log('河道数据加载失败'); });

  fetch('js_data/roads_simple.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {
      eval(js);
      if (typeof DATA_ROADS_SIMPLE !== 'undefined') {
        var data = convertGeoJSON(DATA_ROADS_SIMPLE);
        L.geoJSON(data, {
          style: { color: '#9e9e9e', weight: 1.5, opacity: 0.45 }
        }).addTo(layers.roads);
      }
    })
    .catch(function() { console.log('道路数据加载失败'); });

  // 主要道路（省道县道）
  fetch('js_data/major_roads.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {
      eval(js);
      if (typeof DATA_MAJOR_ROADS !== 'undefined') {
        var data = convertGeoJSON(DATA_MAJOR_ROADS);
        L.geoJSON(data, {
          style: { color: '#f5a623', weight: 2.5, opacity: 0.7 }
        }).addTo(layers.majorRoads);
      }
    })
    .catch(function() { console.log('主要道路数据加载失败'); });

  // 地名标注
  fetch('js_data/place_names.js')
    .then(function(r) { return r.text(); })
    .then(function(js) {
      eval(js);
      if (typeof DATA_PLACE_NAMES !== 'undefined') {
        var data = convertGeoJSON(DATA_PLACE_NAMES);
        // 只加载新塬镇范围内的地名（约36.0-36.3, 105.2-105.5）
        var filtered = { type: 'FeatureCollection', features: data.features.filter(function(f) {
          var c = f.geometry.coordinates;
          return c[0] > 105.2 && c[0] < 105.5 && c[1] > 35.95 && c[1] < 36.35;
        })};
        L.geoJSON(filtered, {
          pointToLayer: function(feature, latlng) {
            var name = feature.properties.MC || '';
            if (!name) return null;
            return L.marker(latlng, {
              icon: L.divIcon({
                className: 'place-label',
                html: '<div style="font-size:11px;color:#333;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;font-weight:500;">' + name + '</div>',
                iconSize: [0, 0], iconAnchor: [0, 0]
              })
            });
          }
        }).addTo(layers.placeNames);
      }
    })
    .catch(function() { console.log('地名数据加载失败'); });
}

// ========== 村庄下拉菜单 ==========
function buildVillageDropdown() {
  var dropdown = document.getElementById('village-dropdown');
  VILLAGES.forEach(function(v) {
    if (v.id === 'all') {
      var total = 0;
      VILLAGE_ORDER.forEach(function(vname) { total += getVillagePlanStats(vname).hazards; });
      document.getElementById('count-all').textContent = total + '处';
      return;
    }
    var stats = getVillagePlanStats(v.id);
    var div = document.createElement('div');
    div.className = 'v-item';
    div.setAttribute('data-vid', v.id);
    div.innerHTML = '<span class="v-dot"></span>' + v.name + '<span class="v-count">' + (stats.hazards > 0 ? stats.hazards + '处' : '') + '</span>';
    div.onclick = function() { selectVillage(v.id, v.name); };
    dropdown.appendChild(div);
  });
}

function toggleVillageDropdown() {
  var dd = document.getElementById('village-dropdown');
  var sel = document.getElementById('villageSelect');
  dd.classList.toggle('show');
  sel.classList.toggle('open');
}

function selectVillage(id, name) {
  currentVillageId = id;
  document.getElementById('currentVillage').textContent = name;
  document.getElementById('village-dropdown').classList.remove('show');
  document.getElementById('villageSelect').classList.remove('open');

  // 更新下拉高亮
  document.querySelectorAll('#village-dropdown .v-item').forEach(function(el) {
    el.classList.remove('active');
    if (el.getAttribute('data-vid') === id) el.classList.add('active');
  });

  var v = VILLAGES.find(function(v) { return v.id === id; });
  if (v) {
    map.flyTo(v.center, v.zoom, { duration: 1 });
  }

  // 显示/隐藏村庄信息面板
  if (id === 'all') {
    closeVillageInfo();
    if (sidePanelOpen) showSidePanelOverview();
  } else {
    showVillageInfo(id);
    if (sidePanelOpen) showSidePanelVillage(id);
  }
}

// ========== 村庄信息面板（子菜单模板） ==========
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 从文本提取电话号码
function extractPhone(str) {
  if (!str) return '';
  var m = str.match(/\d{11}|(?:\d{3,4})-?\d{7,8}/);
  return m ? m[0] : '';
}

var VP_TABS = [
  ['cmd', '&#x1F465;', '应急指挥'],
  ['transfer', '&#x26A0;', '转移谁'],
  ['when', '&#x23F0;', '何时转'],
  ['where', '&#x1F3E0;', '转何处'],
  ['return', '&#x1F6AB;', '不擅返'],
  ['phone', '&#x1F4DE;', '应急电话']
];

function renderVpTabContent(vid, tab, plan) {
  var has = plan !== null;
  if (tab === 'cmd') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F3E2;</span>应急指挥</div>';
    if (!has || (!plan.leader && !plan.town_contact)) return h + '<div class="vp-empty">暂无应急指挥信息</div>';
    if (plan.leader) {
      var lp = extractPhone(plan.leader);
      h += '<div class="vp-person"><span class="vp-role">总指挥</span><span class="vp-name">' + esc(plan.leader) + '</span>' +
        (lp ? '<span class="vp-phone">' + lp + '</span><a class="call-btn" href="tel:' + lp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
    }
    if (plan.town_contact) {
      var tp = extractPhone(plan.town_contact);
      h += '<div class="vp-person"><span class="vp-role">乡镇责任人</span><span class="vp-name">' + esc(plan.town_contact) + '</span>' +
        (tp ? '<span class="vp-phone">' + tp + '</span><a class="call-btn" href="tel:' + tp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
    }
    return h;
  }

  if (tab === 'transfer') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x26A0;</span>转移谁（隐患点明细）</div>';
    if (!has || !plan.hazards || plan.hazards.length === 0) return h + '<div class="vp-empty">暂无隐患点数据</div>';
    plan.hazards.forEach(function(hz, idx) {
      h += '<div class="vp-hazard">';
      h += '<div class="vp-h-name">' + (idx + 1) + '. ' + esc(hz.name) + (hz.scope ? '<span class="vp-h-badge">' + esc(hz.scope) + '</span>' : '') + '</div>';
      if (hz.persons && hz.persons.length > 0) {
        hz.persons.forEach(function(p) {
          if (!p.name) return;
          h += '<div class="vp-hh"><div class="vp-hh-top"><span class="vp-hh-name">' + esc(p.name) + '</span>' +
            (p.count ? '<span class="vp-hh-count">撤离 ' + esc(p.count) + ' 人</span>' : '') + '</div>';
          if (p.list) h += '<div class="vp-hh-list">' + esc(p.list) + '</div>';
          h += '</div>';
        });
      }
      if (hz.responsible) {
        var rp = extractPhone(hz.responsible);
        h += '<div class="vp-h-info">责任人：<b>' + esc(hz.responsible) + '</b>' + (rp ? ' <a class="call-btn red" href="tel:' + rp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
      }
      if (hz.shelter) h += '<div class="vp-h-info">安置点：' + esc(hz.shelter) + '</div>';
      h += '</div>';
    });
    return h;
  }

  if (tab === 'when') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x23F0;</span>何时转（转移时机）</div>';
    if (!has || !plan.rules_transfer || plan.rules_transfer.length === 0) return h + '<div class="vp-empty">暂无转移原则</div>';
    plan.rules_transfer.forEach(function(r) {
      h += '<div class="vp-rule"><span class="vp-rule-ico">&#x2705;</span><span>' + esc(r) + '</span></div>';
    });
    return h;
  }

  if (tab === 'where') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F3E0;</span>转何处（安置点）</div>';
    if (!has || !plan.shelters || plan.shelters.length === 0) return h + '<div class="vp-empty">暂无安置点数据</div>';
    plan.shelters.forEach(function(s, idx) {
      h += '<div class="vp-hazard" style="border-color:rgba(34,197,94,0.15);background:rgba(34,197,94,0.05);">';
      h += '<div class="vp-h-name" style="color:#4ade80;">' + (idx + 1) + '. ' + esc(s.name) + '</div>';
      if (s.shelter) h += '<div class="vp-h-info">安置地点：<b>' + esc(s.shelter) + '</b></div>';
      if (s.responsible) {
        var sp = extractPhone(s.responsible);
        h += '<div class="vp-h-info">安置点负责人：<b>' + esc(s.responsible) + '</b>' + (sp ? ' <a class="call-btn" href="tel:' + sp + '">&#x1F4DE; 拨打</a>' : '') + '</div>';
      }
      h += '</div>';
    });
    return h;
  }

  if (tab === 'return') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F6AB;</span>不擅返（返回规定）</div>';
    if (!has || !plan.rules_return || plan.rules_return.length === 0) return h + '<div class="vp-empty">暂无返回规定</div>';
    plan.rules_return.forEach(function(r) {
      h += '<div class="vp-rule"><span class="vp-rule-ico">&#x1F6D1;</span><span>' + esc(r) + '</span></div>';
    });
    return h;
  }

  if (tab === 'phone') {
    var h = '<div class="vp-sec-title"><span class="sp-icon">&#x1F4DE;</span>上级应急部门电话</div>';
    var contacts = (typeof AUTHORITY_CONTACTS !== 'undefined') ? AUTHORITY_CONTACTS : [];
    if (contacts.length === 0) return h + '<div class="vp-empty">暂无应急电话</div>';
    contacts.forEach(function(c) {
      var ph = c.phone || '';
      h += '<div class="vp-phone-item"><span class="vp-phone-dep">' + esc(c.department) + '</span>' +
        (c.duty ? '<span class="vp-phone-duty">' + esc(c.duty) + '</span>' : '') +
        '<span class="vp-phone-num">' + esc(ph) + '</span>' +
        '<a class="call-btn" href="tel:' + ph + '">&#x1F4DE;</a></div>';
    });
    return h;
  }
  return '';
}

// 渲染村级详情面板（子菜单）
function renderVillagePanel(vid, container) {
  var plan = (typeof VILLAGE_PLANS !== 'undefined' && VILLAGE_PLANS[vid]) ? VILLAGE_PLANS[vid] : null;
  var contentId = 'vp-content-' + encodeURIComponent(vid);
  var html = '<div class="vp-tabs">';
  VP_TABS.forEach(function(t, i) {
    html += '<div class="vp-tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t[0] + '"><span class="vp-tab-icon">' + t[1] + '</span>' + t[2] + '</div>';
  });
  html += '</div>';
  html += '<div class="vp-content" id="' + contentId + '">' + renderVpTabContent(vid, 'cmd', plan) + '</div>';
  container.innerHTML = html;

  var tabs = container.querySelectorAll('.vp-tab');
  for (var i = 0; i < tabs.length; i++) {
    (function(tab) {
      tab.onclick = function() {
        for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
        tab.classList.add('active');
        var c = document.getElementById(contentId);
        if (c) c.innerHTML = renderVpTabContent(vid, tab.getAttribute('data-tab'), plan);
      };
    })(tabs[i]);
  }
}

function showVillageInfo(vid) {
  var panel = document.getElementById('village-info');
  var title = document.getElementById('vi-title');
  var body = document.getElementById('vi-body');

  title.textContent = vid;
  panel.classList.add('show');
  document.getElementById('stats-panel').classList.add('hidden');

  renderVillagePanel(vid, body);
}

function closeVillageInfo() {
  document.getElementById('village-info').classList.remove('show');
  document.getElementById('stats-panel').classList.remove('hidden');
  document.getElementById('currentVillage').textContent = '全部村庄';
  currentVillageId = 'all';
  document.querySelectorAll('#village-dropdown .v-item').forEach(function(el) {
    el.classList.remove('active');
  });
  if (sidePanelOpen) showSidePanelOverview();
}

// ========== 图层切换 ==========
function toggleLayer(name) {
  layerVisible[name] = !layerVisible[name];
  var visible = layerVisible[name];
  var btn = document.getElementById('btn-' + name);
  if (visible) {
    if (name === 'sites') {
      layers.sites.addTo(map);
      layers.backups.addTo(map);
    } else {
      layers[name].addTo(map);
    }
  } else {
    if (name === 'sites') {
      layers.sites.remove();
      layers.backups.remove();
    } else {
      layers[name].remove();
    }
  }
  if (btn) {
    visible ? btn.classList.remove('off') : btn.classList.add('off');
  }
}

// ========== 定位 ==========
function locateMe() {
  if (!navigator.geolocation) { showStatus('浏览器不支持定位'); return; }
  showStatus('正在获取位置...');
  navigator.geolocation.getCurrentPosition(function(pos) {
    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
    L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
      radius: 8, fillColor: '#1976d2', color: '#fff', weight: 3, fillOpacity: 1
    }).addTo(map).bindPopup('我的位置');
    showStatus('已定位');
  }, function() { showStatus('无法获取位置'); });
}

// ========== 侧边信息面板 ==========
var sidePanelOpen = false;

function toggleSidePanel() {
  sidePanelOpen = !sidePanelOpen;
  var panel = document.getElementById('side-panel');
  var btn = document.getElementById('side-panel-toggle');
  if (sidePanelOpen) {
    panel.classList.add('show');
    btn.classList.add('active');
    if (currentVillageId === 'all') {
      showSidePanelOverview();
    } else {
      showSidePanelVillage(currentVillageId);
    }
  } else {
    panel.classList.remove('show');
    btn.classList.remove('active');
  }
}

function showSidePanelOverview() {
  var panel = document.getElementById('side-panel');
  var title = document.getElementById('sp-title');
  var badge = document.getElementById('sp-badge');
  var body = document.getElementById('sp-body');

  panel.className = 'overview';
  title.textContent = '新塬镇应急指挥体系';
  badge.textContent = '全镇概览';

  var totalHazards = 0;
  var totalPeople = 0;
  var totalHouseholds = 0;
  VILLAGE_ORDER.forEach(function(vname) {
    var s = getVillagePlanStats(vname);
    totalHazards += s.hazards;
    totalPeople += s.people;
    totalHouseholds += s.households;
  });
  var siteCount = (typeof DATA_EVACUATION_SITES !== 'undefined' ? DATA_EVACUATION_SITES.features.length : 0) +
                  (typeof DATA_BACKUP_SITES !== 'undefined' ? DATA_BACKUP_SITES.features.length : 0);
  var routeCount = (typeof DATA_EVACUATION_ROUTES !== 'undefined') ? DATA_EVACUATION_ROUTES.features.length : 0;

  var html = '';
  html += '<div class="sp-section"><h4><span class="sp-icon">&#x1F3DB;</span>镇级指挥</h4>';
  html += '<div class="sp-contact-row"><span class="sp-label">总指挥</span><span class="sp-value">杜小刚（镇党委书记）</span><span class="sp-phone">13884261308</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">副总指挥</span><span class="sp-value">李涛（镇长候选人）</span><span class="sp-phone">17393036917</span></div>';
  html += '</div>';

  html += '<div class="sp-section"><h4><span class="sp-icon">&#x1F4CA;</span>全镇数据</h4>';
  html += '<div class="sp-contact-row"><span class="sp-label">行政村</span><span class="sp-value">' + VILLAGE_ORDER.length + ' 个</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">切坡建房</span><span class="sp-value" style="color:#f59e0b;">' + totalHouseholds + ' 户</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">隐患区域</span><span class="sp-value" style="color:#f87171;">' + totalHazards + ' 处</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">受威胁人口</span><span class="sp-value" style="color:#f59e0b;">' + totalPeople + ' 人</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">安置点</span><span class="sp-value" style="color:#22c55e;">' + siteCount + ' 处</span></div>';
  html += '<div class="sp-contact-row"><span class="sp-label">撤离路线</span><span class="sp-value" style="color:#3b82f6;">' + routeCount + ' 条</span></div>';
  html += '</div>';

  html += '<div class="sp-section"><h4><span class="sp-icon">&#x1F4CD;</span>各村隐患点概览</h4>';
  VILLAGE_ORDER.forEach(function(vname) {
    var s = getVillagePlanStats(vname);
    var color = s.hazards > 0 ? '#f87171' : '#555';
    html += '<div class="sp-contact-row"><span class="sp-label">' + vname + '</span><span class="sp-value" style="color:' + color + ';">' + (s.hazards > 0 ? s.hazards + ' 处隐患点 · ' + s.households + '户' : '暂无数据') + '</span></div>';
  });
  html += '</div>';

  body.innerHTML = html;
  if (sidePanelOpen) panel.classList.add('show');
}

function showSidePanelVillage(vid) {
  var panel = document.getElementById('side-panel');
  var title = document.getElementById('sp-title');
  var badge = document.getElementById('sp-badge');
  var body = document.getElementById('sp-body');

  panel.className = '';
  title.textContent = vid;
  var isCommunity = vid.indexOf('社区') >= 0;
  badge.textContent = isCommunity ? '社区' : '行政村';

  renderVillagePanel(vid, body);
  if (sidePanelOpen) panel.classList.add('show');
}

// ========== 统计 ==========
function updateStats() {
  var hazardsTotal = 0;
  VILLAGE_ORDER.forEach(function(vname) { hazardsTotal += getVillagePlanStats(vname).hazards; });
  document.getElementById('stat-hazards').textContent = hazardsTotal;
  if (typeof DATA_EVACUATION_SITES !== 'undefined') {
    var sites = DATA_EVACUATION_SITES.features.length;
    if (typeof DATA_BACKUP_SITES !== 'undefined') {
      sites += DATA_BACKUP_SITES.features.length;
    }
    document.getElementById('stat-sites').textContent = sites;
  }
  if (typeof DATA_EVACUATION_ROUTES !== 'undefined') {
    document.getElementById('stat-routes').textContent = DATA_EVACUATION_ROUTES.features.length;
  }
  document.getElementById('stat-villages').textContent = VILLAGES.length - 1;
}

// ========== 退出 ==========
function doLogout() {
  sessionStorage.removeItem('xyc_auth');
  sessionStorage.removeItem('xyc_key');
  window.location.replace('index.html');
}

// ========== 关闭下拉（点击外部） ==========
document.addEventListener('click', function(e) {
  var dd = document.getElementById('village-dropdown');
  var sel = document.getElementById('villageSelect');
  if (!sel.contains(e.target) && !dd.contains(e.target)) {
    dd.classList.remove('show');
    sel.classList.remove('open');
  }
});

// ========== 启动 ==========
window.onload = function() {
  initMap();
  // 如果从仪表盘跳转过来，自动选中村庄
  var preVillage = sessionStorage.getItem('xyc_village');
  if (preVillage) {
    sessionStorage.removeItem('xyc_village');
    setTimeout(function() {
      selectVillage(preVillage, preVillage);
    }, 800);
  }
};
</script>
