<style>

:root {
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7f9fc;
  --ink:#14213d; --ink-2:#4a5878; --ink-3:#8a95ad;
  --line:#e3e8f0; --line-2:#d1d8e6;
  --brand:#0f2e4f; --brand-2:#1a4a7a; --brand-soft:#e7eff8;
  --accent:#2f6fed; --accent-soft:#eaf0ff;
  --red:#e2444a; --red-soft:#fdeaea; --orange:#ee8b24; --orange-soft:#fdf1e1;
  --green:#22a55b; --green-soft:#e6f6ed;
  --radius-lg:18px; --radius-md:13px; --radius-sm:9px;
  --shadow-sm:0 1px 3px rgba(20,33,61,.05),0 4px 12px rgba(20,33,61,.05);
  --sidebar-w:248px; --topbar-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);background:var(--bg)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
svg{display:block;flex:none}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0c2744 0%,#0f2e4f 60%,#113658 100%);color:#e6eef8;padding:22px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:10}
.sb-logo{padding:0 22px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .logo-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(155deg,#2a68b0,#184780);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(30,90,150,.35)}
.sb-logo .logo-ic svg{width:22px;height:22px}
.sb-logo .logo-t1{font-size:15.5px;font-weight:800;letter-spacing:.4px}
.sb-logo .logo-t2{font-size:10.5px;color:#97b4d4;margin-top:3px;letter-spacing:1.2px}
.sb-role{margin:16px 18px 10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.sb-role .sr-t{font-size:11px;color:#89a7c8;font-weight:500}
.sb-role .sr-n{font-size:15px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px}
.sb-role .sr-n .sr-badge{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:700;background:var(--accent);color:#fff}
.sb-menu{flex:1;padding:10px 12px;overflow-y:auto}
.sb-menu::-webkit-scrollbar{width:4px}
.sb-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.sb-group-t{font-size:10.5px;color:#718eb0;padding:14px 12px 8px;letter-spacing:1.2px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;font-size:14px;color:#c7d8ec;font-weight:500;margin-bottom:3px;transition:background-color .18s,color .18s,border-color .18s,transform .18s,opacity .18s,box-shadow .18s;position:relative}
.sb-item svg{width:19px;height:19px;color:#89a7c8}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:linear-gradient(90deg,rgba(47,111,237,.28),rgba(47,111,237,.08));color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sb-foot .sf-av{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.sb-foot .sf-av svg{width:20px;height:20px;color:#c7d8ec}
.sb-foot .sf-n{font-size:13px;font-weight:600}
.sb-foot .sf-s{font-size:10.5px;color:#89a7c8;margin-top:2px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.tb-left{display:flex;align-items:center;gap:16px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.crumb b{color:var(--ink);font-weight:700}
.crumb svg{width:14px;height:14px;color:var(--ink-3)}
.tb-right{display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.time-display{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.content{padding:24px 28px 40px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:22px}
.card-head{padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.ch-left{display:flex;align-items:center;gap:10px}
.ch-ic{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center}
.ch-ic svg{width:15px;height:15px;color:var(--brand-2)}
.ch-t{font-size:16px;font-weight:800}
.ch-sub{font-size:12px;color:var(--ink-3);margin-top:3px;font-weight:500}
.card-body{padding:18px 22px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.st-dot{width:9px;height:9px;border-radius:50%}
.st-dot.red{background:var(--red)} .st-dot.blue{background:var(--accent)}
.section-subtitle{font-size:12px;color:var(--ink-3)}
.warn-empty{text-align:center;color:var(--ink-3);padding:24px 0;font-size:13px}
@media (max-width:640px){.content{padding:14px}}

.team-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ts-chip{font-size:12px;font-weight:700;padding:6px 14px;border-radius:9px;background:var(--brand-soft);color:var(--brand-2)}
.team-list{display:flex;flex-direction:column;gap:10px}
.team-vill{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.team-vill-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--surface-2);font-size:14px;font-weight:700}
.team-vill-head:hover{background:var(--accent-soft)}
.tv-meta{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:auto}
.tv-arrow{font-size:10px;color:var(--ink-3);transition:transform .2s}
.team-vill.open .tv-arrow{transform:rotate(90deg)}
.team-vill-body{display:none;padding:8px 16px}
.team-vill.open .team-vill-body{display:block}
.team-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px dashed var(--line-2)}
.team-row .tr-group{font-size:11px;font-weight:700;color:var(--brand-2);background:var(--brand-soft);padding:4px 10px;border-radius:7px;flex:none}
.team-row .tr-leader{flex:1;min-width:0}
.team-row .tr-name{font-size:13.5px;font-weight:700}
.team-row .tr-members{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.team-row .tr-phone{font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);padding:6px 11px;border-radius:8px;text-decoration:none;flex:none}

/* ===== 无障碍与动效偏好（reduced-motion / 键盘焦点）===== */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
/* ===== 界面细节打磨（make-interfaces-feel-better）===== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,a,.btn,input,select{touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:not(:disabled):active{transform:scale(.96)}
</style>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function doLogout() {
  sessionStorage.removeItem('xyc_auth');
  sessionStorage.removeItem('xyc_key');
  sessionStorage.removeItem('xyc_admin');
  sessionStorage.removeItem('xyc_role');
  sessionStorage.removeItem('xyc_village');
  window.location.replace('index.html');
}
function updateTime() {
  var now = new Date();
  var str = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  document.getElementById('timeDisplay').textContent = str;
}
updateTime();
setInterval(updateTime, 1000);

// 身份展示
(function(){
  var role = sessionStorage.getItem('xyc_role') || '村级';
  var key = sessionStorage.getItem('xyc_key') || 'XYC-2024-XXXX';
  var roleName = { '管理员':'管理员', '镇级':'镇级干部', '村级':'村级干部', '社长':'社长' }[role] || role;
  var badge = { '管理员':'全部权限', '镇级':'全镇调度', '村级':'本村数据', '社长':'本社数据' }[role] || '';
  ['pcRoleName','pcFootName'].forEach(function(id){ var e = document.getElementById(id); if (e) e.textContent = roleName; });
  var b = document.getElementById('pcRoleBadge'); if (b) b.textContent = badge;
  var k = document.getElementById('pcFootKey'); if (k) k.textContent = key;
  var isAdmin = sessionStorage.getItem('xyc_admin') === '1' || role === '管理员';
  document.getElementById('pcMenuAdmin').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('pcMenuHealth').style.display = (isAdmin || role === '镇级') ? 'flex' : 'none';
})();
</script>
<script>
// 队伍数据加载（village_teams.js，登录后经 /api/data 取数，与数据看板同一数据源）
var VILLAGE_TEAMS = undefined;
var TEAM_LOADED = false;
var VILLAGE_ORDER = ['上塬村', '东塬村', '刘家湾社区', '孟塬村', '常家坪村', '新塬村', '杨坪村', '杨家河坝村', '甘岔村', '老庄村'];
(function(){
  try {
    var o = sessionStorage.getItem('xyc_village_order');
    if (o) { var arr = JSON.parse(o); if (Array.isArray(arr) && arr.length) VILLAGE_ORDER = arr; }
  } catch(e) {}
})();

function teamsDataReady() {
  return typeof VILLAGE_TEAMS !== 'undefined' && VILLAGE_TEAMS;
}
function renderTeams() {
  var listEl = document.getElementById('teamList');
  var sumEl = document.getElementById('teamSummary');
  if (!teamsDataReady()) {
    listEl.innerHTML = '<div class="warn-empty">队伍数据加载中…</div>';
    if (sumEl) sumEl.innerHTML = '';
    return;
  }
  var totalTeams = 0, totalPeople = 0;
  var chips = '';
  VILLAGE_ORDER.forEach(function(v) {
    var arr = VILLAGE_TEAMS[v];
    if (!arr || !arr.length) return;
    totalTeams += arr.length;
    arr.forEach(function(t) { totalPeople += (t.count || 0); });
  });
  chips += '<span class="ts-chip">' + totalTeams + ' 支队伍</span>';
  chips += '<span class="ts-chip">' + totalPeople + ' 人</span>';
  sumEl.innerHTML = chips;

  listEl.innerHTML = '';
  VILLAGE_ORDER.forEach(function(v) {
    var arr = VILLAGE_TEAMS[v];
    if (!arr || !arr.length) return;
    var people = 0;
    arr.forEach(function(t) { people += (t.count || 0); });
    var div = document.createElement('div');
    div.className = 'team-vill';
    div.innerHTML =
      '<div class="team-vill-head" onclick="event.stopPropagation();this.parentElement.classList.toggle(\'open\')">' +
        '<span>' + esc(v) + '</span>' +
        '<span class="tv-meta">' + arr.length + ' 支队伍 · ' + people + ' 人</span>' +
        '<span class="tv-arrow">&#x25B6;</span>' +
      '</div>' +
      '<div class="team-vill-body">' + buildTeamRows(arr) + '</div>';
    listEl.appendChild(div);
  });
}
function buildTeamRows(arr) {
  var html = '';
  arr.forEach(function(t) {
    var name = t.team || (t.group || '');
    var members = t.members || '';
    html += '<div class="team-row">' +
      '<div class="tr-group">' + esc(t.group || '') + '</div>' +
      '<div class="tr-leader">' +
        '<span class="tr-name">' + esc(name) + '</span>' +
        (members ? '<div class="tr-members">成员：' + esc(members) + '</div>' : '') +
        '<div class="tr-members">负责人：' + esc(t.leader || '-') + '</div>' +
      '</div>' +
      (t.phone ? '<a class="tr-phone" href="tel:' + esc(t.phone) + '">' + esc(t.phone) + '</a>' : '') +
    '</div>';
  });
  return html;
}

function loadTeams(attempt) {
  attempt = attempt || 0;
  if (teamsDataReady()) { renderTeams(); return; }
  loadSecureData(['village_teams.js'], function() {
    if (teamsDataReady()) { renderTeams(); return; }
    if (attempt < 2) { setTimeout(function() { loadTeams(attempt + 1); }, 600); }
    else { renderTeams(); }
  });
}
loadTeams();
</script>
